<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget Pro">
<meta name="theme-color" content="#0A0C0F">
<!-- Cache-busting : force le navigateur à revérifier à chaque visite -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Budget Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root,[data-theme="dark"]{
  --bg:#0A0C0F;--bg2:#0E1016;--bg3:#131519;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --text:#F0ECE6;--dim:#999;--muted:#50545E;
  --gold:#818CF8;--green:#7EC8A9;--pink:#C87EA9;--blue:#7EA9C8;--red:#C85555;--purple:#A78BFA;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --font:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Consolas,monospace;
  --R:20px;--Rs:14px;--Rx:8px;
  /* Glass tokens */
  --glass-bg:rgba(22,25,31,.55);--glass-border:rgba(255,255,255,.1);--glass-blur:25px;
  --glass-shadow:0 8px 32px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05);
  /* Mesh gradient bg */
  --mesh:radial-gradient(ellipse at 20% 0%,rgba(99,102,241,.1) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(139,92,246,.08) 0%,transparent 50%),var(--bg);
}
/* ── LIGHT THEME — Glass-Swiss (Gemini style) ── */
[data-theme="light"]{
  --bg:#C9D6F0;--bg2:#FFFFFF;--bg3:#E4EAF2;--border:rgba(0,0,0,.06);--border2:rgba(0,0,0,.1);
  --text:#1A1D23;--dim:#555E6E;--muted:#8891A0;
  --gold:#007AFF;--green:#34C759;--pink:#FF2D55;--blue:#5856D6;--red:#FF3B30;--purple:#AF52DE;
  --glass-bg:rgba(255,255,255,.58);--glass-border:rgba(255,255,255,.75);--glass-blur:28px;
  --glass-shadow:0 2px 16px rgba(100,80,160,.08);
  --mesh:linear-gradient(140deg,#c3cfe2 0%,#c5b9d6 25%,#b8c6e0 50%,#d4c4e8 75%,#c0d0f0 100%);
}
[data-theme="light"] body{background:linear-gradient(140deg,#c3cfe2 0%,#c5b9d6 25%,#b8c6e0 50%,#d4c4e8 75%,#c0d0f0 100%);background-attachment:fixed}
[data-theme="light"] .hdr{background:transparent}
[data-theme="light"] .card{background:var(--glass-bg);border-color:var(--glass-border);box-shadow:var(--glass-shadow);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
[data-theme="light"] .pill{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.8);color:#555E6E;font-weight:600}
[data-theme="light"] .pill.on{background:rgba(0,122,255,.12);border-color:#007AFF;color:#007AFF}
[data-theme="light"] .litem{background:rgba(255,255,255,.5);border-color:rgba(255,255,255,.7)}
[data-theme="light"] .sub-card{border-bottom:1px solid rgba(0,0,0,.06)}
[data-theme="light"] .goal-card{border-bottom:1px solid rgba(0,0,0,.06)}
[data-theme="light"] .asset-row{border-bottom:1px solid rgba(0,0,0,.06)}
[data-theme="light"] .fc-row{border-bottom:1px solid rgba(0,0,0,.06)}
[data-theme="light"] .alert-row{border-bottom:1px solid rgba(0,0,0,.04)}
[data-theme="light"] .sim-result{background:rgba(255,255,255,.5);border-color:rgba(255,255,255,.7)}
[data-theme="light"] .imp-stat{background:rgba(255,255,255,.5);border-color:rgba(255,255,255,.7)}
[data-theme="light"] .cal-day.has-event{border-color:rgba(0,0,0,.06);background:rgba(255,255,255,.35)}
[data-theme="light"] .cal-day.today{box-shadow:0 0 10px rgba(0,122,255,.25)}
[data-theme="light"] .cal-day.selected{background:rgba(0,122,255,.12)!important;border-color:var(--gold)!important}
[data-theme="light"] .logo-search{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.75)}
[data-theme="light"] .bnav{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
[data-theme="light"] .sheet-box{background:rgba(255,255,255,.93);backdrop-filter:blur(35px);-webkit-backdrop-filter:blur(35px);border-top:1px solid rgba(255,255,255,.8)}
[data-theme="light"] .sheet-title{color:#1A1D23}
[data-theme="light"] .fi,[data-theme="light"] .fi:focus,[data-theme="light"] .fs,[data-theme="light"] .logo-search{background:rgba(255,255,255,.65);border-color:rgba(255,255,255,.85);color:#1A1D23}
[data-theme="light"] .fi::placeholder,[data-theme="light"] .fs::placeholder{color:#8891A0}
[data-theme="light"] .h-title{color:#1A1D23;font-weight:800;font-size:26px}
[data-theme="light"] .eyebrow{display:none}
[data-theme="light"] .submit{color:#fff;background:linear-gradient(135deg,#007AFF,#5856D6)}
[data-theme="light"] .toast{background:#007AFF;color:#fff}
[data-theme="light"] .sub-nm,.sub-pr,[data-theme="light"] .asset-nm{color:#1A1D23}
[data-theme="light"] .hdr-avatar{color:#fff;background:linear-gradient(135deg,#007AFF,#5856D6)!important;border-color:rgba(0,122,255,.3)!important;box-shadow:0 2px 12px rgba(0,122,255,.25)!important}
[data-theme="light"] .kpi{background:var(--glass-bg);border-color:var(--glass-border);box-shadow:var(--glass-shadow);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
[data-theme="light"] .kpi-v{font-weight:800}
[data-theme="light"] .kpi-l{color:#555E6E;font-weight:700}
[data-theme="light"] .card-t{color:#555E6E;font-weight:700}
[data-theme="light"] .tx-lb{color:#1A1D23;font-weight:700}
[data-theme="light"] .tx-am{color:#1A1D23;font-weight:800}
[data-theme="light"] .tx-mt{color:#6B7280}
[data-theme="light"] .tx-am.p{color:#1A1D23}
[data-theme="light"] .tx-am.g{color:#059669}
[data-theme="light"] .tx-fb,.tx-logo{background:rgba(0,0,0,.04)!important}
[data-theme="light"] .bar-bg{background:rgba(0,0,0,.06)}
[data-theme="light"] .bar-fill{background:linear-gradient(90deg,#007AFF,#34C759)}
[data-theme="light"] .bar-fill.over{background:linear-gradient(90deg,#FF3B30,#FF6B6B)}
[data-theme="light"] .bnav-fab{background:linear-gradient(135deg,#007AFF,#5856D6)!important;box-shadow:0 4px 20px rgba(0,122,255,.35)}
[data-theme="light"] .bnav-btn.on{color:#007AFF}
[data-theme="light"] .bnav-btn.on::after{background:#007AFF}
[data-theme="light"] .bnav-fab-lb{color:#007AFF}
[data-theme="light"] .mbtn{background:rgba(255,255,255,.5);border-color:rgba(255,255,255,.7);color:#555E6E}
[data-theme="light"] .hdr-avatar.empty{background:rgba(255,255,255,.5)!important;color:#8891A0;box-shadow:none!important;border-color:rgba(255,255,255,.7)!important}
/* ── HELLO KITTY THEME ── */
[data-theme="kitty"]{
  --bg:#FFF0F5;--bg2:#FFF5F8;--bg3:#FFE4EE;--border:rgba(255,105,180,.15);--border2:rgba(255,105,180,.25);
  --text:#4A1535;--dim:#7A3D5A;--muted:#8B5070;
  --gold:#FF69B4;--green:#FF85C2;--pink:#E91E8C;--blue:#9B59B6;--red:#CC0066;--purple:#7C3AED;
  --glass-bg:rgba(255,255,255,.45);--glass-border:rgba(255,255,255,.6);--glass-blur:25px;
  --glass-shadow:0 4px 20px rgba(255,105,180,.1);
  --mesh:radial-gradient(ellipse at 30% 0%,rgba(255,105,180,.1) 0%,transparent 50%),radial-gradient(ellipse at 70% 100%,rgba(255,182,193,.1) 0%,transparent 50%),linear-gradient(160deg,#FFE4EE,#FFF0F5);
}
[data-theme="kitty"] body{background:linear-gradient(160deg,#FFE4EE,#FFF0F5)}
[data-theme="kitty"] .hdr{background:transparent}
[data-theme="kitty"] .card{background:var(--glass-bg);border-color:var(--glass-border);box-shadow:var(--glass-shadow);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
[data-theme="kitty"] .pill{background:rgba(255,255,255,.4);border-color:rgba(255,255,255,.6)}
[data-theme="kitty"] .pill.on{background:rgba(255,105,180,.15);border-color:#FF69B4;color:#FF69B4}
[data-theme="kitty"] .litem{background:rgba(255,255,255,.4);border-color:rgba(255,255,255,.5)}
[data-theme="kitty"] .sub-card{border-bottom:1px solid rgba(255,105,180,.1)}
[data-theme="kitty"] .goal-card{border-bottom:1px solid rgba(255,105,180,.1)}
[data-theme="kitty"] .asset-row{border-bottom:1px solid rgba(255,105,180,.1)}
[data-theme="kitty"] .fc-row{border-bottom:1px solid rgba(255,105,180,.08)}
[data-theme="kitty"] .alert-row{border-bottom:1px solid rgba(255,105,180,.08)}
[data-theme="kitty"] .sim-result{background:rgba(255,255,255,.4);border-color:rgba(255,255,255,.5)}
[data-theme="kitty"] .imp-stat{background:rgba(255,255,255,.35);border-color:rgba(255,255,255,.5)}
[data-theme="kitty"] .cal-day.has-event{border-color:rgba(255,105,180,.15);background:rgba(255,255,255,.25)}
[data-theme="kitty"] .cal-day.today{box-shadow:0 0 8px rgba(255,105,180,.25)}
[data-theme="kitty"] .cal-day.selected{background:rgba(255,105,180,.12)!important;border-color:#FF69B4!important}
[data-theme="kitty"] .logo-search{background:rgba(255,255,255,.5);border-color:rgba(255,255,255,.6)}
[data-theme="kitty"] .bnav{background:rgba(255,240,245,.5);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
[data-theme="kitty"] .sheet-box{background:rgba(255,245,248,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-top:1px solid rgba(255,255,255,.6)}
[data-theme="kitty"] .sheet-title{color:#4A1535}
[data-theme="kitty"] .fi,[data-theme="kitty"] .fs,[data-theme="kitty"] .logo-search{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.7);color:#4A1535}
[data-theme="kitty"] .submit{color:#fff}
[data-theme="kitty"] .toast{background:#FF69B4;color:#fff}
[data-theme="kitty"] .h-title{font-weight:800;color:#CC0066;text-shadow:0 1px 3px rgba(204,0,102,.12)}
[data-theme="kitty"] .h-title::after{content:' 🎀'}
[data-theme="kitty"] .eyebrow{color:#FF69B4}
[data-theme="kitty"] .card-t::before{content:'✨ ';letter-spacing:0}
[data-theme="kitty"] .hdr-avatar{color:#fff}
[data-theme="kitty"] .sub-nm,[data-theme="kitty"] .asset-nm{color:#4A1535}
[data-theme="kitty"] .fi::placeholder,[data-theme="kitty"] .fs::placeholder{color:#8B5070}
[data-theme="kitty"] .fi:focus,[data-theme="kitty"] .fs:focus{border-color:#FF69B4;box-shadow:0 0 0 3px rgba(255,105,180,.15);color:#2D0A1E}
[data-theme="kitty"] .kpi{background:var(--glass-bg);border-color:var(--glass-border);box-shadow:var(--glass-shadow);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
[data-theme="kitty"] .kpi-v{color:#4A1535}
[data-theme="kitty"] .kpi-s.g{color:#CC0066}
[data-theme="kitty"] .kpi-s.p{color:#E91E8C}
[data-theme="light"] .kpi-v{color:#1A1D23}
[data-theme="kitty"] .tx-lb{color:#4A1535}
[data-theme="kitty"] .sub-pr{color:#4A1535}
/* ── ANIMATIONS ── */
@keyframes vIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.view-in{animation:vIn .22s cubic-bezier(.4,0,.2,1) both}
html.theme-fx,html.theme-fx *,html.theme-fx *::before,html.theme-fx *::after{
  transition:background-color .32s ease,color .22s ease,border-color .28s ease,box-shadow .28s ease !important}
/* ── THEME SELECTOR ── */
.theme-row{display:flex;gap:8px;margin-top:6px}
.theme-btn{flex:1;padding:10px 6px;border-radius:14px;border:2px solid var(--border2);cursor:pointer;font-family:var(--mono);font-size:9px;text-align:center;transition:all .2s;background:var(--bg3);color:var(--dim);letter-spacing:.5px}
.theme-btn.on{border-color:var(--gold);color:var(--gold)}
.th-swatches{display:flex;gap:3px;justify-content:center;margin-bottom:6px}
.th-swatches span{width:9px;height:9px;border-radius:50%;display:inline-block}
/* ── PROFILE PHOTO ── */
.prof-photo-wrap{position:relative;width:80px;height:80px;border-radius:50%;margin:0 auto 10px;cursor:pointer}
.prof-photo-img{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#818CF8,#A78BFA);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:#fff;overflow:hidden;border:3px solid rgba(129,140,248,.3)}
.prof-photo-img img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.prof-photo-overlay{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:20px;opacity:0;transition:opacity .2s;pointer-events:none}
.prof-photo-wrap:hover .prof-photo-overlay{opacity:1}
/* ── FILE FORMAT TABS ── */
.file-tab-row{display:flex;gap:8px;margin-bottom:12px}
.file-tab{flex:1;padding:10px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;font-family:var(--mono);font-size:10px;color:var(--muted);transition:all .15s;letter-spacing:.5px}
.file-tab.on{border-color:var(--gold);color:var(--gold);background:rgba(129,140,248,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--mesh,var(--bg));color:var(--text);font-family:var(--font);min-height:100vh;overscroll-behavior:none;letter-spacing:.01em}
@keyframes meshDrift{0%{background-position:0% 0%,100% 100%}50%{background-position:50% 30%,30% 70%}100%{background-position:0% 0%,100% 100%}}
[data-theme="dark"] body{background-size:120% 120%,120% 120%,100% 100%;animation:meshDrift 20s ease-in-out infinite}
.app{display:flex;flex-direction:column;height:100vh;padding-top:var(--safe-top);overflow:hidden}
.hdr{padding:12px 16px 6px;flex-shrink:0;background:transparent}
.hdr-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hdr-left{display:flex;align-items:center;gap:11px}
.hdr-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#818CF8,#A78BFA);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0;border:1px solid rgba(129,140,248,.3);box-shadow:0 2px 12px rgba(129,140,248,.25)}
.hdr-avatar.empty{background:var(--border);color:var(--dim);box-shadow:none;border-color:var(--border2)}
.eyebrow{font-size:10px;letter-spacing:2px;color:var(--gold);font-family:var(--mono);text-transform:uppercase;margin-bottom:2px;opacity:.8}
.h-title{font-size:24px;font-weight:700;color:var(--text);letter-spacing:-.5px}
.mnav{display:flex;align-items:center;gap:4px}
.mbtn{background:var(--border);border:1px solid var(--border2);color:var(--dim);width:38px;height:38px;border-radius:10px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s cubic-bezier(.16,1,.3,1);min-width:44px;min-height:44px}
.mbtn:active{background:var(--border2)}
.mlbl{font-family:var(--mono);font-size:10px;color:var(--dim);min-width:56px;text-align:center;font-weight:500}
.main{flex:1;min-height:0;padding:10px 16px calc(120px + var(--safe-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}
/* Bottom Nav — Floating Pill */
.bnav{position:fixed;bottom:calc(16px + var(--safe-bottom));left:5%;width:90%;background:var(--glass-bg,rgba(10,12,15,.65));backdrop-filter:blur(var(--glass-blur,25px));-webkit-backdrop-filter:blur(var(--glass-blur,25px));border:1px solid var(--glass-border,rgba(255,255,255,.1));border-radius:var(--nav-radius,32px);display:flex;align-items:center;justify-content:space-around;padding:8px 6px;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.06);min-height:72px}
.bnav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;border:none;background:none;color:var(--muted);cursor:pointer;flex:1;min-width:0;transition:color .3s cubic-bezier(.16,1,.3,1),transform .3s cubic-bezier(.16,1,.3,1);-webkit-tap-highlight-color:transparent;position:relative}
.bnav-btn.on{color:var(--gold);transform:scale(1.08)}
.bnav-btn.on::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--gold)}
.bnav-ic{font-size:22px;line-height:1}
.bnav-lb{font-family:var(--font);font-size:9px;font-weight:600;letter-spacing:.3px;white-space:nowrap;opacity:.85}
.bnav-fab{position:relative;top:-10px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--purple));border:3px solid rgba(255,255,255,.25);color:#fff;font-size:26px;line-height:52px;text-align:center;cursor:pointer;box-shadow:0 6px 24px rgba(99,102,241,.35);-webkit-tap-highlight-color:transparent;transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s}
.bnav-fab:active{transform:scale(.88)}
.bnav-fab-wrap{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0}
.bnav-fab-lb{font-family:var(--font);font-size:8px;font-weight:600;letter-spacing:.3px;color:var(--gold);margin-top:0}
.nav-more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 0}
.nav-more-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:var(--Rs);border:1px solid var(--glass-border);background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .2s cubic-bezier(.16,1,.3,1)}
.nav-more-item:active{transform:scale(.96)}
.nav-more-item .nmi-ic{font-size:22px}
.nav-more-item .nmi-lb{font-family:var(--font);font-size:11px;font-weight:500;letter-spacing:.3px}
/* Cards — Glass (3 variants) */
.card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--R);padding:18px;margin-bottom:12px;box-shadow:var(--glass-shadow);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s}
.card-t{font-family:var(--mono);font-size:9px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;margin-bottom:12px;font-weight:500}
/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--Rs);padding:16px;box-shadow:var(--glass-shadow);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));transition:transform .3s cubic-bezier(.16,1,.3,1)}
.kpi.w3{grid-column:1/-1}
.kpi-l{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.kpi-v{font-size:22px;font-weight:700;letter-spacing:-.5px;color:var(--text);font-variant-numeric:tabular-nums}
.kpi-s{font-family:var(--mono);font-size:11px;margin-right:1px}
/* TX */
.tx{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);gap:11px;transition:background .15s}
.tx:last-child{border-bottom:none}
.tx-logo{width:36px;height:36px;border-radius:10px;object-fit:contain;background:rgba(255,255,255,.06);flex-shrink:0}
.tx-fb{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:var(--mono);flex-shrink:0}
.tx-inf{flex:1;min-width:0}
.tx-lb{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-mt{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.tx-am{font-family:var(--mono);font-size:15px;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums;text-align:right;min-width:90px}
.tx-del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 0 2px 6px;line-height:1;flex-shrink:0}
.g{color:var(--green)}.p{color:var(--pink)}.b{color:var(--blue)}.r{color:var(--red)}.gold{color:var(--gold)}
/* Forms */
.fg{display:flex;flex-direction:column;gap:13px}
.fl{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-weight:500}
.fi,.fs{background:rgba(255,255,255,.06);border:1px solid var(--glass-border);color:var(--text);padding:12px 14px;font-family:var(--mono);font-size:14px;border-radius:var(--Rs);outline:none;width:100%;-webkit-appearance:none;appearance:none;transition:all .2s cubic-bezier(.16,1,.3,1)}
.fi:focus,.fs:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(129,140,248,.15);background:rgba(255,255,255,.1)}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
/* Pills */
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.06);border:1px solid var(--glass-border);color:var(--muted);font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:8px 14px;cursor:pointer;text-transform:uppercase;border-radius:20px;transition:all .2s cubic-bezier(.16,1,.3,1);font-weight:500;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill.on{border-color:var(--gold);color:var(--gold);background:rgba(129,140,248,.12)}
.pill.on-g{border-color:var(--green);color:var(--green);background:rgba(126,200,169,.1)}
.pill.on-p{border-color:var(--pink);color:var(--pink);background:rgba(200,126,169,.1)}
.submit{background:linear-gradient(135deg,#818CF8,#A78BFA);color:#fff;border:none;padding:16px;font-family:var(--font);font-size:14px;font-weight:700;letter-spacing:.5px;cursor:pointer;border-radius:var(--Rs);width:100%;margin-top:4px;box-shadow:0 4px 20px rgba(99,102,241,.3);transition:all .3s cubic-bezier(.16,1,.3,1)}
.submit:active{transform:scale(.96);opacity:.9}
/* Bars */
.bar-bg{height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.bar-fill{height:6px;border-radius:4px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.bar-bg.thin{height:3px}.bar-fill.thin{height:3px}
/* Misc */
.empty{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;padding:24px 0}
.row-between{display:flex;justify-content:space-between;align-items:center}
.mono{font-family:var(--mono)}.sm{font-size:11px}.xs{font-size:10px}.xxs{font-size:9px}
/* Toast */
.toast{position:fixed;top:calc(var(--safe-top)+12px);left:50%;transform:translateX(-50%) translateY(-8px);background:linear-gradient(135deg,#818CF8,#A78BFA);color:#fff;padding:12px 24px;border-radius:28px;font-family:var(--font);font-size:13px;font-weight:700;z-index:9999;white-space:nowrap;box-shadow:0 8px 32px rgba(99,102,241,.3);opacity:0;transition:all .3s cubic-bezier(.16,1,.3,1);pointer-events:none;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Alerts */
.alert{border:1px solid;padding:12px 14px;margin-bottom:12px;border-radius:var(--Rs)}
.alert.urg{background:rgba(200,85,85,.08);border-color:rgba(200,85,85,.3)}
.alert.soon{background:rgba(255,170,68,.06);border-color:rgba(255,170,68,.25)}
.alert-t{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.alert-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.alert-row:last-child{border-bottom:none}
.badge{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:12px;font-weight:700}
.badge.urg{background:rgba(200,85,85,.25);color:#ff7070}
.badge.soon{background:rgba(255,170,68,.2);color:#ffaa44}
.badge.ok{background:rgba(126,200,169,.15);color:var(--green)}
/* Subs */
.sub-card{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);gap:10px}
.sub-card:last-child{border-bottom:none}
.sub-logo{width:36px;height:36px;border-radius:10px;object-fit:contain;background:rgba(255,255,255,.06);flex-shrink:0}
.sub-fb{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:var(--mono);flex-shrink:0}
.sub-inf{flex:1;min-width:0;cursor:pointer}
.sub-nm{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-mt{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.sub-rt{text-align:right;flex-shrink:0}
.sub-pr{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text)}
.sub-due{font-family:var(--mono);font-size:10px;margin-top:2px}
.sub-acts{display:flex;gap:4px;flex-shrink:0}
.sab{background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:9px;padding:5px 7px;cursor:pointer;border-radius:6px;transition:all .15s}
.sab.rn{border-color:rgba(126,200,169,.3);color:var(--green)}
.sab.ed{border-color:rgba(126,169,200,.3);color:var(--blue)}
.sab.dl{border-color:rgba(200,85,85,.3);color:var(--red)}
/* Logo picker */
.logo-search{background:rgba(0,0,0,.4);border:1px solid var(--border);color:var(--text);padding:10px 12px;font-family:var(--mono);font-size:13px;border-radius:var(--Rx);outline:none;width:100%;margin-bottom:8px}
.logo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:240px;overflow-y:auto;padding-right:2px}
.logo-grid::-webkit-scrollbar{width:2px}.logo-grid::-webkit-scrollbar-thumb{background:#333;border-radius:1px}
.litem{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border:1px solid var(--border);border-radius:9px;cursor:pointer;background:rgba(0,0,0,.3);transition:all .15s}
.litem.sel{border-color:var(--gold);background:rgba(129,140,248,.1)}
.limg{width:32px;height:32px;border-radius:8px;object-fit:contain;background:#111}
.lfb{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:var(--mono)}
.llbl{font-family:var(--mono);font-size:8px;color:var(--muted);text-align:center;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:54px}
/* Goals */
.goal-card{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.goal-card:last-child{border-bottom:none}
/* Assets */
.asset-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);gap:8px}
.asset-row:last-child{border-bottom:none}
.asset-row>div:first-child{min-width:0;flex:1}
.asset-nm{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset-cat{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px;line-height:1.4}
/* Forecast */
.fc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.fc-row:last-child{border-bottom:none}
.fc-date{font-family:var(--mono);font-size:11px;color:var(--dim);flex-shrink:0;min-width:36px}
.fc-label{font-size:12px;color:var(--text);flex:1;margin:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Rules */
.rule-row{margin-bottom:13px}
.rule-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;margin-bottom:6px}
/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:6px}
.cal-day-hdr{font-family:var(--mono);font-size:8px;color:var(--muted);text-align:center;padding:3px 0;letter-spacing:1px}
.cal-day{min-height:52px;border:1px solid transparent;border-radius:var(--Rx);padding:3px 4px;font-family:var(--mono);font-size:10px;color:var(--muted);cursor:pointer;transition:all .2s cubic-bezier(.16,1,.3,1);position:relative;display:flex;flex-direction:column}
.cal-day:active{transform:scale(.93)}
.cal-day.has-event{border-color:rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.cal-day.today{border-color:var(--gold)!important;color:var(--gold);box-shadow:0 0 8px rgba(129,140,248,.2)}
.cal-day.selected{background:rgba(129,140,248,.12)!important;border-color:var(--gold)!important}
.cal-day-num{font-size:9px;font-weight:600;margin-bottom:1px}
.cal-day-amt{font-size:7px;margin-top:auto;line-height:1.1;overflow:hidden;white-space:nowrap}
.cal-day-dots{display:flex;gap:2px;margin-top:2px}
.cal-day-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.cal-summary{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:8px}
.cal-summary-val{font-size:16px;font-weight:700;margin-top:2px}
.cal-day.weekend{opacity:.8}
.cal-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
/* Sim */
.sim-result{background:var(--glass-bg);border:1px solid var(--glass-border);padding:16px;border-radius:var(--Rs);margin-top:12px;backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
.sim-big{font-size:30px;font-weight:600;letter-spacing:-1px;color:var(--gold)}
/* Import */
.imp-table{width:100%;border-collapse:collapse;font-size:12px}
.imp-table th{font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;padding:7px 5px;border-bottom:1px solid var(--border);text-align:left}
.imp-table td{padding:7px 5px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.imp-table tr:last-child td{border-bottom:none}
.imp-table tr.dup-row td{opacity:.3}
.cat-sel{background:rgba(0,0,0,.4);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:10px;padding:3px 5px;border-radius:4px;width:100%;-webkit-appearance:none;appearance:none}
.ai-badge{display:inline-flex;align-items:center;gap:3px;background:rgba(126,200,169,.12);border:1px solid rgba(126,200,169,.3);color:var(--green);font-family:var(--mono);font-size:8px;padding:2px 6px;border-radius:8px;vertical-align:middle}
.imp-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.imp-stat{background:rgba(0,0,0,.3);border:1px solid var(--border);padding:10px;text-align:center;border-radius:var(--Rx)}
.imp-stat-v{font-family:var(--mono);font-size:15px;font-weight:700;margin-bottom:2px}
.imp-stat-l{font-family:var(--mono);font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.det-sub-card{background:rgba(126,200,169,.05);border:1px solid rgba(126,200,169,.2);border-radius:var(--Rx);padding:12px;margin-bottom:8px}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#ffaa44;margin-left:3px;vertical-align:middle;margin-top:-2px}
/* Sheet */
.sheet{position:fixed;inset:0;z-index:500;display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet-box{position:relative;width:100%;background:rgba(14,16,22,.85);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:24px 24px 0 0;padding:0 0 calc(20px + var(--safe-bottom));max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;box-shadow:0 -8px 48px rgba(0,0,0,.4);border-top:1px solid rgba(255,255,255,.1)}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0}
.sheet-title{font-size:17px;font-weight:600;color:var(--text);padding:16px 20px 4px}
.sheet-body{padding:4px 20px 16px}
/* Profile */
/* Mobile */
@media(max-width:640px){
  .mbtn{width:38px;height:38px;font-size:17px;min-width:44px;min-height:44px}
  .submit{padding:17px;font-size:15px}
  .fi,.fs{padding:14px 14px;font-size:16px}
  .sab{padding:7px 9px;font-size:9px}
  .pill{padding:9px 14px;font-size:9px}
  .tx-del{padding-left:10px;font-size:20px}
  .tx-lb{font-size:14px}.tx-am{font-size:15px}
  .kpi-v{font-size:22px}
  .sub-nm,.sub-pr{font-size:14px}
  .card-t,.kpi-l,.imp-table th{font-size:9px;letter-spacing:2px}
  .imp-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .imp-table{min-width:520px}
  .cal-day{min-height:48px}
  .cal-summary-val{font-size:14px}
  .toast{font-size:13px;padding:12px 24px}
  .kpis{gap:6px}
  .main{padding:8px 14px calc(120px + var(--safe-bottom))}
  .hdr{padding:12px 16px 6px}
  .goal-card{padding:14px 0}.asset-row{padding:12px 0}
  .fr3{grid-template-columns:1fr 1fr}
  .logo-grid{grid-template-columns:repeat(3,1fr)}
  .litem{padding:12px 4px}.lfb,.limg{width:36px;height:36px}
}
@media(max-width:359px){.fr2,.fr3{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}.kpi.w3{grid-column:auto}.h-title{font-size:21px}}
button,a,[onclick]{touch-action:manipulation}
.main,.logo-grid{-webkit-overflow-scrolling:touch}
/* Savings section */
.savings-card{position:relative;overflow:hidden}
.savings-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#7EC8A9,#818CF8)}
.rav-big{font-size:26px;font-weight:700;letter-spacing:-1px;margin:4px 0 2px}
.rav-detail{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.rav-detail:last-child{border-bottom:none}
/* Calendar icons */
/* KPI editor checkbox styling */
.kpi-chk,.kpi-chk-sheet{width:18px;height:18px;accent-color:var(--gold);cursor:pointer;flex-shrink:0}
[data-theme="kitty"] .kpi-chk,[data-theme="kitty"] .kpi-chk-sheet{accent-color:#FF69B4}
[data-theme="light"] .kpi-chk,[data-theme="light"] .kpi-chk-sheet{accent-color:#7C3AED}
/* OCR image preview */
#ocrImgPreview{display:none;max-width:100%;max-height:180px;border-radius:10px;margin-bottom:10px;object-fit:contain;border:1px solid var(--border)}
/* Logo custom dans sheet edit */
.logo-edit-preview{width:40px;height:40px;border-radius:10px;overflow:hidden;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-edit-preview img{width:100%;height:100%;object-fit:cover}
/* ── GLASSMORPHISM (handled by --glass-* tokens per theme) ── */
/* ── GRADIENT ACCENTS ── */
.bar-fill{background:linear-gradient(90deg,#818CF8,#7EC8A9)}
.bar-fill.over{background:linear-gradient(90deg,var(--red),#ff7070)}
/* ── DARK OLED ── */
[data-theme="oled"]{
  --bg:#000;--bg2:#0A0A0A;--bg3:#111;--border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
  --text:#F0ECE6;--dim:#888;--muted:#40444E;
  --gold:#818CF8;--green:#7EC8A9;--pink:#C87EA9;--blue:#7EA9C8;--red:#C85555;--purple:#A78BFA;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --font:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Consolas,monospace;
  --R:20px;--Rs:14px;--Rx:8px;--nav-radius:32px;
  --glass-bg:rgba(10,10,10,.7);--glass-border:rgba(255,255,255,.06);--glass-blur:25px;
  --glass-shadow:0 4px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.03);
  --mesh:#000;
}
[data-theme="oled"] body{background:#000}
[data-theme="oled"] .hdr{background:transparent}
[data-theme="oled"] .card{background:var(--glass-bg);border-color:var(--glass-border);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
[data-theme="oled"] .kpi{background:var(--glass-bg);border-color:var(--glass-border);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
[data-theme="oled"] .bnav{background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.06)}
[data-theme="oled"] .sheet-box{background:rgba(10,10,10,.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
[data-theme="oled"] .fi,[data-theme="oled"] .fs{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}
[data-theme="oled"] .pill{background:rgba(255,255,255,.03)}
[data-theme="oled"] .toast{background:linear-gradient(135deg,#818CF8,#A78BFA);color:#fff}
/* ── HISTORY — Sticky dates, swipe-to-delete, filter pills ── */
.hist-date-hdr{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 6px;background:var(--glass-bg,rgba(255,255,255,.58));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);margin:0 -14px;padding-left:14px;padding-right:14px}
.hist-date-hdr span:first-child{font-family:var(--font);font-size:13px;font-weight:800;color:var(--text);letter-spacing:.5px}
.hist-date-hdr span:last-child{font-family:var(--mono);font-size:11px}
.hist-pill{padding:7px 14px;font-size:11px;border-radius:20px;border:1px solid var(--glass-border,rgba(255,255,255,.7));background:rgba(255,255,255,.06);color:var(--dim);font-family:var(--mono);cursor:pointer;transition:all .2s cubic-bezier(.16,1,.3,1);font-weight:600;letter-spacing:.3px;white-space:nowrap}
.hist-pill.on{background:rgba(0,122,255,.12);border-color:var(--gold);color:var(--gold)}
[data-theme="light"] .hist-pill{background:rgba(255,255,255,.55);color:#555E6E}
[data-theme="light"] .hist-pill.on{background:rgba(0,122,255,.12);border-color:#007AFF;color:#007AFF}
[data-theme="light"] .hist-date-hdr{background:rgba(255,255,255,.65)}
/* Swipe-to-delete */
.tx-swipe-wrap{position:relative;overflow:hidden}
.tx-swipe-wrap .tx{position:relative;z-index:2;background:transparent;transition:transform .3s cubic-bezier(.2,0,0,1);padding:11px 14px;border-bottom:1px solid rgba(0,0,0,.06)}
.tx-swipe-wrap:last-child .tx{border-bottom:none}
.tx-swipe-wrap.swiping .tx{background:rgba(255,255,255,.95)}
[data-theme="dark"] .tx-swipe-wrap .tx{border-bottom-color:rgba(255,255,255,.05)}
[data-theme="dark"] .tx-swipe-wrap.swiping .tx{background:rgba(22,25,31,.95)}
[data-theme="kitty"] .tx-swipe-wrap .tx{border-bottom-color:rgba(200,100,150,.08)}
[data-theme="kitty"] .tx-swipe-wrap.swiping .tx{background:rgba(255,240,245,.95)}
[data-theme="oled"] .tx-swipe-wrap .tx{border-bottom-color:rgba(255,255,255,.04)}
[data-theme="oled"] .tx-swipe-wrap.swiping .tx{background:rgba(10,10,14,.98)}
.tx-swipe-action{position:absolute;right:0;top:0;bottom:0;width:80px;display:flex;align-items:center;justify-content:center;z-index:1;opacity:0;transition:opacity .15s}
.tx-swipe-wrap.swiping .tx-swipe-action{opacity:1}
.tx-swipe-del{background:#FF3B30;color:#fff;border:none;width:100%;height:100%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* ── DASHBOARD v3 — Hero + Cards ── */
.dash-hero{text-align:center;padding:8px 0 16px}
.dash-hero-val{font-size:36px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.1}
.dash-weekly-bar{height:10px;border-radius:5px;background:linear-gradient(90deg,#34C759,#FFD60A,#FF3B30);overflow:hidden;position:relative;margin:8px 0}
.dash-weekly-bar .bar-cursor{position:absolute;top:-2px;width:4px;height:14px;border-radius:2px;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.3);transition:left .4s cubic-bezier(.16,1,.3,1)}
.dash-bars-7{display:flex;align-items:flex-end;gap:8px;height:110px;padding:8px 4px}
.dash-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.dash-bar{width:100%;border-radius:8px 8px 4px 4px;background:rgba(100,170,240,.55);min-height:4px;transition:height .4s cubic-bezier(.16,1,.3,1)}
[data-theme="light"] .dash-bar{background:rgba(80,140,230,.45)}
.dash-bar-label{font-family:var(--mono);font-size:8px;color:var(--dim);text-transform:uppercase}
.dash-bar-val{font-family:var(--mono);font-size:8px;color:var(--muted)}
.dash-goals-scroll{display:flex;gap:12px;overflow-x:auto;padding:8px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.dash-goals-scroll::-webkit-scrollbar{display:none}
.dash-goal-ring{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:70px}
.dash-goal-ring svg{width:56px;height:56px}
.dash-goal-ring .ring-bg{fill:none;stroke:var(--border);stroke-width:5}
.dash-goal-ring .ring-fill{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.16,1,.3,1)}
.dash-goal-ring .ring-text{font-family:var(--mono);font-size:11px;font-weight:700;fill:var(--text)}
.dash-goal-ring .ring-name{font-family:var(--mono);font-size:8px;color:var(--dim);text-align:center;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ── SPARKLINES ── */
.spark{display:inline-block;vertical-align:middle;flex-shrink:0}
.spark svg{display:block;overflow:visible}
.spark-line{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.spark-dot{fill:currentColor}
.asset-row .spark{margin-left:6px}
/* ── INSIGHTS ── */
.insights-wrap{padding:2px 0 4px}
.insights-scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.insights-scroll::-webkit-scrollbar{display:none}
.insight-card{flex:0 0 85%;min-width:260px;max-width:340px;padding:14px 14px 12px;border-radius:14px;background:rgba(129,140,248,.06);border:1px solid rgba(129,140,248,.18);border-left-width:3px;scroll-snap-align:start;display:flex;gap:10px;align-items:flex-start;position:relative;animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both}
.insight-card.i-good{background:rgba(126,200,169,.06);border-color:rgba(126,200,169,.22);border-left-color:#7EC8A9}
.insight-card.i-warn{background:rgba(255,170,68,.07);border-color:rgba(255,170,68,.22);border-left-color:#FFAA44}
.insight-card.i-bad{background:rgba(200,126,160,.07);border-color:rgba(200,126,160,.22);border-left-color:#C87EA0}
.insight-card.i-info{border-left-color:#818CF8}
.insight-icon{font-size:22px;line-height:1;flex-shrink:0;margin-top:2px;filter:drop-shadow(0 0 8px rgba(129,140,248,.2))}
.insight-body{flex:1;min-width:0}
.insight-title{font-size:12px;font-weight:700;color:var(--text);line-height:1.35;margin-bottom:4px}
.insight-msg{font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.5;letter-spacing:.2px}
.insight-cta{margin-top:6px;display:inline-block;background:none;border:none;color:var(--gold);font-family:var(--mono);font-size:10px;cursor:pointer;padding:0;letter-spacing:.5px}
.insight-dots{display:flex;justify-content:center;gap:5px;margin-top:6px}
.insight-dot{width:5px;height:5px;border-radius:50%;background:var(--border);transition:background .2s,width .2s}
.insight-dot.on{background:var(--gold);width:14px;border-radius:3px}
.insight-bar-bg{height:4px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.insight-bar-fill{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.16,1,.3,1)}
.insight-priority{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;background:rgba(200,126,160,.2);border:1px solid rgba(200,126,160,.3);color:#C87EA0;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;vertical-align:middle}
.insight-head-tag{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:16px;padding:0 5px;border-radius:8px;font-family:var(--mono);font-size:9px;font-weight:700}
.insight-head-tag.i-bad{background:rgba(200,126,160,.2);color:#C87EA0}
.insight-head-tag.i-warn{background:rgba(255,170,68,.2);color:#FFAA44}
.insight-head-tag.i-good{background:rgba(126,200,169,.2);color:#7EC8A9}
.insight-head-tag.i-info{background:rgba(129,140,248,.2);color:#818CF8}
/* ── COUNTER shimmer (hero) ── */
.counting{background:linear-gradient(90deg,currentColor 40%,rgba(255,255,255,.6) 50%,currentColor 60%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shimmer 1s ease-out 1}
/* ══════════════════════════════════════════════════════════
   v3.1 — Design language enrichi (hero dark, rows, date-sep, etc.)
   ══════════════════════════════════════════════════════════ */
/* Hero dark — premium summary card */
.hero-dark{background:linear-gradient(135deg,#12141B,#0E1016);border:1px solid rgba(129,140,248,.15);border-radius:24px;padding:24px;position:relative;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);margin-bottom:16px}
.hero-dark::before{content:'';position:absolute;right:-30px;bottom:-30px;width:160px;height:160px;background:radial-gradient(circle,rgba(129,140,248,.15),transparent 70%);border-radius:50%;pointer-events:none}
.hero-dark-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;position:relative;z-index:1}
.hero-dark-val{font-size:44px;font-weight:800;letter-spacing:-2px;line-height:1;margin-bottom:14px;background:linear-gradient(135deg,#818CF8,#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.hero-dark-val.neg{background:linear-gradient(135deg,#C85555,#C87EA9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-dark-delta{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.3px;position:relative;z-index:1}
.hero-dark-delta.g{color:#7EC8A9}
.hero-dark-delta.p{color:#C87EA9}
.hero-dark-flex{display:flex;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.06);position:relative;z-index:1}
.hero-dark-flex-item{flex:1}
.hero-dark-flex-lb{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.hero-dark-flex-val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.hero-dark-flex-val.g{color:#7EC8A9}
.hero-dark-flex-val.p{color:#C87EA9}
/* Light theme hero variant */
[data-theme="light"] .hero-dark{background:linear-gradient(135deg,#1A1D23,#0B0D11);border-color:rgba(0,122,255,.25)}
[data-theme="light"] .hero-dark-label{color:rgba(255,255,255,.55)}
[data-theme="light"] .hero-dark-flex-lb{color:rgba(255,255,255,.45)}
[data-theme="kitty"] .hero-dark{background:linear-gradient(135deg,#FFE4EE,#FFCCDE);border-color:rgba(255,105,180,.3)}
[data-theme="kitty"] .hero-dark-val{background:linear-gradient(135deg,#FF69B4,#E91E8C);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme="kitty"] .hero-dark-label,[data-theme="kitty"] .hero-dark-flex-lb{color:#8B5070}

/* Row list pattern — universel (historique, actifs, etc.) */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:14px;margin-bottom:6px;transition:all .2s;cursor:pointer}
.row:hover{background:rgba(255,255,255,.04);border-color:rgba(129,140,248,.2)}
.row-ico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;position:relative}
.row-ico::after{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.06);pointer-events:none}
.row-inf{flex:1;min-width:0}
.row-lb{font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row-mt{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px;letter-spacing:.2px}
.row-am{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.row-am.g{color:var(--green)}
.row-am.p{color:var(--text)}
.row-am.r{color:var(--red)}
[data-theme="light"] .row{background:rgba(255,255,255,.45);border-color:rgba(255,255,255,.7)}
[data-theme="light"] .row:hover{background:rgba(255,255,255,.65)}
[data-theme="light"] .row-lb{color:#1A1D23}
[data-theme="light"] .row-ico::after{border-color:rgba(0,0,0,.05)}
[data-theme="kitty"] .row{background:rgba(255,255,255,.4);border-color:rgba(255,105,180,.15)}
[data-theme="kitty"] .row-lb{color:#4A1535}
[data-theme="oled"] .row{background:rgba(255,255,255,.015)}

/* Date / section separator */
.date-sep{display:flex;align-items:center;gap:10px;padding:16px 4px 10px}
.date-sep-label{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-.2px;flex-shrink:0}
.date-sep-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(129,140,248,.25),rgba(255,255,255,.02))}
.date-sep-iso{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;flex-shrink:0}
[data-theme="light"] .date-sep-label{color:#1A1D23}
[data-theme="light"] .date-sep-line{background:linear-gradient(90deg,rgba(0,122,255,.2),rgba(0,0,0,.03))}

/* Day summary under transactions */
.day-sum{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 10px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.3px}
.day-sum b{color:var(--dim);font-weight:700}
.day-sum .g{color:var(--green)}
.day-sum .p{color:var(--pink)}

/* Icon bg colors — mapped from category color with 15% opacity */
.ico-food{background:rgba(236,153,75,.15);color:#EC994B}
.ico-home{background:rgba(126,169,200,.15);color:#7EA9C8}
.ico-transport{background:rgba(167,139,250,.15);color:#A78BFA}
.ico-leisure{background:rgba(200,126,169,.15);color:#C87EA9}
.ico-health{background:rgba(126,200,169,.15);color:#7EC8A9}
.ico-inc{background:rgba(126,200,169,.15);color:#7EC8A9}
.ico-sub{background:rgba(126,169,200,.15);color:#7EA9C8}
.ico-xfer{background:rgba(167,139,250,.15);color:#A78BFA}
.ico-cash{background:rgba(126,200,169,.15);color:#7EC8A9}
.ico-stock{background:rgba(126,169,200,.15);color:#7EA9C8}
.ico-real{background:rgba(236,153,75,.15);color:#EC994B}
.ico-saving{background:rgba(167,139,250,.15);color:#A78BFA}
.ico-default{background:rgba(255,255,255,.06);color:var(--dim)}

/* Badge inline */
.xbadge{display:inline-block;padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.5px;vertical-align:middle}
.xbadge.sub{background:rgba(126,169,200,.15);color:#7EA9C8}
.xbadge.xfer{background:rgba(167,139,250,.18);color:#A78BFA}
.xbadge.urg{background:rgba(200,85,85,.18);color:#C85555}
.xbadge.warn{background:rgba(255,170,68,.18);color:#FFAA44}
.xbadge.ok{background:rgba(126,200,169,.18);color:#7EC8A9}

/* Search & chips */
.search-wrap{position:relative;margin-bottom:10px}
.search-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.4;font-size:14px;pointer-events:none}
.x-search{width:100%;padding:12px 14px 12px 38px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);border-radius:12px;font-family:inherit;font-size:13px;outline:none}
.x-search:focus{border-color:var(--gold);background:rgba(129,140,248,.06)}
.x-chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none;margin-bottom:12px}
.x-chips::-webkit-scrollbar{display:none}
.x-chip{padding:6px 12px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--dim);border-radius:99px;font-family:var(--mono);font-size:10px;white-space:nowrap;cursor:pointer;letter-spacing:.3px;transition:all .15s}
.x-chip.on{background:rgba(129,140,248,.15);border-color:rgba(129,140,248,.4);color:var(--gold);font-weight:700}
.x-chip-select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 10px) 50%,calc(100% - 6px) 50%;background-size:4px 4px,4px 4px;background-repeat:no-repeat;outline:none;cursor:pointer;max-width:180px;text-overflow:ellipsis}
.x-chip-select.on{background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 10px) 50%,calc(100% - 6px) 50%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.x-chip-select option{background:var(--bg2);color:var(--text)}
[data-theme="light"] .x-search{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.75);color:#1A1D23}
[data-theme="light"] .x-chip{background:rgba(255,255,255,.4);border-color:rgba(255,255,255,.7);color:#555E6E}
[data-theme="light"] .x-chip.on{background:rgba(0,122,255,.12);border-color:#007AFF;color:#007AFF}

/* Breakdown bar + avatar cluster */
.breakdown-bar{display:flex;gap:3px;margin-bottom:10px;height:8px;border-radius:4px;overflow:hidden}
.breakdown-seg{height:100%;border-radius:3px;min-width:4px}
.breakdown-legend{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.avatar-cluster{display:flex}
.avatar-cluster .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid var(--bg2);margin-left:-8px;flex-shrink:0}
.avatar-cluster .av:first-child{margin-left:0}
[data-theme="light"] .avatar-cluster .av{border-color:rgba(255,255,255,.9)}

/* Goal card v3.1 */
.goal-card-v2{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--glass-shadow);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
.goal-card-v2-top{display:flex;gap:14px;align-items:center}
.goal-ring-v2{position:relative;width:68px;height:68px;flex-shrink:0}
.goal-ring-v2 svg{display:block}
.goal-ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.goal-inf-v2{flex:1;min-width:0}
.goal-nm-v2{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
.goal-amounts-v2{font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:6px}
.goal-bar-v2{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-bottom:6px}
.goal-bar-v2-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.goal-deadline-v2{font-family:var(--mono);font-size:9px;letter-spacing:.5px;font-weight:700}
.goal-deadline-v2.ok{color:var(--green)}
.goal-deadline-v2.danger{color:#C85555}
.goal-deadline-v2.info{color:var(--muted)}

/* Budget/Plan page v3.1 */
.alloc-hero{background:linear-gradient(135deg,#12141B,#0E1016);border:1px solid rgba(129,140,248,.15);border-radius:24px;padding:22px;position:relative;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);margin-bottom:20px}
.alloc-hero::before{content:'💰';position:absolute;right:-10px;bottom:-10px;font-size:130px;opacity:.08;pointer-events:none}
.alloc-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;position:relative;z-index:1}
.alloc-val-wrap{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:20px;position:relative;z-index:1}
.alloc-val{font-size:40px;font-weight:800;letter-spacing:-2px;line-height:1;background:linear-gradient(135deg,#818CF8,#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.alloc-of{font-family:var(--mono);font-size:12px;color:var(--green);font-weight:600}
.alloc-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.alloc-mini{display:flex;align-items:center;gap:8px;padding:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);border-radius:14px}
.alloc-mini-ico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.alloc-mini-l{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px;font-weight:700}
.alloc-mini-v{font-size:13px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.bud-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.bud-grid{grid-template-columns:repeat(2,1fr)}}
.bud-card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:18px;padding:16px;transition:all .2s;backdrop-filter:blur(var(--glass-blur))}
.bud-card:hover{border-color:rgba(129,140,248,.25);transform:translateY(-2px)}
.bud-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bud-ico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;position:relative;transition:transform .2s}
.bud-card:hover .bud-ico{transform:scale(1.08)}
.bud-ico::after{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.06)}
.bud-inf{flex:1}
.bud-nm{font-size:14px;font-weight:700;color:var(--text);margin-bottom:1px}
.bud-sub{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.3px}
.bud-menu{color:var(--muted);cursor:pointer;font-size:18px;padding:4px;flex-shrink:0;background:none;border:none}
.bud-menu:hover{color:var(--text)}
.bud-amounts{display:flex;justify-content:space-between;margin-bottom:8px;font-family:var(--mono)}
.bud-cur{font-size:13px;color:var(--dim);font-weight:600}
.bud-lim{font-size:13px;color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}
.bud-bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-bottom:10px}
.bud-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.bud-status{font-family:var(--mono);font-size:10px;letter-spacing:.2px}
.bud-status.warn{color:#FFAA44}
.bud-status.danger{color:#C85555;font-weight:700}
.bud-status.ok{color:var(--green)}
.bud-status.info{color:var(--muted);font-style:italic}
.bud-status.full{color:var(--green);font-weight:700}
.bud-add{border:2px dashed var(--border2);border-radius:18px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;background:none;color:inherit;font-family:inherit;cursor:pointer;transition:all .2s;min-height:150px;justify-content:center}
.bud-add:hover{border-color:var(--gold);background:rgba(129,140,248,.04)}
.bud-add-ico{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--dim);transition:all .2s}
.bud-add:hover .bud-add-ico{background:rgba(129,140,248,.15);color:var(--gold)}
/* Section header + CTA for budget page */
.section-hdr-v2{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
.section-ttl-v2{font-size:18px;font-weight:800;letter-spacing:-.3px;color:var(--text)}
.btn-primary-v2{display:flex;align-items:center;gap:4px;background:linear-gradient(135deg,#818CF8,#A78BFA);color:#fff;border:none;padding:10px 14px;border-radius:99px;font-family:var(--font);font-size:11px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(129,140,248,.3);letter-spacing:.3px}
.btn-primary-v2:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(129,140,248,.4)}
/* Bento grid & cards */
.bento-grid-v2{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px}
@media(min-width:700px){.bento-grid-v2{grid-template-columns:2fr 1fr}}
.bento-card-v2{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:18px;padding:16px;backdrop-filter:blur(var(--glass-blur));box-shadow:var(--glass-shadow)}
.bento-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bento-ttl{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.bento-badge{font-family:var(--mono);font-size:9px;font-weight:700;padding:4px 10px;border-radius:99px;letter-spacing:.5px}
.bento-badge.ok{color:var(--green);background:rgba(126,200,169,.15)}
.bento-badge.warn{color:#FFAA44;background:rgba(255,170,68,.15)}
.forecast-viz{background:rgba(255,255,255,.02);border-radius:12px;padding:14px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;min-height:90px;justify-content:space-between}
.forecast-viz::before{content:'';position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(180deg,transparent,rgba(129,140,248,.08));pointer-events:none}
.forecast-txt{font-size:12px;line-height:1.5;position:relative;z-index:1;color:var(--dim)}
.forecast-txt b{color:var(--gold);font-weight:800}
.forecast-bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;position:relative;z-index:1}
.forecast-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.bento-card-v2.smart-save{background:linear-gradient(135deg,#1A1D2F,#12141B);border-color:rgba(126,200,169,.2);color:var(--text);position:relative;overflow:hidden}
.bento-card-v2.smart-save::before{content:'💰';position:absolute;right:-20px;bottom:-30px;font-size:120px;opacity:.1;pointer-events:none}
.smart-save-content{position:relative;z-index:1}
.smart-save-content h3{font-size:14px;font-weight:700;margin:0 0 6px}
.smart-save-content p{font-size:12px;color:var(--dim);margin:0;line-height:1.5}
.smart-save-content p b{color:var(--green);font-weight:800}

/* Stat mini blocks (2-3 côte à côte) */
.stat-row{display:flex;gap:10px;margin-bottom:12px}
.stat-mini{flex:1;padding:12px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px;backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
.stat-mini-l{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px;font-weight:700}
.stat-mini-v{font-size:18px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums}

/* ── ANIMATIONS — Apple-style easing ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes countUp{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes notifPulse{0%{box-shadow:0 0 0 0 rgba(129,140,248,.5)}70%{box-shadow:0 0 0 8px rgba(129,140,248,0)}100%{box-shadow:0 0 0 0 rgba(129,140,248,0)}}
@keyframes confettiFall{0%{transform:translateY(-100vh) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes ringPulse{0%{stroke-dashoffset:var(--ring-offset)}100%{stroke-dashoffset:var(--ring-target)}}
.card{animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}
.kpi{animation:countUp .45s cubic-bezier(.16,1,.3,1) both}
.kpi:nth-child(2){animation-delay:.07s}.kpi:nth-child(3){animation-delay:.14s}.kpi:nth-child(4){animation-delay:.21s}
.tx{animation:slideIn .3s cubic-bezier(.16,1,.3,1) both}
/* ── SKELETON LOADING ── */
.skeleton{background:linear-gradient(90deg,var(--border) 25%,var(--border2) 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--Rs)}
/* ── HAPTIC FLASH ── */
@keyframes hapticFlash{0%{box-shadow:0 0 0 0 rgba(126,200,169,.5)}100%{box-shadow:0 0 0 20px rgba(126,200,169,0)}}
.haptic{animation:hapticFlash .5s ease-out}
/* ── CONFETTI ── */
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9998;overflow:hidden}
.confetti-piece{position:absolute;width:8px;height:8px;top:-10px;animation:confettiFall 2.5s ease-in forwards}
/* ── PROGRESS RING ── */
.ring-bg{fill:none;stroke:var(--border);stroke-width:4}
.ring-fill{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
/* ── UNDO SNACKBAR ── */
.undo-bar{position:fixed;bottom:calc(90px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border:1px solid var(--glass-border);color:var(--text);padding:10px 16px;border-radius:var(--Rs);font-family:var(--mono);font-size:12px;z-index:9999;display:flex;align-items:center;gap:12px;box-shadow:var(--glass-shadow);opacity:0;transition:all .3s cubic-bezier(.16,1,.3,1);pointer-events:none}
.undo-bar.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.undo-btn{background:var(--gold);color:var(--bg);border:none;padding:5px 12px;border-radius:6px;font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.5px}
/* ── BULK SELECT ── */
.tx.selected{background:rgba(129,140,248,.08);border-radius:8px;margin:0 -4px;padding:11px 4px}
.bulk-bar{position:fixed;bottom:calc(90px + var(--safe-bottom));left:12px;right:12px;background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border:1px solid var(--gold);padding:10px 14px;border-radius:var(--Rs);z-index:150;display:flex;align-items:center;gap:8px;box-shadow:var(--glass-shadow);animation:fadeUp .3s cubic-bezier(.16,1,.3,1)}
.bulk-btn{background:none;border:1px solid var(--border);color:var(--dim);font-family:var(--mono);font-size:9px;letter-spacing:.5px;padding:6px 10px;cursor:pointer;border-radius:6px;transition:all .15s;white-space:nowrap}
.bulk-btn:active{background:rgba(255,255,255,.05)}
.bulk-btn.danger{border-color:rgba(200,85,85,.3);color:var(--red)}
/* ── MONTH TRANSITION ── */
@keyframes slideLeft{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
.main.slide-left{animation:slideLeft .25s ease both}
.main.slide-right{animation:slideRight .25s ease both}
/* ── SEARCH HIGHLIGHT ── */
mark.hl{background:rgba(129,140,248,.3);color:var(--text);border-radius:2px;padding:0 1px}
/* ── HEATMAP ── */
.heatmap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.heatmap-cell{aspect-ratio:1;border-radius:3px;font-family:var(--mono);font-size:7px;display:flex;align-items:center;justify-content:center;color:var(--dim);transition:background .2s;cursor:pointer;position:relative;max-height:36px}
.heatmap-cell.empty{background:var(--border);opacity:.3;color:transparent}
.heatmap-cell.future{background:none;border:1px dashed var(--border);opacity:.3}
/* ── CUSTOM CATEGORIES ── */
.cat-editor-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.cat-color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;flex-shrink:0;border:2px solid transparent;transition:border-color .15s}
.cat-color-dot:hover{border-color:var(--dim)}
/* ── SPLIT BILL ── */
/* ── HEADER TRANSITIONS ── */
.hdr{z-index:50;transition:padding .2s,box-shadow .2s}
.hdr.compact{padding:8px 16px 4px;box-shadow:0 2px 16px rgba(0,0,0,.4)}
.hdr.compact .h-title{font-size:16px}
.hdr.compact .eyebrow{display:none}
.hdr.compact .hdr-avatar{width:30px;height:30px;font-size:13px}
/* ── EMPTY STATES ── */
.empty-state{text-align:center;padding:40px 20px}
.empty-state-icon{font-size:48px;margin-bottom:12px;opacity:.4}
.empty-state-text{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.6}
/* ── TAGS ── */
.tag{display:inline-flex;align-items:center;gap:3px;background:rgba(169,126,200,.12);border:1px solid rgba(169,126,200,.3);color:var(--purple);font-family:var(--mono);font-size:8px;padding:2px 7px;border-radius:10px;cursor:pointer}
.tag .tag-x{font-size:10px;opacity:.6;cursor:pointer}
/* ── SHORTCUTS ── */
.shortcut-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;border-radius:12px;border:1px solid var(--border);background:none;color:var(--text);cursor:pointer;transition:all .15s;min-width:70px}
.shortcut-btn:active{background:rgba(129,140,248,.1);border-color:var(--gold);transform:scale(.95)}
.shortcut-amt{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--gold)}
.shortcut-lb{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.5px}
/* ── SEARCH GLOBAL ── */
.search-result{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer}
.search-result:active{background:rgba(255,255,255,.03)}
.search-type{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
/* ── DONUT ── */
.donut-legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:10px}
.donut-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
/* ── STREAK ── */

// Auto-réduction mensuelle des dettes (exécuté 1x par session au chargement)
(function autoReduceDebts(){
  const key='_debtAutoReduce';
  const now=new Date();
  const curMonth=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const last=localStorage.getItem(key);
  if(last===curMonth)return; // déjà exécuté ce mois
  let changed=false;
  (data.debts||[]).forEach(d=>{
    if(!d.mensualite||d.mensualite<=0||d.val<=0)return;
    // Calculer combien de mois se sont écoulés depuis le dernier paiement auto
    const lastPay=(d.payments||[]).filter(p=>p._auto).sort((a,b)=>b.d.localeCompare(a.d))[0];
    const lastAutoMonth=lastPay?lastPay.d.substring(0,7):localStorage.getItem(key)||'';
    if(lastAutoMonth>=curMonth)return;
    const amt=Math.min(d.mensualite,d.val);
    d.val=Math.round((d.val-amt)*100)/100;
    if(!d.payments)d.payments=[];
    d.payments.push({a:amt,d:now.toISOString().split('T')[0],_auto:true});
    changed=true;
  });
  localStorage.setItem(key,curMonth);
  if(changed)save();
})();

/* Taux fixes et conversion devise pour actions */
const _FX_FIXED={'XOF/EUR':1/655.957,'EUR/XOF':655.957,'XOF/USD':1/600,'USD/XOF':600,'GBP/EUR':1.16,'EUR/GBP':0.862,'GBP/USD':1.27,'USD/GBP':0.787,'USD/EUR':0.92,'EUR/USD':1.087};
function _fxRate(from,to){
  if(from===to)return 1;
  const k=from+'/'+to;if(_FX_FIXED[k])return _FX_FIXED[k];
  const k2=to+'/'+from;if(_FX_FIXED[k2])return 1/_FX_FIXED[k2];
  if(_FX_FIXED[from+'/EUR']&&_FX_FIXED['EUR/'+to])return _FX_FIXED[from+'/EUR']*_FX_FIXED['EUR/'+to];
  if(_FX_FIXED[from+'/USD']&&_FX_FIXED['USD/'+to])return _FX_FIXED[from+'/USD']*_FX_FIXED['USD/'+to];
  return null;
}
function _stockCur(st){
  if(st.curOrig)return st.curOrig;
  if(st.market==='BRVM')return 'XOF';
  if(st.market==='NYSE'||st.market==='NASDAQ')return 'USD';
  if(st.market==='LSE')return 'GBP';
  if(st.market==='Euronext')return 'EUR';
  return getCurrency().code;
}
function stockConv(price,fromCur){
  const toCur=getCurrency().code;
  if(fromCur===toCur)return price;
  const rate=_fxRate(fromCur,toCur);
  return rate?Math.round(price*rate*100)/100:price;
}
function stockVal(st){return stockConv(st.qty*st.prix,_stockCur(st));}
function stockUnitConv(st){return stockConv(st.prix,_stockCur(st));}
function stockAchatConv(st){return st.prixAchat?stockConv(st.prixAchat,_stockCur(st)):0;}

function monthlyEquiv(a,f){return a/(freqDays(f)/30.44);}
function advanceNext(ds,f){
  const d=new Date(ds);const origDay=d.getDate();
  if(f==='weekly')d.setDate(d.getDate()+7);
  else if(f==='monthly'){d.setMonth(d.getMonth()+1);if(d.getDate()!==origDay)d.setDate(0);}
  else if(f==='quarterly'){d.setMonth(d.getMonth()+3);if(d.getDate()!==origDay)d.setDate(0);}
  else if(f==='biannual'){d.setMonth(d.getMonth()+6);if(d.getDate()!==origDay)d.setDate(0);}
  else if(f==='yearly'){d.setFullYear(d.getFullYear()+1);if(d.getDate()!==origDay)d.setDate(0);}
  return d.toISOString().slice(0,10);
}

// Retourne le montant d'un abonnement/revenu récurrent qui était en vigueur à la date donnée.
// Si aucun historique ou la date est avant toute entrée, retourne s.a (valeur courante).
function getSubAmountAt(s,dateStr){
  const hist=s&&s.priceHistory;
  if(!hist||!hist.length)return s.a;
  const sorted=[...hist].sort((a,b)=>(a.effectiveFrom||'').localeCompare(b.effectiveFrom||''));
  // Valeur par défaut = la plus ancienne entrée (si la date est avant toute entrée, on prend la plus vieille)
  let val=sorted[0].a;
  for(const e of sorted){
    if((e.effectiveFrom||'')<=dateStr)val=e.a;
    else break;
  }
  return val;
}
function mSubsTx(){
  const result=[];
  const viewM=sm, viewY=sy;
  const viewDate=new Date(viewY,viewM,1);
  // Helper : projette les transferts d'allocations d'un sub income si pas déjà renouvelé
  const projectAllocsFor=(s,mainDate,mainAmt)=>{
    if(s._tp!=='i'||!Array.isArray(s.allocations)||!s.allocations.length)return;
    // Si des transferts ont DÉJÀ été créés pour ce sub ce mois (via renouvellement réel), on skip
    const alreadyRenewed=data.t.some(t=>t._subId===s.id&&t.transfer&&new Date(t.d).getMonth()===viewM&&new Date(t.d).getFullYear()===viewY);
    if(alreadyRenewed)return;
    s.allocations.forEach(alloc=>{
      if(alloc.effectiveFrom&&alloc.effectiveFrom>mainDate)return;
      const destExists=alloc.type==='asset'
        ?(data.assets||[]).some(x=>x.id===alloc.id)
        :(data.goals||[]).some(x=>x.id===alloc.id);
      if(!destExists)return;
      const xamt=_allocAmount(alloc,mainAmt);
      if(xamt<0.01)return;
      const destName=_transferLabel({type:alloc.type,id:alloc.id}).replace(/^[💎🎯]\s*/,'');
      const modeLabel=(alloc.mode||'pct')==='amt'?`fixe ${fmtEur(alloc.amt)}`:`${alloc.pct}%`;
      result.push({
        id:'sub_xfer_'+s.id+'_'+alloc.id+'_'+viewY+viewM,
        lb:`Transfert → ${destName} (${modeLabel})`,
        a:xamt,c:'Épargne',d:mainDate,tp:'e',
        transfer:{type:alloc.type,id:alloc.id},
        _isSub:true,_sub:s,_subId:s.id,_auto:true,_isTransferProjection:true
      });
    });
  };
  (data.s||[]).filter(s=>s.active!==false).forEach(s=>{
    const nd=new Date(s.next);
    const freq=s.freq||'monthly';
    const fDays=freqDays(freq);
    const origin=s.startDate?new Date(s.startDate):nd;
    const originM=origin.getFullYear()*12+origin.getMonth();
    const viewMabs=viewY*12+viewM;
    if(viewMabs<originM) return;
    // Exact month match
    if(nd.getMonth()===viewM&&nd.getFullYear()===viewY){
      const amtAt=getSubAmountAt(s,s.next);
      result.push({id:'sub_'+s.id,lb:s.name,a:amtAt,c:s._cat||'Loisirs',d:s.next,tp:s._tp||'e',_isSub:true,_sub:s});
      projectAllocsFor(s,s.next,amtAt);
      return;
    }
    const synthD=()=>{const day=nd.getDate(),max=new Date(viewY,viewM+1,0).getDate();return `${viewY}-${String(viewM+1).padStart(2,'0')}-${String(Math.min(day,max)).padStart(2,'0')}`;};
    const amtForView=()=>getSubAmountAt(s,synthD());
    const noDup=()=>!data.t.some(t=>{
      const td=new Date(t.d);
      if(td.getMonth()!==viewM||td.getFullYear()!==viewY)return false;
      if(t._subId===s.id&&!t.transfer)return true;
      return t.lb===s.name&&Math.abs(t.a-amtForView())<0.5;
    });
    const push=()=>{
      if(noDup()){
        const mainAmt=amtForView();const mainDate=synthD();
        result.push({id:'sub_auto_'+s.id+'_'+viewY+viewM,lb:s.name,a:mainAmt,c:s._cat||'Loisirs',d:mainDate,tp:s._tp||'e',_isSub:true,_sub:s,_auto:true});
        projectAllocsFor(s,mainDate,mainAmt);
      }
    };
    const diff=(viewY-nd.getFullYear())*12+(viewM-nd.getMonth());
    if(fDays<=31.5) push();
    else if(fDays<=92&&diff>=0&&diff%3===0) push();
    else if(fDays<=183&&diff>=0&&diff%6===0) push();
    else if(fDays>183&&viewM===nd.getMonth()&&viewY>=nd.getFullYear()) push();
  });
  return result;
}

// Calcul du solde cumulé depuis le 1er mois avec des données
function calcSoldeGlissant(targetM,targetY){
  // Trouver le mois le plus ancien
  const allDates=(data.t||[]).map(t=>new Date(t.d));
  const origins=(data.s||[]).filter(s=>s.active!==false).map(s=>new Date(s.startDate||s.next));
  allDates.push(...origins);
  if(!allDates.length) return 0;
  let minY=targetY, minM=targetM;
  allDates.forEach(d=>{if(!isNaN(d)&&(d.getFullYear()<minY||(d.getFullYear()===minY&&d.getMonth()<minM))){minY=d.getFullYear();minM=d.getMonth();}});
  // Accumuler mois par mois
  let solde=0;
  const activeSubs=(data.s||[]).filter(s=>s.active!==false);
  for(let y=minY,m=minM;;){
    if(y>targetY||(y===targetY&&m>targetM)) break;
    // Transactions manuelles du mois
    const txM=data.t.filter(t=>{const d=new Date(t.d);return d.getMonth()===m&&d.getFullYear()===y;});
    solde+=txM.filter(t=>t.tp==='i').reduce((s,t)=>s+t.a,0);
    solde-=txM.filter(t=>t.tp==='e').reduce((s,t)=>s+t.a,0);
    // Abonnements projetés ce mois
    activeSubs.forEach(s=>{
      const nd=new Date(s.next);const org=new Date(s.startDate||s.next);
      const orgAbs=org.getFullYear()*12+org.getMonth();
      if(y*12+m<orgAbs) return;
      const f=freqDays(s.freq||'monthly');
      const df=(y-nd.getFullYear())*12+(m-nd.getMonth());
      let inc=false;
      if(nd.getMonth()===m&&nd.getFullYear()===y) inc=true;
      else if(f<=31.5) inc=true;
      else if(f<=92&&df>=0&&df%3===0) inc=true;
      else if(f<=183&&df>=0&&df%6===0) inc=true;
      else if(f>183&&m===nd.getMonth()&&y>=nd.getFullYear()) inc=true;
      if(inc){
        const synthDate=`${y}-${String(m+1).padStart(2,'0')}-${String(Math.min(nd.getDate(),new Date(y,m+1,0).getDate())).padStart(2,'0')}`;
        const amt=getSubAmountAt(s,synthDate);
        // Dedup robuste : _subId pour le sub principal (pas les transferts)
        const dup=txM.some(t=>(t._subId===s.id&&!t.transfer)||(t.lb===s.name&&Math.abs(t.a-amt)<0.5));
        if(!dup){
          if(s._tp==='i'){
            solde+=amt;
            // Projette aussi les allocations si pas déjà renouvelées (donc pas déjà comptées comme tx manuelles)
            const alreadyRenewed=txM.some(t=>t._subId===s.id&&t.transfer);
            if(!alreadyRenewed&&Array.isArray(s.allocations)){
              s.allocations.forEach(alloc=>{
                if(alloc.effectiveFrom&&alloc.effectiveFrom>synthDate)return;
                const destExists=alloc.type==='asset'
                  ?(data.assets||[]).some(x=>x.id===alloc.id)
                  :(data.goals||[]).some(x=>x.id===alloc.id);
                if(!destExists)return;
                const xamt=_allocAmount(alloc,amt);
                if(xamt>=0.01)solde-=xamt;
              });
            }
          }else{
            solde-=amt;
          }
        }
      }
    });
    m++;if(m>11){m=0;y++;}
  }
  return Math.round(solde*100)/100;
}

function _renderTrends3m(){

const _reduceMotion=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function _animateNum(el,target,opts){
  if(!el)return;
  opts=opts||{};
  const duration=opts.duration||900;
  const fmt=opts.formatter||(n=>Math.round(n).toString());
  const prefix=opts.prefix||'';
  const suffix=opts.suffix||'';
  if(_reduceMotion()||duration<=0){el.textContent=prefix+fmt(target)+suffix;return;}
  const startVal=opts.from!=null?opts.from:0;
  const t0=performance.now();
  function step(now){
    const p=Math.min((now-t0)/duration,1);
    // easeOutExpo
    const e=p===1?1:1-Math.pow(2,-10*p);
    const v=startVal+(target-startVal)*e;
    el.textContent=prefix+fmt(v)+suffix;
    if(p<1)requestAnimationFrame(step);
    else el.textContent=prefix+fmt(target)+suffix;
  }
  requestAnimationFrame(step);
}
function _animateDashCounters(){
  try{
    const cur=getCurrency();
    const money=n=>{try{return new Intl.NumberFormat(cur.locale,{style:'currency',currency:cur.code,maximumFractionDigits:cur.code==='XOF'?0:2}).format(n);}catch(e){return n.toFixed(2)+' '+cur.code;}};
    document.querySelectorAll('.dash-hero-val,.kpi-v').forEach(el=>{
      if(el.dataset._animated==='1')return;
      const txt=el.textContent||'';
      // Extract leading sign + numeric part
      const m=txt.match(/(^[+\-−]?)\s*([\d\s.,\u202f\u00a0]+)/);
      if(!m)return;
      const sign=m[1]==='-'||m[1]==='−'?'-':'';
      const raw=m[2].replace(/[\s\u202f\u00a0]/g,'').replace(/\./g,'').replace(',','.');
      const n=parseFloat(raw);
      if(isNaN(n))return;
      // Preserve any trailing inline markup (like <span>/mois</span>) by measuring it
      const spanChild=el.querySelector('span');
      const suffix=spanChild?spanChild.outerHTML:'';
      const target=Math.abs(n);
      const isHero=el.classList.contains('dash-hero-val');
      el.dataset._animated='1';
      const fmt=v=>sign+money(v);
      if(isHero){el.classList.add('counting');setTimeout(()=>el.classList.remove('counting'),1000);}
      _animateNum(el,target,{duration:isHero?1000:700,formatter:fmt,suffix:suffix});
    });
  }catch(e){}
}
