function _dateLabelSmart(isoDate){
  // Renvoie {label, iso} pour l'affichage des séparateurs
  const today=new Date();today.setHours(0,0,0,0);
  const d=new Date(isoDate+'T12:00:00');
  const diffDays=Math.round((today-d)/86400000);
  const iso=d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}).toUpperCase().replace('.','');
  if(diffDays===0)return{label:"Aujourd'hui",iso};
  if(diffDays===1)return{label:'Hier',iso};
  if(diffDays>1&&diffDays<7){
    const names=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
    return{label:names[d.getDay()].charAt(0).toUpperCase()+names[d.getDay()].slice(1),iso};
  }
  const shortDay=['DIM','LUN','MAR','MER','JEU','VEN','SAM'][d.getDay()]||iso;
  return{label:d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}),iso:shortDay};
}

function _sparkline(values,opts){
  opts=opts||{};
  const w=opts.w||56,h=opts.h||18,color=opts.color||'#818CF8',fill=opts.fill!==false;
  if(!values||values.length<2){
    // Flat line if no data
    return `<span class="spark" style="color:${color}"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><line x1="2" y1="${h/2}" x2="${w-2}" y2="${h/2}" stroke="${color}" stroke-width="1.5" stroke-linecap="round" opacity=".4"/></svg></span>`;
  }
  const vals=values.map(v=>Number(v)||0);
  const min=Math.min(...vals),max=Math.max(...vals);
  const range=max-min||1;
  const pad=2;
  const innerW=w-pad*2,innerH=h-pad*2;
  const pts=vals.map((v,i)=>{
    const x=pad+(i/(vals.length-1))*innerW;
    const y=pad+(1-(v-min)/range)*innerH;
    return[x,y];
  });
  const d=pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dFill=fill?`${d} L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`:'';
  const last=pts[pts.length-1];
  const gid='spg'+Math.floor(Math.random()*1e6);
  return `<span class="spark" style="color:${color}"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`
    +(fill?`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${dFill}" fill="url(#${gid})"/>`:'')
    +`<path class="spark-line" d="${d}" stroke="${color}"/>`
    +`<circle class="spark-dot" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="1.8"/>`
    +`</svg></span>`;
}
function _sparkDataFromAsset(a){
  // Build historical values from mouvements
  const mvts=(a.mouvements||[]).slice().sort((x,y)=>(x.d||'').localeCompare(y.d||''));
  if(!mvts.length)return null;
  // Start from earliest "valBefore", then each valAfter
  const pts=[mvts[0].valBefore!=null?mvts[0].valBefore:a.val];
  mvts.forEach(m=>{if(m.valAfter!=null)pts.push(m.valAfter);});
  // Ensure current value is last
  if(pts[pts.length-1]!==a.val)pts.push(a.val);
  return pts.length>=2?pts:null;
}
function _sparkDataForCategory(catName){
  // Last 12 weeks of spending for a category
  const out=[];
  const today=new Date();
  for(let i=11;i>=0;i--){
    const wStart=new Date(today);wStart.setDate(today.getDate()-i*7-6);
    const wEnd=new Date(today);wEnd.setDate(today.getDate()-i*7);
    const ws=wStart.toISOString().slice(0,10),we=wEnd.toISOString().slice(0,10);
    const total=data.t.filter(t=>t.tp==='e'&&t.c===catName&&t.d>=ws&&t.d<=we).reduce((s,t)=>s+t.a,0);
    out.push(total);
  }
  return out;
}

function _initInsightsScroll(){
  const sc=document.getElementById('insightsScroll');
  if(!sc)return;
  const dots=sc.parentElement?.querySelectorAll('.insight-dot');
  if(!dots||!dots.length)return;
  let raf=null;
  sc.addEventListener('scroll',()=>{
    if(raf)cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      const cards=sc.querySelectorAll('.insight-card');
      const scL=sc.scrollLeft;
      let best=0,bestDist=1/0;
      cards.forEach((c,i)=>{
        const dist=Math.abs(c.offsetLeft-scL);
        if(dist<bestDist){bestDist=dist;best=i;}
      });
      dots.forEach((d,i)=>d.classList.toggle('on',i===best));
    });
  });
}

// ── Projection 12 mois ──────────────────────────────────
let _projChart=null;
function calcProjection12(){
  // Démarre depuis le solde glissant cumulé (pas juste le mois courant)
  const currentBalance=calcSoldeGlissant(sm,sy);
  const activeSubs=(data.s||[]).filter(s=>s.active!==false);
  const moDebt=(data.debts||[]).filter(d=>d.val>0).reduce((s,d)=>s+(d.mensualite||0),0);
  const proj=[];
  let bal=currentBalance;
  for(let i=0;i<12;i++){
    const dt=new Date(sy,sm+i,1);
    const label=MSH[dt.getMonth()]+' '+String(dt.getFullYear()).slice(2);
    if(i===0){proj.push({label,balance:bal});continue;}
    // Calcule revenus/dépenses mensuels à la date du mois projeté (tient compte de priceHistory)
    const monthDate=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-15`;
    const moIncomeAtMonth=activeSubs.filter(s=>s._tp==='i').reduce((s,x)=>{
      const amt=getSubAmountAt(x,monthDate);
      return s+monthlyEquiv(amt,x.freq);
    },0);
    const moExpenseAtMonth=activeSubs.filter(s=>s._tp!=='i').reduce((s,x)=>{
      const amt=getSubAmountAt(x,monthDate);
      return s+monthlyEquiv(amt,x.freq);
    },0);
    bal+=moIncomeAtMonth-moExpenseAtMonth-moDebt;
    proj.push({label,balance:Math.round(bal*100)/100});
  }
  return proj;
}

// ── Calcul Reste à vivre ─────────────────────────────────
function calcResteAVivre(){
  const activeSubs=(data.s||[]).filter(s=>s.active!==false);
  // Revenus récurrents : somme monthlyEquiv de chaque revenu actif
  const moIncome=activeSubs.filter(s=>s._tp==='i').reduce((s,x)=>s+monthlyEquiv(x.a,x.freq),0);
  // Charges fixes : abos/dépenses récurrents + mensualités de dettes
  const moExpense=activeSubs.filter(s=>s._tp!=='i').reduce((s,x)=>s+monthlyEquiv(x.a,x.freq),0);
  const moDebt=(data.debts||[]).filter(d=>d.val>0).reduce((s,d)=>s+(d.mensualite||0),0);
  // Revenus exceptionnels du mois : UNIQUEMENT les revenus manuels qui ne proviennent d'aucun sub
  //   - !t._isSub exclut les subs projetées par mSubsTx
  //   - !t._subId exclut les renouvellements de subs (sinon double comptage avec moIncome)
  const thisMonthTx=data.t.filter(t=>{const d=new Date(t.d);return d.getMonth()===sm&&d.getFullYear()===sy;});
  const txManualInc=thisMonthTx.filter(t=>t.tp==='i'&&!t._subId).reduce((s,t)=>s+t.a,0);
  // Transferts vers épargne/objectifs : comptés comme charges fixes (argent déjà engagé)
  const txTransferMo=thisMonthTx.filter(t=>t.tp==='e'&&t.transfer&&t._subId).reduce((s,t)=>s+t.a,0);
  const totalIncome=moIncome+txManualInc;
  const totalCharges=moExpense+moDebt+txTransferMo;
  return {income:totalIncome,charges:totalCharges,reste:totalIncome-totalCharges,details:{moIncome,moExpense,moDebt,txManualInc,txTransferMo}};
}

function delTx(id){
  const tx=data.t.find(t=>t.id===id);if(!tx)return;
  const backup={...tx};
  _reverseTxTransfer(tx);
  data.t=data.t.filter(t=>t.id!==id);
  // Corbeille : garder la tx avec timestamp pour restauration ultérieure
  if(!data.trash)data.trash=[];
  data.trash.unshift({...backup,_deletedAt:Date.now(),_trashId:gid()});
  // Purge auto : entrées > 30 jours supprimées définitivement
  const cutoff=Date.now()-30*86400000;
  data.trash=data.trash.filter(t=>(t._deletedAt||0)>=cutoff);
  save();render();
  _showUndo(`"${(backup.lb||'Transaction').substring(0,20)}" supprimée`,()=>{
    // Undo immédiat : restaure + retire de la corbeille
    data.trash=data.trash.filter(t=>t._trashId!==data.trash[0]?._trashId);
    data.t.push(backup);
    if(backup.transfer)_applyTxTransfer(backup);
    save();
  });
}
function restoreTrashTx(trashId){
  if(!data.trash)return;

  if(!entry)return;

  delete restored._deletedAt;delete restored._trashId;delete restored.transferApplied;
  data.t.push(restored);
  if(restored.transfer)_applyTxTransfer(restored);
  data.trash=data.trash.filter(t=>t._trashId!==trashId);
  save();toast(`"${(restored.lb||'Tx').slice(0,20)}" restaurée`);render();
}

// ══════════════════════════════════════════════════════════
// Transferts tx → actif/objectif
// ══════════════════════════════════════════════════════════
// Une tx peut avoir `transfer: {type:'asset'|'goal', id}` pour indiquer qu'elle
// alimente aussi un actif ou un objectif (en plus d'être une sortie de compte courant).
// `_applyTxTransfer` crée l'impact (mouvement actif ou ++goal.saved) et stocke
// `transferApplied` pour savoir comment reverser plus tard.
// Direction du transfert :
//   tp='e' + transfer → sortie du compte courant → alimente l'actif/objectif (+)
//   tp='i' + transfer → entrée sur compte courant → retire de l'actif/objectif (−)
function _applyTxTransfer(t){
  if(!t||!t.transfer)return;
  if(t.transferApplied)return;
  const {type,id}=t.transfer;
  const amt=Math.abs(t.a||0);
  if(amt<=0)return;
  const isWithdraw=(t.tp==='i'); // Revenu = retrait depuis l'épargne/objectif
  const delta=isWithdraw?-amt:amt;
  if(type==='asset'){
    const a=data.assets&&data.assets.find(x=>x.id===id);
    if(!a)return;
    const newVal=Math.max(0,a.val+delta);
    const mvtId=gid();
    if(!a.mouvements)a.mouvements=[];
    const reasonPrefix=isWithdraw?'Retrait ← ':'Transfert → ';
    a.mouvements.push({id:mvtId,d:t.d,delta,reason:reasonPrefix+(t.lb||'tx'),valBefore:a.val,valAfter:newVal,_fromTxId:t.id});
    a.val=newVal;
    t.transferApplied={type,id,amount:amt,direction:isWithdraw?'in':'out',mvtId};
  }else if(type==='goal'){
    const g=data.goals&&data.goals.find(x=>x.id===id);
    if(!g)return;
    const newSaved=Math.max(0,(g.saved||0)+delta);
    g.saved=Math.min(newSaved,g.target);
    t.transferApplied={type,id,amount:amt,direction:isWithdraw?'in':'out'};
  }
}
function _reverseTxTransfer(t){
  if(!t||!t.transferApplied)return;
  const {type,id,amount,direction,mvtId}=t.transferApplied;
  const wasWithdraw=(direction==='in');
  const reverseDelta=wasWithdraw?amount:-amount;
  if(type==='asset'){
    const a=data.assets&&data.assets.find(x=>x.id===id);
    if(a){
      if(mvtId)a.mouvements=(a.mouvements||[]).filter(m=>m.id!==mvtId);
      a.val=Math.max(0,a.val+reverseDelta);
    }
  }else if(type==='goal'){
    const g=data.goals&&data.goals.find(x=>x.id===id);
    if(g)g.saved=Math.max(0,(g.saved||0)+reverseDelta);
  }
  delete t.transferApplied;
}
function _transferLabel(transfer){
  if(!transfer)return'';
  if(transfer.type==='asset'){
    const a=data.assets&&data.assets.find(x=>x.id===transfer.id);
    return a?('💎 '+a.name):'💎 Actif supprimé';
  }
  if(transfer.type==='goal'){
    const g=data.goals&&data.goals.find(x=>x.id===transfer.id);
    return g?('🎯 '+g.name):'🎯 Objectif supprimé';
  }
  return'';
}

  const amt=parseInput(document.getElementById('renewAmt')?.value);
  const date=document.getElementById('renewDate')?.value;
  const makeDefault=document.getElementById('renewMakeDefault')?.checked;
  if(isNaN(amt)||amt<=0||!date){toast('Montant ou date invalide','err');return;}
  const customAmt=Math.abs(amt);
  // Si user veut rendre permanent → push dans priceHistory + s.a
  if(makeDefault&&Math.abs(customAmt-s.a)>=0.01){
    if(!s.priceHistory||!s.priceHistory.length){
      const originDate=s.startDate||s.createdAt||s.next||'1970-01-01';
      s.priceHistory=[{a:s.a,effectiveFrom:originDate}];
    }
    s.priceHistory=s.priceHistory.filter(e=>e.effectiveFrom!==date);
    s.priceHistory.push({a:customAmt,effectiveFrom:date});
    s.priceHistory.sort((a,b)=>(a.effectiveFrom||'').localeCompare(b.effectiveFrom||''));
    s.a=customAmt;
  }
  const mainTx={id:gid(),lb:s.name,a:customAmt,c:s._cat||'Loisirs',d:date,tp:s._tp||'e',_subId:s.id};
  data.t.unshift(mainTx);
  // Allocations auto (basées sur le montant custom de cette occurrence)
  // N'applique que les règles dont effectiveFrom <= date du renouvellement (ou vide = toujours active)
  let transfersCreated=0;
  if((s._tp||'e')==='i'&&Array.isArray(s.allocations)&&s.allocations.length){
    s.allocations.forEach(alloc=>{
      if(alloc.effectiveFrom&&alloc.effectiveFrom>date)return;
      const destExists=alloc.type==='asset'
        ?(data.assets||[]).some(x=>x.id===alloc.id)
        :(data.goals||[]).some(x=>x.id===alloc.id);
      if(!destExists)return;
      const xamt=_allocAmount(alloc,customAmt);
      if(xamt<0.01)return;
      const destName=_transferLabel({type:alloc.type,id:alloc.id}).replace(/^[💎🎯]\s*/,'');
      const modeLabel=(alloc.mode||'pct')==='amt'?`fixe ${fmtEur(alloc.amt)}`:`${alloc.pct}%`;
      const xferTx={
        id:gid(),
        lb:`Transfert → ${destName} (${modeLabel})`,
        a:xamt,c:'Épargne',d:date,tp:'e',
        transfer:{type:alloc.type,id:alloc.id},
        _subId:s.id,_fromSubInc:mainTx.id
      };
      data.t.unshift(xferTx);
      _applyTxTransfer(xferTx);
      transfersCreated++;
    });
  }
  s.next=advanceNext(date,s.freq);
  save();
  closeSheet();
  const customMsg=Math.abs(customAmt-s.a)>=0.01&&!makeDefault?' (montant ponctuel)':'';
  const msg=transfersCreated>0
    ?`Renouvelé ${fmtEur(customAmt)}${customMsg} + ${transfersCreated} transfert${transfersCreated>1?'s':''}`
    :`Renouvelé ${fmtEur(customAmt)}${customMsg}`;
  toast(msg);
  render();
}
function toggleSub(id){const s=data.s.find(x=>x.id===id);if(!s)return;s.active=s.active===false;save();render();}
function delSub(id){if(!confirm('Supprimer cet abonnement ?'))return;data.s=data.s.filter(x=>x.id!==id);save();render();}
function acceptDetectedSub(key){const s=_detectedSubs.find(x=>x.key===key);if(!s)return;data.s.push({id:gid(),name:s.name,a:s.amount,next:s.nextDate,freq:s.freq,domain:s.domain||'',color:s.color||'#888',active:true,_cat:'Loisirs',_tp:'e'});save();dismissDetectedSub(key);toast(`${s.name} ajouté aux abonnements`);render();}
function dismissDetectedSub(key){_dismissed.push(key);localStorage.setItem('_dismissed',JSON.stringify(_dismissed));const el=document.getElementById('det_'+key);if(el)el.style.display='none';render();}

function rBudget(){
  const budgets=data.b||{};
  const txs=mtxAll().filter(t=>t.tp==='e');
  const catTotals={};
  txs.forEach(t=>{catTotals[t.c]=(catTotals[t.c]||0)+t.a;});
  const today=new Date();
  const daysInMo=new Date(sy,sm+1,0).getDate();
  const dayOfMo=(today.getMonth()===sm&&today.getFullYear()===sy)?today.getDate():daysInMo;
  const daysLeft=Math.max(0,daysInMo-dayOfMo);
  // Totaux
  const totalLim=Object.values(budgets).reduce((s,v)=>s+(Number(v)||0),0);
  const totalSpent=Object.keys(budgets).reduce((s,c)=>s+(catTotals[c]||0),0);
  const remain=Math.max(0,totalLim-totalSpent);
  // Vélocité = comparer dépenses mois courant vs moyenne 3 mois précédents
  const velocity=(()=>{
    const prevMonths=[];
    for(let i=1;i<=3;i++){
      const dt=new Date(sy,sm-i,1);const mm=dt.getMonth(),yy=dt.getFullYear();
      const total=data.t.filter(t=>{const d=new Date(t.d);return d.getMonth()===mm&&d.getFullYear()===yy&&t.tp==='e';}).reduce((s,t)=>s+t.a,0);
      prevMonths.push(total);
    }
    const avg=prevMonths.reduce((s,v)=>s+v,0)/(prevMonths.length||1);
    if(avg<=0)return null;
    const curProj=dayOfMo>0?totalSpent/dayOfMo*daysInMo:0;
    return Math.round((avg-curProj)/avg*100);
  })();
  const velLabel=velocity===null?'n/a':(velocity>=0?`+${velocity}%`:`${velocity}%`);
  const velColor=velocity===null?'var(--dim)':(velocity>=0?'#7EC8A9':'#C87EA9');
  const allocHero=`<div class="alloc-hero">
    <div class="alloc-label">ALLOCATION MENSUELLE</div>
    <div class="alloc-val-wrap">
      <span class="alloc-val">${fmtEur(totalSpent)}</span>
      <span class="alloc-of">sur ${totalLim>0?fmtEur(totalLim)+' plafonné':'aucun plafond défini'}</span>
    </div>
    <div class="alloc-mini-grid">
      <div class="alloc-mini">
        <div class="alloc-mini-ico" style="background:rgba(126,200,169,.15);color:#7EC8A9">📈</div>
        <div><div class="alloc-mini-l">Reste</div><div class="alloc-mini-v">${fmtEur(remain)}</div></div>
      </div>
      <div class="alloc-mini">
        <div class="alloc-mini-ico" style="background:rgba(167,139,250,.15);color:#A78BFA">⏳</div>
        <div><div class="alloc-mini-l">Jours</div><div class="alloc-mini-v">${daysLeft} j</div></div>
      </div>
      <div class="alloc-mini">
        <div class="alloc-mini-ico" style="background:rgba(126,169,200,.15);color:#7EA9C8">📊</div>
        <div><div class="alloc-mini-l">Vélocité</div><div class="alloc-mini-v" style="color:${velColor}">${velLabel}</div></div>
      </div>
    </div>
  </div>`;
  // Grid des catégories budgétées
  const catCards=Object.keys(budgets).filter(c=>Number(budgets[c])>0).map(catName=>{
    const cap=Number(budgets[catName])||0;
    const spent=catTotals[catName]||0;
    const pct=cap>0?Math.min(spent/cap*100,150):0;
    const c=gc(catName);
    const icoClass=_catIconClass(catName);
    let status,statusClass;
    if(pct>=100){status='🔥 Plafond dépassé';statusClass='danger';}
    else if(pct>=85){status=`⚠ ${Math.round(pct)}% du plafond atteint`;statusClass='danger';}
    else if(pct>=60){status=`${Math.round(pct)}% du plafond atteint`;statusClass='warn';}
    else if(spent===0){status='Pas encore entamé';statusClass='info';}
    else{status=`${fmtEur(cap-spent)} disponibles`;statusClass='info';}
    if(pct===100)status='Plafond atteint';
    const barColor=pct>=100?'#C85555':pct>=85?'#FFAA44':(c.color||'#818CF8');
    return `<div class="bud-card" onclick="openEditBudget('${esc(catName)}')" style="cursor:pointer">
      <div class="bud-head">
        <div class="bud-ico ${icoClass}">${c.icon||'💰'}</div>
        <div class="bud-inf">
          <div class="bud-nm">${esc(catName)}</div>
          <div class="bud-sub">${pct>=85?'À surveiller':'Dans les clous'}</div>
        </div>
        <button class="bud-menu" onclick="event.stopPropagation();openEditBudget('${esc(catName)}')">⋮</button>
      </div>
      <div class="bud-amounts">
        <span class="bud-cur">${fmtEur(spent)}</span>
        <span class="bud-lim">${fmtEur(cap)}</span>
      </div>
      <div class="bud-bar"><div class="bud-bar-fill" style="width:${Math.min(pct,100)}%;background:${barColor}"></div></div>
      <div class="bud-status ${statusClass}">${status}</div>
    </div>`;
  }).join('');
  // Catégories sans plafond (suggestion d'en ajouter)
  const uncappedCats=CATS.filter(c=>!budgets[c.name]||Number(budgets[c.name])<=0).slice(0,3);
  const addCard=`<button class="bud-add" onclick="openAddBudget()">
    <div class="bud-add-ico">＋</div>
    <div style="text-align:center">
      <div style="font-weight:700;color:var(--text)">Nouveau plafond</div>
      <div style="font-family:var(--mono);font-size:10px;color:var(--dim)">Crée un plafond pour une catégorie</div>
    </div>
  </button>`;
  const emptyState=Object.keys(budgets).filter(c=>Number(budgets[c])>0).length===0
    ?'<div class="empty-state"><div class="empty-state-icon">🎯</div><div class="empty-state-text">Aucun plafond défini<br>Crée ton premier plafond ci-dessous</div></div>'
    :'';
  // Forecast insight
  const curProj=dayOfMo>0?totalSpent/dayOfMo*daysInMo:0;
  const projSaving=totalLim-curProj;
  const forecastText=totalLim>0
    ?(projSaving>=0
      ?`Au rythme actuel, tu vas économiser <b>${fmtEur(projSaving)}</b> d'ici la fin du mois.`
      :`Au rythme actuel, tu dépasseras le plafond global de <b>${fmtEur(Math.abs(projSaving))}</b> en fin de mois.`)
    :`Ajoute des plafonds par catégorie pour activer la prévision intelligente.`;
  const forecastPct=totalLim>0?Math.min(Math.max(0,(totalLim-curProj)/totalLim*100),100):0;
  const bentoForecast=`<div class="bento-card-v2">
    <div class="bento-hdr">
      <div class="bento-ttl">📈 Prévision de dépenses</div>
      ${projSaving>=0&&totalLim>0?'<span class="bento-badge ok">Optimisé</span>':projSaving<0?'<span class="bento-badge warn">Attention</span>':''}
    </div>
    <div class="forecast-viz">
      <div class="forecast-txt">${forecastText}</div>
      ${totalLim>0?`<div class="forecast-bar"><div class="forecast-bar-fill" style="width:${forecastPct}%;background:${projSaving>=0?'linear-gradient(90deg,#818CF8,#A78BFA)':'linear-gradient(90deg,#C85555,#C87EA9)'}"></div></div>`:''}
    </div>
  </div>`;
  // Smart tip insight (petites dépenses)
  const last7=data.t.filter(t=>{const d=new Date(t.d);const ago=(Date.now()-d)/86400000;return ago>=0&&ago<=7&&t.tp==='e'&&t.a>=2&&t.a<=15;});
  const smallSum=last7.reduce((s,t)=>s+t.a,0);
  const smartTip=smallSum>=20?`<div class="bento-card-v2 smart-save">
    <div class="smart-save-content">
      <h3>☕ Petites dépenses</h3>
      <p><b>+${fmtEur(smallSum)}</b> en micro-transactions cette semaine (${last7.length} items &lt;15 €). Penses-y avant ton prochain café !</p>
    </div>
  </div>`:`<div class="bento-card-v2 smart-save">
    <div class="smart-save-content">
      <h3>💰 Astuce</h3>
      <p>Pas de micro-transactions cette semaine. Continue comme ça !</p>
    </div>
  </div>`;
  return `${allocHero}
    <div class="section-hdr-v2">
      <div class="section-ttl-v2">Plafonds par catégorie</div>
      <button class="btn-primary-v2" onclick="openAddBudget()">＋ Nouveau</button>
    </div>
    ${emptyState}
    <div class="bud-grid">${catCards}${addCard}</div>
    <div class="bento-grid-v2">${bentoForecast}${smartTip}</div>`;
}

  const catOpts=CATS.map(c=>`<option value="${c.name}">${c.icon} ${c.name}</option>`).join('');
  openSheet('Nouveau plafond',`<div class="fg">
    <label class="fl">Catégorie<select id="bCat" class="fs">${catOpts}</select></label>
    <label class="fl">Plafond mensuel (${curSymbol()})<input id="bAmt" class="fi" type="text" inputmode="decimal" placeholder="Ex: 500"></label>
    <div class="mono xxs" style="color:var(--muted);line-height:1.5">Déclenche des alertes dès 85% du plafond atteint et te permet de suivre ton rythme de dépenses par catégorie.</div>
  </div>`,()=>{

}

function rGoals(){
  const goals=data.goals||[];
  // v3.1 — Stats row summary
  const activeGoals=goals.filter(g=>g.saved<g.target);
  const completedGoals=goals.filter(g=>g.saved>=g.target);
  const totalTarget=goals.reduce((s,g)=>s+g.target,0);
  const totalSaved=goals.reduce((s,g)=>s+Math.min(g.saved,g.target),0);
  const avgPct=totalTarget>0?Math.round(totalSaved/totalTarget*100):0;
  const statsRow=goals.length?`<div class="stat-row">
    <div class="stat-mini"><div class="stat-mini-l">En cours</div><div class="stat-mini-v">${activeGoals.length}</div></div>
    <div class="stat-mini"><div class="stat-mini-l">Atteints</div><div class="stat-mini-v" style="color:var(--green)">${completedGoals.length}</div></div>
    <div class="stat-mini"><div class="stat-mini-l">Progression</div><div class="stat-mini-v" style="color:var(--gold)">${avgPct}%</div></div>
  </div>`:'';
  const goalCards=goals.length===0?'<div class="empty-state"><div class="empty-state-icon">🎯</div><div class="empty-state-text">Aucun objectif défini<br>Créez-en un ci-dessous !</div></div>':goals.map(g=>{
    const pct=Math.min(g.saved/g.target*100,100);
    const rem=Math.max(g.target-g.saved,0);
    const daysLeft=g.deadline?daysUntil(g.deadline):null;
    const moNeeded=daysLeft&&daysLeft>0?rem/(daysLeft/30.44):null;
    // Calcul rythme actuel (par jour)
    const createdDate=g.created||null;
    const daysSinceCreation=createdDate?Math.max(1,(Date.now()-new Date(createdDate))/86400000):90;
    const perDay=g.saved/daysSinceCreation;
    const projectedDays=perDay>0?Math.ceil(rem/perDay):null;
    // Badge deadline intelligent
    let deadlineBadge='';
    let deadlineClass='info';
    if(pct>=100){
      deadlineBadge='🎉 OBJECTIF ATTEINT';
      deadlineClass='ok';
    }else if(g.deadline&&daysLeft!==null){
      if(daysLeft<0){deadlineBadge=`⚠ ÉCHÉANCE DÉPASSÉE · +${Math.abs(daysLeft)}J`;deadlineClass='danger';}
      else if(moNeeded&&perDay>0){
        const ratioOk=perDay*30>=moNeeded*0.9;
        if(ratioOk){deadlineBadge=`🎯 DANS LES TEMPS · ${daysLeft}J`;deadlineClass='ok';}
        else{deadlineBadge=`⏰ EN RETARD · IL FAUT ${fmtEur(moNeeded)}/MOIS`;deadlineClass='danger';}
      }else{deadlineBadge=`📅 ÉCHÉANCE DANS ${daysLeft}J`;deadlineClass='info';}
    }else if(projectedDays){
      const dEnd=new Date();dEnd.setDate(dEnd.getDate()+projectedDays);
      deadlineBadge=`📅 FIN ~${dEnd.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}).toUpperCase()}`;
      deadlineClass='info';
    }
    const color=g.color||'var(--gold)';
    const ringColor=pct>=100?'#7EC8A9':color;
    const dashArray=2*Math.PI*28;
    const dashOffset=dashArray*(1-pct/100);
    return `<div class="goal-card-v2">
      <div class="goal-card-v2-top">
        <div class="goal-ring-v2">
          <svg width="68" height="68" viewBox="0 0 68 68">
            <circle class="goal-ring-bg" cx="34" cy="34" r="28" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="5"/>
            <circle class="goal-ring-fill" cx="34" cy="34" r="28" fill="none" stroke="${ringColor}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${dashArray}" stroke-dashoffset="${dashOffset}" transform="rotate(-90 34 34)"/>
          </svg>
          <div class="goal-ring-text">${Math.round(pct)}%</div>
        </div>
        <div class="goal-inf-v2">
          <div class="goal-nm-v2">${g.icon||'💰'} ${esc(g.name)}</div>
          <div class="goal-amounts-v2">${fmtEur(g.saved)} / ${fmtEur(g.target)}</div>
          <div class="goal-bar-v2"><div class="goal-bar-v2-fill" style="width:${pct}%;background:${ringColor}"></div></div>
          <div class="goal-deadline-v2 ${deadlineClass}">${deadlineBadge}</div>
        </div>
        <button class="sab ed" onclick="openEditGoal('${g.id}')" style="align-self:flex-start">✎</button>
      </div>
      ${moNeeded&&pct<100?`<div class="mono xxs" style="color:${moNeeded>500?'var(--pink)':'var(--green)'};padding:6px 12px;background:rgba(255,255,255,.02);border-radius:8px;margin:10px 0">→ ~${fmtEur(moNeeded)}/mois pour tenir l'échéance</div>`:''}
      ${pct<100?`<div style="display:flex;gap:6px">
        <input type="text" inputmode="decimal" id="dep_${g.id}" class="fi" style="flex:1;padding:8px" placeholder="Déposer…">
        <button onclick="addToGoal('${g.id}')" style="background:linear-gradient(135deg,${ringColor},${ringColor}dd);border:none;color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;padding:8px 14px;cursor:pointer;border-radius:8px">+ Déposer</button>
        <button onclick="delGoal('${g.id}')" style="background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:10px;padding:8px 10px;cursor:pointer;border-radius:8px">×</button>
      </div>`:`<button onclick="delGoal('${g.id}')" style="width:100%;background:rgba(126,200,169,.1);border:1px solid rgba(126,200,169,.3);color:var(--green);font-family:var(--mono);font-size:10px;padding:8px;cursor:pointer;border-radius:8px">🎉 Objectif soldé — archiver</button>`}
    </div>`;
  }).join('');
  const iconPicker=GOAL_ICONS.map((ic,idx)=>`<button onclick="selGoalIcon(${idx})" class="pill" id="gi_${idx}" style="font-size:16px;padding:6px 8px">${ic}</button>`).join('');
  const colorPicker=GOAL_COLORS.map(c=>`<button onclick="selGoalColor('${c}')" class="gcp" data-c="${c}" style="width:22px;height:22px;border-radius:50%;background:${c};border:2px solid transparent;cursor:pointer;flex-shrink:0"></button>`).join('');
  return `<div class="card"><div class="card-t">Mes objectifs</div>${goalCards}</div><div class="card"><div class="card-t">Créer un objectif</div><div class="fg"><label class="fl">Nom de l'objectif<input id="gName" class="fi" type="text" placeholder="Vacances, Voiture, Urgence…"></label><div class="fr2"><label class="fl">Montant cible (${curSymbol()})<input id="gTarget" class="fi" type="text" inputmode="decimal" placeholder="Ex: 5 000,00"></label><label class="fl">Déjà épargné (${curSymbol()})<input id="gSaved" class="fi" type="text" inputmode="decimal" placeholder="0"></label></div><label class="fl">Échéance (optionnel)<input id="gDL" class="fi" type="date"></label><div><div class="fl" style="margin-bottom:7px">Icône</div><div class="pill-row">${iconPicker}</div><input type="hidden" id="gIcon" value="${GOAL_ICONS[0]}"></div><div><div class="fl" style="margin-bottom:7px">Couleur</div><div style="display:flex;gap:8px;flex-wrap:wrap">${colorPicker}</div><input type="hidden" id="gColor" value="${GOAL_COLORS[0]}"></div><button class="submit" onclick="addGoal()">Créer l'objectif →</button></div></div><div class="card"><div class="card-t">Simulateur d'épargne</div><div class="fg"><div class="fr2"><label class="fl">Épargne/mois (${curSymbol()})<input id="simAmt" class="fi" type="text" inputmode="decimal" placeholder="200" oninput="runSim()"></label><label class="fl">Durée (années)<input id="simYrs" class="fi" type="number" inputmode="decimal" placeholder="5" oninput="runSim()"></label></div><label class="fl">Taux annuel (%)<input id="simRate" class="fi" type="number" inputmode="decimal" placeholder="3" step="0.1" oninput="runSim()"></label></div><div id="simResult"></div></div>`;
}
function selGoalIcon(idx){document.getElementById('gIcon').value=GOAL_ICONS[idx];document.querySelectorAll('[id^="gi_"]').forEach(b=>b.className='pill');document.getElementById('gi_'+idx)?.classList.add('on');}

function calcDebtStats(){
  const debts=data.debts||[];
  const totalRemaining=debts.reduce((s,d)=>s+d.val,0);
  const totalMensualite=debts.reduce((s,d)=>s+(d.mensualite||0),0);
  const totalBorrowed=debts.reduce((s,d)=>s+(d.borrowed||d.val),0);
  const totalPaid=totalBorrowed-totalRemaining;
  const pctPaid=totalBorrowed>0?Math.round(totalPaid/totalBorrowed*100):0;
  // Taux d'endettement = mensualités / revenus mensuels
  // Revenus = max(récurrents actifs, revenus manuels du mois sélectionné hors renouvellements)
  const activeSubs=(data.s||[]).filter(s=>s.active!==false);
  const moIncome=activeSubs.filter(s=>s._tp==='i').reduce((s,x)=>s+monthlyEquiv(x.a,x.freq),0);
  const txInc=data.t.filter(t=>{const d=new Date(t.d);return d.getMonth()===sm&&d.getFullYear()===sy&&t.tp==='i'&&!t._subId;}).reduce((s,t)=>s+t.a,0);
  const bestIncome=Math.max(moIncome,moIncome+txInc); // récurrents + exceptionnels (jamais moins que récurrents seuls)
  const tauxEndettement=bestIncome>0?Math.round(totalMensualite/bestIncome*100):0;
  return{totalRemaining,totalMensualite,totalBorrowed,totalPaid,pctPaid,tauxEndettement,bestIncome};
}

let _brvmCache=null;let _brvmCacheTs=0;
async function _fetchBRVMAll(){
  if(_brvmCache&&Date.now()-_brvmCacheTs<60000)return _brvmCache;
  const PROXIES=[
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?',
    'https://api.codetabs.com/v1/proxy?quest=',
    'https://crossorigin.me/'
  ];
  const pages=['https://www.brvm.org/fr/cours-actions/0','https://www.brvm.org/fr/cours-actions/1'];
  const map={};
  for(const px of PROXIES){
    let anySuccess=false;
    for(const url of pages){
      try{
        const r=await fetch(px+encodeURIComponent(url),{signal:AbortSignal.timeout(12000)});
        if(!r.ok)continue;
        const html=await r.text();
        anySuccess=true;
        /* Method 1: <div class="item"> pattern */
        const items=[...html.matchAll(/<div\s+class="item">\s*<span>([A-Z]{2,6})<\/span>[^<]*<span>([\d\s]+)<\/span>/gi)];
        for(const it of items){const t=it[1].toUpperCase();const p=parseFloat(it[2].replace(/\s/g,''));if(p>0)map[t]=p;}
        /* Method 2: table rows */
        if(!Object.keys(map).length){
          const rows=[...html.matchAll(/<tr[^>]*>([\s\S]*?)<\/tr>/gi)];
          for(const row of rows){
            const cells=[...row[1].matchAll(/<td[^>]*>([\s\S]*?)<\/td>/gi)].map(x=>x[1].replace(/<[^>]*>/g,'').trim());
            if(cells.length>=4){const t=cells[0].toUpperCase();if(/^[A-Z]{2,6}$/.test(t)){const p=parseFloat(cells[3].replace(/\s/g,'').replace(',','.'));if(p>0)map[t]=p;}}
          }
        }
      }catch(e){}
    }
    if(Object.keys(map).length>=5){break;} // got enough tickers, stop trying other proxies
    if(anySuccess)break; // proxy works but few results, don't try others
  }
  if(Object.keys(map).length){_brvmCache=map;_brvmCacheTs=Date.now();return map;}
  return null;
}
async function _fetchBRVM(ticker){
  const map=await _fetchBRVMAll();
  return map?map[ticker.toUpperCase()]||null:null;
}
async function refreshAllStockPrices(){
  const key=localStorage.getItem('stockApiKey');
  const stocks=(data.stocks||[]).filter(s=>s.ticker);
  if(!stocks.length){toast('Aucune action avec ticker','err');return;}
  const brvm=stocks.filter(s=>s.market==='BRVM');
  const other=stocks.filter(s=>s.market!=='BRVM');
  if(other.length&&!key){toast('Clé Alpha Vantage requise pour les actions hors BRVM','err');if(!brvm.length)return;}
  toast('Rafraîchissement en cours…');
  let ok=0,fail=0,msgs=[];
  /* BRVM — scraping */
  for(const st of brvm){
    try{
      const p=await _fetchBRVM(st.ticker);
      if(p){st.prix=Math.round(p*100)/100;st.curOrig='XOF';ok++;msgs.push(`${st.ticker}: ${p} FCFA`);}
      else{fail++;msgs.push(`${st.ticker}: non trouvé BRVM`);}
    }catch(e){fail++;}
  }
  /* Autres marchés — Alpha Vantage */
  for(const st of other){
    if(!key){fail++;continue;}
    try{
      let symbol=st.ticker;
      if(st.market==='Euronext'&&!symbol.includes('.'))symbol+='.PAR';
      if(st.market==='LSE'&&!symbol.includes('.'))symbol+='.LON';
      const url=`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${encodeURIComponent(symbol)}&apikey=${encodeURIComponent(key)}`;
      const r=await fetch(url);const j=await r.json();
      if(j['Note']||j['Information']){toast('Limite API atteinte (25/jour)','err');break;}
      const q=j['Global Quote'];
      if(q&&q['05. price']){
        const p=parseFloat(q['05. price']);
        if(p>0){st.prix=Math.round(p*100)/100;st.curOrig=st.market==='LSE'?'GBP':(st.market==='NYSE'||st.market==='NASDAQ')?'USD':'EUR';ok++;msgs.push(`${st.ticker}: ${p}`);}else{fail++;msgs.push(`${st.ticker}: prix=0`);}
      }else{fail++;msgs.push(`${st.ticker}: non trouvé`);}
      if(other.indexOf(st)<other.length-1)await new Promise(r=>setTimeout(r,1200));
    }catch(e){fail++;}
  }
  if(ok>0)save();
  console.log('[Stock refresh]',msgs);
  toast(`${ok} prix mis à jour${fail?`, ${fail} échec(s)`:''}`);
  render();
}

  if(d.val<=0){toast('🎉 Dette soldée !');} else {toast(`−${fmtEur(amt)} remboursé`);}
  render();
}

// CALENDAR
// ═══════════════════════════════════════════════════════════
let _calSelectedDay=null;
function _calBuildEvMap(){
  const evMap={};
  mtx().forEach(t=>{
    const d=parseInt(t.d.split('-')[2]);
    if(!evMap[d])evMap[d]=[];
    evMap[d].push({color:t.tp==='i'?'var(--green)':'var(--pink)',amount:t.a,tp:t.tp,label:t.lb,id:t.id,cat:t.c});
  });
  (data.s||[]).filter(s=>s.active!==false).forEach(s=>{
    const nd=new Date(s.next);
    const freq=s.freq||'monthly';const fDays=freqDays(freq);
    let shouldInclude=false;
    if(nd.getMonth()===sm&&nd.getFullYear()===sy) shouldInclude=true;
    else if(fDays<=31.5) shouldInclude=true;
    else if(fDays<=92){const diff=(sy-nd.getFullYear())*12+(sm-nd.getMonth());shouldInclude=diff>=0&&diff%3===0;}
    else if(fDays<=183){const diff=(sy-nd.getFullYear())*12+(sm-nd.getMonth());shouldInclude=diff>=0&&diff%6===0;}
    else{shouldInclude=sm===nd.getMonth();}
    if(shouldInclude){
      const maxDay=new Date(sy,sm+1,0).getDate();
      const d=Math.min(nd.getDate(),maxDay);
      const dup=data.t.some(t=>{const td=new Date(t.d);return td.getMonth()===sm&&td.getFullYear()===sy&&t.lb===s.name&&Math.abs(t.a-s.a)<0.5;});
      if(!dup){
        if(!evMap[d])evMap[d]=[];
        evMap[d].push({color:s._tp==='i'?'var(--green)':'var(--blue)',amount:s.a,tp:s._tp||'e',label:s.name,domain:s.domain,type:'sub',cat:s._cat||''});
      }
    }
  });
  return evMap;
}
function rCalendar(){
  const now=new Date();
  const firstDay=new Date(sy,sm,1).getDay();
  const daysInMonth=new Date(sy,sm+1,0).getDate();
  const isCurrentMonth=sm===now.getMonth()&&sy===now.getFullYear();
  const todayDate=now.getDate();
  const evMap=_calBuildEvMap();

  // Monthly summary
  const allEvs=Object.values(evMap).flat();
  const moInc=allEvs.filter(e=>e.tp==='i').reduce((s,e)=>s+e.amount,0);
  const moExp=allEvs.filter(e=>e.tp==='e'||e.tp!=='i').reduce((s,e)=>s+(e.tp!=='i'?e.amount:0),0);
  const moSubs=allEvs.filter(e=>e.type==='sub').reduce((s,e)=>s+e.amount,0);
  const moBal=moInc-moExp;

  // Max expense per day for intensity
  const dayExpenses={};
  for(let d=1;d<=daysInMonth;d++){
    dayExpenses[d]=(evMap[d]||[]).filter(e=>e.tp!=='i').reduce((s,e)=>s+e.amount,0);
  }
  const maxDayExp=Math.max(...Object.values(dayExpenses),1);

  const startOffset=(firstDay+6)%7;
  let cells='';
  for(let i=0;i<startOffset;i++) cells+=`<div class="cal-day" style="opacity:.15"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const evs=evMap[d]||[];
    const isToday=isCurrentMonth&&d===todayDate;
    const isFuture=isCurrentMonth&&d>todayDate;
    const isSelected=_calSelectedDay===d;
    const dayOfWeek=(startOffset+d-1)%7;
    const isWeekend=dayOfWeek>=5;

    // Dots (max 4 colored dots)
    const dots=evs.slice(0,4).map(e=>`<div class="cal-day-dot" style="background:${e.color}"></div>`).join('');

    // Amounts
    const totalExp=evs.filter(e=>e.tp!=='i').reduce((s,e)=>s+e.amount,0);
    const totalInc=evs.filter(e=>e.tp==='i').reduce((s,e)=>s+e.amount,0);
    let amtHtml='';
    if(totalExp>0) amtHtml+=`<span style="color:var(--pink)">-${Math.round(totalExp)}</span>`;
    if(totalInc>0) amtHtml+=`${totalExp>0?' ':''}<span style="color:var(--green)">+${Math.round(totalInc)}</span>`;

    // Intensity background
    const intensity=totalExp>0?Math.max(.06,Math.min(totalExp/maxDayExp*.25,.25)):0;
    const bgStyle=totalExp>0?`background:rgba(200,126,169,${intensity})`:totalInc>0?'background:rgba(126,200,169,.06)':'';

    cells+=`<div class="cal-day${evs.length?' has-event':''}${isToday?' today':''}${isSelected?' selected':''}${isWeekend?' weekend':''}${isFuture?' future':''}" style="${bgStyle}" onclick="showDay(${d})">
      <div class="cal-day-num">${d}</div>
      ${dots?`<div class="cal-day-dots">${dots}</div>`:''}
      ${amtHtml?`<div class="cal-day-amt">${amtHtml}</div>`:''}
    </div>`;
  }

  // Day detail panel
  const detailHtml=_calSelectedDay?_calDayDetail(_calSelectedDay,evMap):'';

  // v3.1 — Stats row en remplacement du summary + en-tête card épuré
  const statsRow=`<div class="stat-row">
    <div class="stat-mini"><div class="stat-mini-l">Revenus</div><div class="stat-mini-v" style="color:var(--green)">+${fmtEur(moInc)}</div></div>
    <div class="stat-mini"><div class="stat-mini-l">Dépenses</div><div class="stat-mini-v" style="color:var(--pink)">−${fmtEur(moExp)}</div></div>
    <div class="stat-mini"><div class="stat-mini-l">Solde</div><div class="stat-mini-v" style="color:${moBal>=0?'var(--green)':'var(--red)'}">${moBal>=0?'+':''}${fmtEur(moBal)}</div></div>
  </div>`;
  return `${statsRow}<div class="card">
    <div class="card-t" style="display:flex;align-items:center;gap:8px">📅 ${MS[sm]} ${sy}
      <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <span class="mono xxs" style="color:var(--green)">● Rev</span>
        <span class="mono xxs" style="color:var(--pink)">● Dép</span>
        <span class="mono xxs" style="color:var(--blue)">● Abo</span>
      </span>
    </div>
    <div class="cal-grid">
      ${['L','M','M','J','V','S','D'].map(d=>`<div class="cal-day-hdr">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="mono xxs" style="color:var(--dim);text-align:center;margin-top:8px;letter-spacing:.5px">${Object.values(evMap).flat().length} opérations ce mois</div>
  </div>
  ${detailHtml}`;
}
function _calDayDetail(d,evMapOverride){
  const evMap=evMapOverride||_calBuildEvMap();
  const evs=evMap[d]||[];
  if(!evs.length) return `<div class="card"><div class="card-t">${d} ${MS[sm]} ${sy}</div><div class="empty">Aucune opération ce jour</div></div>`;
  const totalExp=evs.filter(e=>e.tp!=='i').reduce((s,e)=>s+e.amount,0);
  const totalInc=evs.filter(e=>e.tp==='i').reduce((s,e)=>s+e.amount,0);
  const rows=evs.map(e=>{
    const cat=gc(e.cat||'Autre');
    const isSub=e.type==='sub';
    const icon=isSub&&e.domain?`<img style="width:26px;height:26px;border-radius:6px;background:var(--bg3)" src="${logoUrl(e.domain)}" onerror="this.outerHTML='<div class=\\'tx-fb\\' style=\\'background:${cat.color}20;color:${cat.color}\\'>${cat.icon}</div>'">`:`<div class="tx-fb" style="background:${cat.color}20;color:${cat.color}">${cat.icon}</div>`;
    const sign=e.tp==='i'?'+':'−';
    const col=e.tp==='i'?'var(--green)':isSub?'var(--blue)':'var(--pink)';
    const badge=isSub?` <span class="mono" style="font-size:7px;color:var(--blue);background:rgba(126,169,200,.1);padding:1px 4px;border-radius:4px">abo</span>`:'';
    return `<div class="tx">${icon}<div class="tx-inf"><div class="tx-lb">${esc(e.label)}${badge}</div><div class="tx-mt">${cat.name}</div></div><span class="mono xs" style="color:${col};font-weight:600">${sign}${fmtEur(e.amount)}</span>${e.id?`<button class="tx-del" onclick="openEditTx('${e.id}')">✎</button>`:''}</div>`;
  }).join('');
  return `<div class="card" style="border-left:3px solid var(--gold)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div class="card-t" style="margin-bottom:0">${d} ${MS[sm]} ${sy}</div>
      <div style="display:flex;gap:8px">
        ${totalInc>0?`<span class="mono xxs g">+${fmtEur(totalInc)}</span>`:''}
        ${totalExp>0?`<span class="mono xxs p">−${fmtEur(totalExp)}</span>`:''}
      </div>
    </div>
    ${rows}
    <button class="submit" style="margin-top:10px;padding:10px;font-size:12px" onclick="_calAddTxOnDay(${d})">＋ Ajouter une transaction le ${d}/${sm+1}</button>
  </div>`;
}
function showDay(d){
  _calSelectedDay=_calSelectedDay===d?null:d;
  const m=document.getElementById('main');
  if(m&&cv==='calendar') m.innerHTML=rCalendar();

function _calAddTxOnDay(d){
  const dateStr=`${sy}-${String(sm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  navTo('add');

let _histFilter={q:'',cat:'',tp:''};
let _histPage=1;
function _dayLabel(dateStr){
  const JOURS_FR=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const d=new Date(dateStr+'T12:00:00');const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const tgt=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.round((today-tgt)/(86400000));
  if(diff===0)return "AUJOURD'HUI";
  if(diff===1)return 'HIER';
  if(diff>=2&&diff<=6)return JOURS_FR[d.getDay()].toUpperCase();
  return `${d.getDate()} ${MS[d.getMonth()].toUpperCase()} ${d.getFullYear()}`;
}
function rHistory(){
  const txs=mtxAll();
  const realCount=mtx().length;
  const subCount=txs.length-realCount;
  const subtitle=subCount>0?` (dont ${subCount} abo${subCount>1?'s':''})` :'';
  let filtered=[...txs];
  if(_histFilter.q){
    const q=_histFilter.q.toLowerCase().trim();
    const qNum=parseFloat(q.replace(',','.'));
    const isAmtQuery=!isNaN(qNum)&&/^-?[\d.,]+$/.test(q);
    filtered=filtered.filter(t=>{
      if(t.lb.toLowerCase().includes(q)||t.c.toLowerCase().includes(q))return true;
      if(isAmtQuery){
        // Correspond si le montant contient la chaîne saisie (ex: "52" matche 52.84 et 152)
        const aStr=t.a.toFixed(2).replace('.',',');
        const aStr2=t.a.toFixed(2);
        if(aStr.includes(q.replace('.',','))||aStr2.includes(q.replace(',','.')))return true;
        // Correspond exact (tolérance 0.01)
        if(Math.abs(t.a-Math.abs(qNum))<0.01)return true;
      }
      return false;
    });
  }
  if(_histFilter.cat)filtered=filtered.filter(t=>t.c===_histFilter.cat);
  if(_histFilter.tp)filtered=filtered.filter(t=>t.tp===_histFilter.tp);
  const sorted=filtered.sort((a,b)=>b.d.localeCompare(a.d));
  const allCats=_allCats();
  const catOpts='<option value="">Toutes</option>'+allCats.map(c=>`<option value="${c.name}"${_histFilter.cat===c.name?' selected':''}>${c.icon} ${c.name}</option>`).join('');
  const bulkToggle=`<button class="bulk-btn" onclick="toggleBulkMode()" style="margin-left:auto;${_bulkMode?'border-color:var(--gold);color:var(--gold)':''}">${_bulkMode?'✓ Sélection':'☐ Multi'}</button>`;
  // v3.1 — Search + chips types + select catégorie
  const catOptions='<option value="">Toutes catégories</option>'+allCats.map(c=>`<option value="${esc(c.name)}"${_histFilter.cat===c.name?' selected':''}>${c.icon} ${esc(c.name)}</option>`).join('');
  const filterBar=`<div class="search-wrap">
    <span class="search-ico">🔍</span>
    <input id="xHistSearch" class="x-search" type="text" placeholder="Libellé, catégorie ou montant…" value="${esc(_histFilter.q)}" oninput="_onHistSearchInput(this)">
  </div>
  <div class="x-chips">
    <button class="x-chip${!_histFilter.tp&&!_histFilter.cat?' on':''}" onclick="_histFilter.tp='';_histFilter.cat='';reRenderHistory()">Toutes</button>
    <button class="x-chip${_histFilter.tp==='e'?' on':''}" onclick="_histFilter.tp='e';_histFilter.cat='';reRenderHistory()">↘ Dépenses</button>
    <button class="x-chip${_histFilter.tp==='i'?' on':''}" onclick="_histFilter.tp='i';_histFilter.cat='';reRenderHistory()">↗ Revenus</button>
    <select class="x-chip x-chip-select${_histFilter.cat?' on':''}" onchange="_histFilter.cat=this.value;_histFilter.tp='';reRenderHistory()" style="padding-right:22px">${catOptions}</select>
    <button class="x-chip" onclick="exportCSV()">📥 CSV</button>
    <button class="x-chip${_bulkMode?' on':''}" onclick="toggleBulkMode()">${_bulkMode?'✓ Sélection':'☐ Multi'}</button>
  </div>`;
  const total=filtered.reduce((s,t)=>s+(t.tp==='i'?t.a:-t.a),0);
  const totalBar=filtered.length?`<div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border);margin-top:4px"><span class="mono xs" style="color:var(--dim)">${filtered.length} résultat${filtered.length>1?'s':''}</span><span class="mono xs" style="color:${total>=0?'var(--green)':'var(--red)'}">${total>=0?'+':''}${fmtEur(total)}</span></div>`:'';
  // Virtualized: only render first 50, load more on scroll
  const PAGE=50;
  const visible=sorted.slice(0,Math.min(sorted.length,_histPage*PAGE));
  const hasMore=sorted.length>visible.length;
  // v3.1 — Group by day avec séparateurs + icons colorées + day summary
  let txHtml='';

    txHtml='<div class="empty">Aucune transaction'+((_histFilter.q||_histFilter.cat||_histFilter.tp)?' pour ce filtre':'')+'</div>';
  } else {
    let lastDate='';
    // Précalcul des day sums
    const daySums={};
    visible.forEach(t=>{
      if(!daySums[t.d])daySums[t.d]={inc:0,exp:0,count:0};
      if(t.tp==='i')daySums[t.d].inc+=t.a;else daySums[t.d].exp+=t.a;
      daySums[t.d].count++;
    });
    visible.forEach((t,idx)=>{
      if(t.d!==lastDate){
        // Fermer le jour précédent avec son summary
        if(lastDate){
          const ds=daySums[lastDate];
          const net=ds.inc-ds.exp;
          txHtml+=`<div class="day-sum"><span><b>${ds.count}</b> opération${ds.count>1?'s':''}</span><span>${ds.inc>0?`<span class="g">+${fmtEur(ds.inc)}</span>`:''}${ds.inc>0&&ds.exp>0?' · ':''}${ds.exp>0?`<span class="p">−${fmtEur(ds.exp)}</span>`:''}${ds.inc>0&&ds.exp>0?` · net <b>${net>=0?'+':'−'}${fmtEur(Math.abs(net))}</b>`:''}</span></div>`;
        }
        lastDate=t.d;

          <span class="date-sep-iso">${esc(dl.iso)}</span>

      }

        </div>`;
      } else if(!t._isSub) {
        const cat=gc(t.c),isInc=t.tp==='i';
        const tags=tagsHtml(t.id);
        const tagBtn=` <span class="tag" onclick="event.stopPropagation();promptTag('${t.id}')" style="opacity:.5;cursor:pointer;font-size:9px">+tag</span>`;
        const _q=_histFilter.q.trim();const _qn=parseFloat(_q.replace(',','.'));
        const _amtHit=_q&&!isNaN(_qn)&&/^-?[\d.,]+$/.test(_q)&&(t.a.toFixed(2).includes(_q.replace(',','.'))||Math.abs(t.a-Math.abs(_qn))<0.01);
        const _amtHtml=_amtHit?'<mark class="hl">'+(isInc?'+':'−')+fmtEur(t.a)+'</mark>':(isInc?'+':'−')+fmtEur(t.a);

        txHtml+=`<div class="tx-swipe-wrap" data-txid="${t.id}">

            <div class="row-inf">
              <div class="row-lb">${_histFilter.q?_hl(t.lb,_histFilter.q):esc(t.lb)}${badges?' '+badges:''}</div>
              <div class="row-mt">${esc(t.c)}${t.transfer?` · <span style="color:var(--purple)">${_transferLabel(t.transfer)}</span>`:''}${tags?' '+tags:''}${tagBtn}</div>

        </div>`;
      } else {
        // Sub projeté (non renouvelé) — utilise row style aussi
        const cat=gc(t.c);
        txHtml+=`<div class="row" style="opacity:.7">
          <div class="row-ico ico-sub">🔁</div>
          <div class="row-inf">
            <div class="row-lb">${esc(t.lb)} <span class="xbadge sub">ABO</span></div>
            <div class="row-mt">${esc(t.c)} · prochain ${t.d}</div>
          </div>
          <div class="row-am ${t.tp==='i'?'g':'p'}">${t.tp==='i'?'+':'−'}${fmtEur(t.a)}</div>
        </div>`;
      }
    });
    // Day summary du dernier jour
    if(lastDate){
      const ds=daySums[lastDate];
      const net=ds.inc-ds.exp;
      txHtml+=`<div class="day-sum"><span><b>${ds.count}</b> opération${ds.count>1?'s':''}</span><span>${ds.inc>0?`<span class="g">+${fmtEur(ds.inc)}</span>`:''}${ds.inc>0&&ds.exp>0?' · ':''}${ds.exp>0?`<span class="p">−${fmtEur(ds.exp)}</span>`:''}${ds.inc>0&&ds.exp>0?` · net <b>${net>=0?'+':'−'}${fmtEur(Math.abs(net))}</b>`:''}</span></div>`;
    }
  }
  const loadMore=hasMore?`<button onclick="_histPage++;reRenderHistory()" style="width:100%;padding:12px;background:none;border:1px solid var(--border);color:var(--dim);font-family:var(--mono);font-size:10px;cursor:pointer;border-radius:var(--Rx);margin-top:8px;transition:all .2s">Charger plus (${sorted.length-visible.length} restantes)</button>`:'';
  // v3.1 — Corbeille (accordéon replié par défaut)
  const trash=(data.trash||[]).slice().sort((a,b)=>(b._deletedAt||0)-(a._deletedAt||0));
  const trashSection=trash.length?_renderTrashSection(trash):'';

    ${txHtml}

function reRenderHistory(){
  const m=document.getElementById('main');
  if(!m||cv!=='history')return;
  // Préserve focus + position curseur sur le champ recherche
  const activeId=document.activeElement?.id;
  const cursorPos=activeId==='xHistSearch'?document.activeElement.selectionStart:null;
  m.innerHTML=rHistory();
  initHistSwipe();
  if(activeId==='xHistSearch'){
    const inp=document.getElementById('xHistSearch');
    if(inp){
      inp.focus({preventScroll:true});
      if(cursorPos!==null){try{inp.setSelectionRange(cursorPos,cursorPos);}catch(e){}}
    }
  }
}

let _histSearchTO=null;
function _onHistSearchInput(el){
  _histFilter.q=el.value;

// ── Swipe-to-delete touch handlers for history ──
function initHistSwipe(){
  document.querySelectorAll('.tx-swipe-wrap').forEach(wrap=>{
    const txEl=wrap.querySelector('.tx');
    if(!txEl||wrap._swipeInit)return;
    wrap._swipeInit=true;
    let startX=0,startY=0,dragging=false,dx=0;
    txEl.addEventListener('touchstart',e=>{
      startX=e.touches[0].clientX;startY=e.touches[0].clientY;dragging=false;dx=0;
      txEl.style.transition='none';
    },{passive:true});
    txEl.addEventListener('touchmove',e=>{
      const cx=e.touches[0].clientX,cy=e.touches[0].clientY;
      const deltaX=cx-startX,deltaY=cy-startY;
      if(!dragging&&Math.abs(deltaX)>10&&Math.abs(deltaX)>Math.abs(deltaY)*1.2){dragging=true;wrap.classList.add('swiping');}
      if(!dragging)return;
      e.preventDefault();
      dx=Math.min(0,deltaX); // only swipe left
      txEl.style.transform=`translateX(${dx}px)`;
    },{passive:false});
    txEl.addEventListener('touchend',()=>{
      txEl.style.transition='transform .3s cubic-bezier(.2,0,0,1)';
      if(dx<-60){
        txEl.style.transform='translateX(-80px)';
      } else {
        txEl.style.transform='translateX(0)';
        wrap.classList.remove('swiping');
      }
      dragging=false;dx=0;
    },{passive:true});
    // Close on tap anywhere else
    txEl.addEventListener('click',()=>{
      if(parseFloat(txEl.style.transform?.replace(/[^-\d.]/g,''))<-10){
        txEl.style.transition='transform .3s cubic-bezier(.2,0,0,1)';
        txEl.style.transform='translateX(0)';
        wrap.classList.remove('swiping');
      }
    });
  });
}

function compressImage(file,maxW,quality){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const ratio=Math.min(maxW/img.width,maxW/img.height,1);
      const c=document.createElement('canvas');
      c.width=img.width*ratio;c.height=img.height*ratio;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      resolve(c.toDataURL('image/jpeg',quality||0.7));
    };
    img.src=URL.createObjectURL(file);
  });
}

function shareApp(){

function shareAppFallback(html){

  a.href=url;a.download='budget_pro.json';

function exportCSV(){
  const txs=mtxAll().sort((a,b)=>b.d.localeCompare(a.d));
  if(!txs.length){toast('Aucune transaction ce mois','err');return;}
  const head='Date;Libellé;Catégorie;Type;Montant\n';
  const rows=txs.map(t=>`${t.d};"${t.lb.replace(/"/g,'""')}";${t.c};${t.tp==='i'?'Revenu':'Dépense'};${t.a.toFixed(2).replace('.',',')}`).join('\n');
  const bom='\uFEFF';
  const blob=new Blob([bom+head+rows],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`budget_${MS[sm]}_${sy}.csv`;

function importJSON(input){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.t)throw new Error('Format invalide');
      data=d; save(); toast('Donnees importees'); render();
    }catch(err){ toast('Fichier JSON invalide','err'); }
  };
  reader.readAsText(file);
}
function confirmDel(){

  data={t:[],b:{},s:[],goals:[],assets:[],debts:[]}; save(); toast('Efface'); render();

function openSheet(title, bodyHtml, onSave){

    :`<div class="mono xxs" style="color:var(--muted);margin-top:-4px;margin-bottom:6px">Ajoute des actifs ou objectifs pour activer cette option.</div>`;
  const body=`<div class="fg">

    <div class="fr2">
      <label class="fl">Montant (${curSymbol()})<input id="etAmt" class="fi" type="text" inputmode="decimal" value="${t.a.toString().replace('.',',')}"></label>

        <select id="etTp" class="fs" onchange="_onEditTpChange()">
          <option value="e"${t.tp==='e'?' selected':''}>Depense</option>
          <option value="i"${t.tp==='i'?' selected':''}>Revenu</option>
        </select>
      </label>
    </div>
    <label class="fl">Date<input id="etDate" class="fi" type="date" value="${t.d}"></label>
    <label class="fl">Categorie<select id="etCat" class="fs">${catOpts}</select></label>
    <label class="fl" id="etTransferLbl">${t.tp==='i'?'Retrait depuis épargne / objectif':'Transfert vers épargne / objectif'}
      <select id="etTransfer" class="fs">${destOpts}</select>

function _onEditTpChange(){
  const tp=document.getElementById('etTp')?.value;
  const lbl=document.getElementById('etTransferLbl');
  if(lbl){
    const txtNode=lbl.childNodes[0];
    if(txtNode)txtNode.textContent=(tp==='i'?'Retrait depuis épargne / objectif':'Transfert vers épargne / objectif');
  }
}
function saveEditTx(id){
  const t=data.t.find(x=>x.id===id); if(!t)return;
  const lb=document.getElementById('etLb')?.value?.trim();
  const amt=parseInput(document.getElementById('etAmt')?.value);
  const tp=document.getElementById('etTp')?.value;
  const date=document.getElementById('etDate')?.value;
  const cat=document.getElementById('etCat')?.value;
  const transferRaw=document.getElementById('etTransfer')?.value||'';
  const newTransfer=transferRaw?{type:transferRaw.split(':')[0],id:transferRaw.split(':')[1]}:null;
  if(!lb||!amt||isNaN(amt)||!date){toast('Champs manquants','err');return;}
  const oldKey=t.transfer?`${t.transfer.type}:${t.transfer.id}`:'';
  const newKey=newTransfer?`${newTransfer.type}:${newTransfer.id}`:'';
  const transferChanged=oldKey!==newKey;
  const amountChanged=Math.abs(t.a-Math.abs(amt))>=0.01;
  // Si transfer ou montant a changé : reverser l'ancien impact
  if((transferChanged||amountChanged)&&t.transferApplied){
    _reverseTxTransfer(t);
  }
  t.lb=lb; t.a=Math.abs(amt); t.tp=tp; t.d=date; t.c=cat;
  if(newTransfer){t.transfer=newTransfer;_applyTxTransfer(t);}
  else{delete t.transfer;}
  save(); closeSheet(); toast('Transaction modifiée'); render();
}

function _renderSubAllocations(s){
  const assets=(data.assets||[]);
  const goals=(data.goals||[]).filter(g=>g.saved<g.target);
  if(!assets.length&&!goals.length){
    return `<div style="background:rgba(129,140,248,.05);border:1px solid rgba(129,140,248,.15);border-radius:var(--Rs);padding:10px;margin-top:4px">
      <div class="card-t" style="margin-bottom:6px;font-size:10px">💎 Répartition auto à chaque renouvellement</div>
      <div class="mono xxs" style="color:var(--muted);line-height:1.5;margin-bottom:8px">Crée d'abord un actif (Livret, PEA…) ou un objectif.</div>
      <div style="display:flex;gap:6px">
        <button type="button" onclick="closeSheet();navTo('patrimoine')" style="flex:1;background:rgba(126,200,169,.1);border:1px solid rgba(126,200,169,.3);color:var(--green);font-family:var(--mono);font-size:10px;padding:8px;cursor:pointer;border-radius:6px">💎 Créer une épargne →</button>

      </div>
    </div>`;
  }
  const allocs=s.allocations||[];
  const destOptions=(selKey)=>{
    let opts='';
    if(assets.length)opts+=`<optgroup label="💎 Épargne / Actifs">${assets.map(a=>`<option value="asset:${a.id}"${selKey===`asset:${a.id}`?' selected':''}>💎 ${esc(a.name)}</option>`).join('')}</optgroup>`;
    if(goals.length)opts+=`<optgroup label="🎯 Objectifs">${goals.map(g=>`<option value="goal:${g.id}"${selKey===`goal:${g.id}`?' selected':''}>🎯 ${esc(g.name)}</option>`).join('')}</optgroup>`;
    return opts;
  };
  const todayISO=new Date().toISOString().slice(0,10);
  const rows=allocs.map((a,i)=>{
    const selKey=`${a.type}:${a.id}`;
    const mode=a.mode||'pct';
    // Montant effectif pour l'affichage
    const computedAmt=mode==='amt'?(a.amt||0):(s.a*(a.pct||0)/100);
    const effFrom=a.effectiveFrom||'';
    const effDate=effFrom?new Date(effFrom):null;
    const now=new Date();
    const isPending=effDate&&effDate>now;
    const statusText=effFrom
      ?(isPending
        ?`⏳ Active à partir du ${effDate.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}`
        :`✓ Active depuis le ${effDate.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}`)
      :'✓ Active dès le prochain renouvellement';
    const modeHint=mode==='pct'?`${a.pct||0}% de ${fmtEur(s.a)}`:`${fmtEur(a.amt||0)} fixe`;
    return `<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)">
      <div style="display:flex;gap:6px;align-items:center">

        <div style="display:flex;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px;flex-shrink:0">
          <button type="button" id="sAllocModePct_${s.id}_${i}" onclick="_setAllocMode('${s.id}',${i},'pct')" style="padding:4px 8px;border-radius:4px;border:none;background:${mode==='pct'?'rgba(129,140,248,.2)':'transparent'};color:${mode==='pct'?'var(--gold)':'var(--dim)'};font-family:var(--mono);font-size:10px;font-weight:700;cursor:pointer">%</button>

    </div>`;
  }).join('');
  const todayIso=new Date().toISOString().slice(0,10);
  const activeAllocs=allocs.filter(a=>!a.effectiveFrom||a.effectiveFrom<=todayIso);
  const repartMontant=activeAllocs.reduce((sum,a)=>sum+_allocAmount(a,s.a),0);

    ${allocs.length?`<div class="mono xxs" style="color:var(--muted);margin-top:8px;line-height:1.5">À chaque renouvellement : ${fmtEur(s.a)} reçu → <span style="color:var(--blue)">${fmtEur(repartMontant)}</span> transférés · <span style="color:var(--green)">${fmtEur(Math.max(0,s.a-repartMontant))}</span> sur compte courant</div>`:''}
  </div>`;
}

// Helper central : calcule le montant d'une allocation selon son mode
function _allocAmount(alloc,mainAmt){
  if(!alloc)return 0;
  const mode=alloc.mode||'pct';
  if(mode==='amt')return Math.max(0,alloc.amt||0);
  return Math.max(0,mainAmt*(alloc.pct||0)/100);
}
// Calcule les allocations en attente (pas encore appliquées) vers un actif donné
// = somme des transferts projetés des subs actifs non renouvelés ce mois
function _pendingAssetAllocations(assetId){
  let total=0;
  const todayIso=new Date().toISOString().slice(0,10);
  const viewFirst=new Date(sy,sm,1);
  const viewLast=new Date(sy,sm+1,0);
  (data.s||[]).filter(s=>s.active!==false&&s._tp==='i'&&Array.isArray(s.allocations)&&s.allocations.length).forEach(s=>{
    // Le sub tombe-t-il dans le mois affiché ?
    const nd=new Date(s.next);
    const isThisMonth=nd>=viewFirst&&nd<=viewLast;
    if(!isThisMonth)return;
    // Déjà renouvelé ce mois ?
    const alreadyRenewed=(data.t||[]).some(t=>t._subId===s.id&&t.transfer&&new Date(t.d).getMonth()===sm&&new Date(t.d).getFullYear()===sy);
    if(alreadyRenewed)return;
    s.allocations.forEach(alloc=>{
      if(alloc.type!=='asset'||alloc.id!==assetId)return;
      if(alloc.effectiveFrom&&alloc.effectiveFrom>s.next)return;
      const amt=_allocAmount(alloc,s.a);
      if(amt>=0.01)total+=amt;
    });
  });
  return total;
}
function _pendingGoalAllocations(goalId){
  let total=0;
  const viewFirst=new Date(sy,sm,1);
  const viewLast=new Date(sy,sm+1,0);
  (data.s||[]).filter(s=>s.active!==false&&s._tp==='i'&&Array.isArray(s.allocations)&&s.allocations.length).forEach(s=>{
    const nd=new Date(s.next);
    if(!(nd>=viewFirst&&nd<=viewLast))return;
    const alreadyRenewed=(data.t||[]).some(t=>t._subId===s.id&&t.transfer&&new Date(t.d).getMonth()===sm&&new Date(t.d).getFullYear()===sy);
    if(alreadyRenewed)return;
    s.allocations.forEach(alloc=>{
      if(alloc.type!=='goal'||alloc.id!==goalId)return;
      if(alloc.effectiveFrom&&alloc.effectiveFrom>s.next)return;
      const amt=_allocAmount(alloc,s.a);
      if(amt>=0.01)total+=amt;
    });
  });
  return total;
}
// Helper : sync montants des vrais transferts déjà créés ce mois quand une règle change
function _syncExistingTransfersForRule(s,oldAlloc,newAlloc){
  if(!data.t||!s)return;
  // Cherche les transferts ce mois pour cette règle (matching par type+id)
  const target=oldAlloc||newAlloc;
  if(!target)return;
  data.t.forEach(t=>{
    if(t._subId!==s.id||!t.transfer)return;
    const dt=new Date(t.d);
    if(dt.getMonth()!==sm||dt.getFullYear()!==sy)return;
    if(t.transfer.type!==target.type||t.transfer.id!==target.id)return;
    if(!newAlloc){
      // Règle supprimée → reverser l'impact et retirer la tx
      _reverseTxTransfer(t);
      data.t=data.t.filter(x=>x.id!==t.id);
      return;
    }
    // Recalculer le montant avec la nouvelle règle
    const newAmt=_allocAmount(newAlloc,s.a);
    if(Math.abs(newAmt-t.a)<0.01)return; // rien à faire
    _reverseTxTransfer(t);
    t.a=newAmt;
    const destName=_transferLabel(t.transfer).replace(/^[💎🎯]\s*/,'');
    const modeLabel=(newAlloc.mode||'pct')==='amt'?`fixe ${fmtEur(newAlloc.amt)}`:`${newAlloc.pct}%`;
    t.lb=`Transfert → ${destName} (${modeLabel})`;
    _applyTxTransfer(t);
  });
}
function _delSubAllocation(subId,i){
  const s=data.s.find(x=>x.id===subId);if(!s||!s.allocations||!s.allocations[i])return;
  const alloc=s.allocations[i];
  // Cherche les transferts réels déjà créés ce mois pour cette règle
  const existingXfers=(data.t||[]).filter(t=>t._subId===s.id&&t.transfer&&t.transfer.type===alloc.type&&t.transfer.id===alloc.id&&(()=>{const dt=new Date(t.d);return dt.getMonth()===sm&&dt.getFullYear()===sy;})());
  if(existingXfers.length){
    const msg=`Supprimer aussi les ${existingXfers.length} transfert${existingXfers.length>1?'s':''} déjà créé${existingXfers.length>1?'s':''} ce mois pour cette règle ?\n\n(OK = supprimer règle + transferts · Annuler = supprimer règle seulement, garder l'historique)`;
    const alsoRemoveTx=confirm(msg);
    if(alsoRemoveTx){
      existingXfers.forEach(t=>{
        _reverseTxTransfer(t);
        data.t=data.t.filter(x=>x.id!==t.id);
      });
      toast(`Règle + ${existingXfers.length} transfert${existingXfers.length>1?'s':''} supprimé${existingXfers.length>1?'s':''}`);
    }else{
      toast('Règle supprimée (transferts historiques conservés)');
    }
  }else{
    toast('Règle supprimée');
  }
  s.allocations.splice(i,1);
  if(!s.allocations.length)delete s.allocations;
  save();
  _refreshSubEditSheet(subId);
  render();
}

function _applyHistEdit(subId,origDate){
  const s=data.s.find(x=>x.id===subId);if(!s||!s.priceHistory)return;
  // Retrouver l'index dans l'ordre d'affichage (desc) puis mapper à priceHistory
  const sortedDesc=[...s.priceHistory].sort((a,b)=>(b.effectiveFrom||'').localeCompare(a.effectiveFrom||''));
  const idxDesc=sortedDesc.findIndex(h=>(h.effectiveFrom||'')===origDate);
  if(idxDesc<0)return;
  const amtEl=document.getElementById('histAmt_'+idxDesc);
  const dateEl=document.getElementById('histDate_'+idxDesc);
  if(!amtEl||!dateEl)return;
  const newAmt=parseInput(amtEl.value);
  const newDate=dateEl.value;
  if(isNaN(newAmt)||!newAmt||!newDate){toast('Montant ou date invalide','err');return;}
  // Trouver l'entrée originale dans s.priceHistory par sa date d'effet
  const entry=s.priceHistory.find(h=>(h.effectiveFrom||'')===origDate);
  if(!entry){toast('Entrée introuvable','err');return;}
  // Vérifier qu'on n'écrase pas une autre entrée existante avec la nouvelle date
  if(newDate!==origDate&&s.priceHistory.some(h=>h!==entry&&h.effectiveFrom===newDate)){
    toast('Une autre entrée existe déjà à cette date','err');return;
  }
  entry.a=Math.abs(newAmt);
  entry.effectiveFrom=newDate;
  s.priceHistory.sort((a,b)=>(a.effectiveFrom||'').localeCompare(b.effectiveFrom||''));
  // Sync s.a avec la plus récente entrée
  const latest=s.priceHistory[s.priceHistory.length-1];
  s.a=latest.a;
  save();
  toast('Historique mis à jour');
  _refreshSubEditSheet(subId);
  // Met à jour le champ montant principal si c'est la dernière entrée
  const esAmt=document.getElementById('esAmt');if(esAmt)esAmt.value=s.a.toString().replace('.',',');
}
function _delHistEntry(subId,origDate){
  const s=data.s.find(x=>x.id===subId);if(!s||!s.priceHistory)return;
  if(!confirm(`Supprimer l'entrée du ${origDate||'(sans date)'} ?`))return;
  s.priceHistory=s.priceHistory.filter(h=>(h.effectiveFrom||'')!==origDate);
  if(s.priceHistory.length){
    s.priceHistory.sort((a,b)=>(a.effectiveFrom||'').localeCompare(b.effectiveFrom||''));
    s.a=s.priceHistory[s.priceHistory.length-1].a;
  }else{
    delete s.priceHistory;
  }
  save();
  toast('Entrée supprimée');
  _refreshSubEditSheet(subId);
  const esAmt=document.getElementById('esAmt');if(esAmt)esAmt.value=s.a.toString().replace('.',',');
}
function saveEditSub(id){
  const s=data.s.find(x=>x.id===id); if(!s)return;
  const name=document.getElementById('esName')?.value?.trim();
  const amt=parseInput(document.getElementById('esAmt')?.value);
  const freq=document.getElementById('esFreq')?.value;
  const next=document.getElementById('esNext')?.value;
  const cat=document.getElementById('esCat')?.value;
  const tp=document.getElementById('esTp')?.value||'e';
  const active=document.getElementById('esActive')?.checked!==false;
  const effective=document.getElementById('esEffective')?.value;
  if(!name||!amt||isNaN(amt)||!next){toast('Champs manquants','err');return;}
  const newAmt=Math.abs(amt);
  // Si le montant change, on enregistre l'historique
  if(Math.abs(newAmt-s.a)>=0.01){
    if(!s.priceHistory||!s.priceHistory.length){
      // Première modification : on initialise l'historique avec l'ancienne valeur
      // qui était effective depuis la startDate ou la création de l'abo
      const originDate=s.startDate||s.createdAt||s.next||'1970-01-01';
      s.priceHistory=[{a:s.a,effectiveFrom:originDate}];
    }
    // On pousse la nouvelle valeur avec sa date d'effet
    const effDate=effective||new Date().toISOString().slice(0,10);
    // Si une entrée a déjà exactement cette date, on la remplace
    s.priceHistory=s.priceHistory.filter(e=>e.effectiveFrom!==effDate);
    s.priceHistory.push({a:newAmt,effectiveFrom:effDate});
    s.priceHistory.sort((a,b)=>(a.effectiveFrom||'').localeCompare(b.effectiveFrom||''));
  }
  s.name=name; s.a=newAmt; s.freq=freq; s.next=next; s._cat=cat; s._tp=tp; s.active=active;
  save(); closeSheet(); toast(tp==='i'?'Revenu modifié':'Abonnement modifié'); render();
}

function _applyAssetMvtEdit(assetId,mvtId){
  const a=data.assets.find(x=>x.id===assetId);if(!a||!a.mouvements)return;
  const m=a.mouvements.find(x=>x.id===mvtId);if(!m){toast('Mouvement introuvable','err');return;}
  const rawAmt=document.getElementById('mvtAmt_'+mvtId)?.value?.trim().replace(/[\s\u202f\u00a0]/g,'').replace(',','.');
  const kind=document.getElementById('mvtKind_'+mvtId)?.value||'out';
  const newDate=document.getElementById('mvtDate_'+mvtId)?.value||m.d;
  const newReason=document.getElementById('mvtReason_'+mvtId)?.value?.trim()||'';
  const parsed=parseFloat(rawAmt||'');
  if(isNaN(parsed)||parsed<=0){toast('Montant invalide','err');return;}
  const newDelta=kind==='in'?Math.abs(parsed):-Math.abs(parsed);
  const oldDelta=m.delta;
  const diff=newDelta-oldDelta;
  // Ajuste la valeur courante de l'actif par la différence
  const newAssetVal=Math.max(0,a.val+diff);
  if(newAssetVal!==a.val+diff){
    if(!confirm(`Cette modification rendrait la valeur négative (${fmtEur(a.val+diff)}). Forcer à 0 ?`))return;
  }
  m.delta=newDelta;
  m.d=newDate;
  m.reason=newReason;
  // Les valBefore/valAfter de ce mouvement ne sont plus strictement exacts historiquement,
  // mais on les met à jour pour refléter le nouvel état courant approximatif
  m.valAfter=newAssetVal;
  a.val=newAssetVal;
  save();
  toast('Mouvement modifié');
  closeSheet();
  setTimeout(()=>openEditAsset(assetId),150);
  if(cv==='patrimoine'){const m2=document.getElementById('main');if(m2)m2.innerHTML=rPatrimoine();}
}
function _delAssetMvt(assetId,mvtId){

// ── CSV helpers ──────────────────────────────────────────
function detectCsvSep(headerRow){
  const counts={';':0,',':0,'\t':0};
  for(const c of headerRow){ if(counts[c]!==undefined)counts[c]++; }
  return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0]||';';
}
function csvSplit(row,sep){
  if(!sep)sep=row.includes(';')?';':',';
  const result=[];let cur='',inQ=false;
  for(let i=0;i<row.length;i++){
    const c=row[i];
    if(c==='"'){inQ=!inQ;}
    else if(c===sep&&!inQ){result.push(cur.trim().replace(/^"|"$/g,''));cur='';}
    else cur+=c;
  }
  result.push(cur.trim().replace(/^"|"$/g,''));
  return result;
}
function csvDate(s){
  if(!s)return null;
  s=s.trim().replace(/"/g,'');
  let m=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}
  m=s.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
  if(m)return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return null;
}
function csvAmount(s){
  if(s===null||s===undefined)return NaN;
  let v=String(s).trim().replace(/"/g,'').replace(/\s|\u00a0/g,'');
  if(!v)return NaN;
  if(v.startsWith('+'))v=v.slice(1);
  const neg=v.startsWith('-');v=v.replace(/^-/,'');
  if(/^\d{1,3}(\.\d{3})*(,\d{1,2})?$/.test(v)||/^\d{4,}(,\d{1,2})?$/.test(v)){
    v=v.replace(/\./g,'').replace(',','.');
    return(neg?-1:1)*parseFloat(v);
  }
  if(/^\d{1,3}(,\d{3})*(\.\d{1,2})?$/.test(v)||/^\d{4,}(\.\d{1,2})?$/.test(v)){
    v=v.replace(/,/g,'');
    return(neg?-1:1)*parseFloat(v);
  }
  if(/^\d+$/.test(v))return(neg?-1:1)*parseInt(v,10);
  return parseFloat((neg?'-':'')+v.replace(/,/g,''));
}

// ── Bank category mapping (Caisse d'Epargne) ─────────────
function ceCatMap(nativeCat){
  if(!nativeCat)return null;
  const n=nativeCat.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(n.includes('salaire')||n.includes('revenu'))return null;
  if(n.includes('logement')||n.includes('internet')||n.includes('telephon')||n.includes('energie')||n.includes('eau'))return 'Logement';
  if(n.includes('alimentation')||n.includes('courses')||n.includes('supermarche')||n.includes('restaurant'))return 'Alimentation';
  if(n.includes('transport')||n.includes('carburant')||n.includes('voiture'))return 'Transport';
  if(n.includes('sante')||n.includes('medical')||n.includes('pharmacie'))return 'Sante';
  if(n.includes('loisir')||n.includes('sport')||n.includes('vacances'))return 'Loisirs';
  if(n.includes('vetement')||n.includes('habillement'))return 'Vetements';
  if(n.includes('epargne')||n.includes('livret')||n.includes('placement'))return 'Epargne';
  return null;
}

// ── Bank parsers ─────────────────────────────────────────
const PARSERS=[
  {
    id:'ce',name:"Caisse d'Epargne",
    detect:h=>(h.includes('libelle simplifie')||h.includes('libelle operation'))&&(h.includes('debit')&&h.includes('credit'))&&(h.includes('date de comptabilisation')||h.includes('informations complementaires')||h.includes('sous categorie')),
    parse(lines){return lines.map(r=>{
      const c=csvSplit(r,window._csvSep);if(c.length<10)return null;
      const date=csvDate(c[10])||csvDate(c[0]);
      const label=(c[1]||c[2]||'').trim();
      const deb=c[8]?csvAmount(c[8]):0;
      const cred=c[9]?csvAmount(c[9]):0;
      let amount=0;
      if(!isNaN(deb)&&deb!==0)amount=deb;
      else if(!isNaN(cred)&&cred!==0)amount=cred;
      else return null;
      if(!date||!label||isNaN(amount))return null;
      return{date,label,amount,_nativeCat:c[6]||''};
    }).filter(Boolean);}
  },
  {
    id:'boursobank',name:'Boursobank',
    detect:h=>h.includes('dateop')||(h.includes('libelle')&&h.includes('montant')&&h.includes('devise')),
    parse(lines){return lines.map(r=>{
      const c=csvSplit(r,window._csvSep);if(c.length<3)return null;
      let date,label,amount;
      if(c.length>=6&&c[0].match(/\d{2}\/\d{2}\/\d{4}/)){
        date=csvDate(c[0]);label=c[2]||c[1];
        amount=c[4]?-csvAmount(c[4]):csvAmount(c[5]);
      } else{date=csvDate(c[0]);label=c[1];amount=csvAmount(c[2]);}
      return(date&&label&&!isNaN(amount))?{date,label,amount}:null;
    }).filter(Boolean);}
  },
  {
    id:'bnp',name:'BNP Paribas',
    detect:h=>h.includes('libelle simplifie')||h.includes('numero de reference'),
    parse(lines){return lines.map(r=>{
      const c=csvSplit(r,window._csvSep);if(c.length<4)return null;
      const date=csvDate(c[0]);const label=c[1]||c[2];
      const amount=csvAmount(c[4]||c[3]);
      return(date&&label&&!isNaN(amount))?{date,label,amount}:null;
    }).filter(Boolean);}
  },
  {
    id:'sg',name:'Societe Generale',
    detect:h=>h.includes('debit')&&h.includes('credit')&&!h.includes('dateop'),
    parse(lines){return lines.map(r=>{
      const c=csvSplit(r,window._csvSep);if(c.length<3)return null;
      const date=csvDate(c[0]);const label=c[1];
      const deb=c[2]?csvAmount(c[2]):0;const cred=c[3]?csvAmount(c[3]):0;
      return(date&&label&&!isNaN(deb-cred))?{date,label,amount:cred-deb}:null;
    }).filter(Boolean);}
  },
  {
    id:'ca',name:'Credit Agricole',
    detect:h=>h.includes('dateop')&&h.includes('dateval'),
    parse(lines){return lines.map(r=>{
      const c=csvSplit(r,window._csvSep);if(c.length<5)return null;
      const date=csvDate(c[0]);const label=c[2]||c[1];
      const deb=c[4]?csvAmount(c[4]):0;const cred=c[5]?csvAmount(c[5]):0;
      return(date&&label)?{date,label,amount:cred-deb}:null;
    }).filter(Boolean);}
  },
  {
    id:'lcl',name:'LCL',
    detect:h=>h.includes('operation')&&h.includes('valeur'),
    parse(lines){return lines.map(r=>{
      const c=csvSplit(r,window._csvSep);if(c.length<3)return null;
      const date=csvDate(c[0]);const label=c[1];
      const deb=c[2]?csvAmount(c[2]):0;const cred=c[3]?csvAmount(c[3]):0;
      return(date&&label)?{date,label,amount:cred-deb}:null;
    }).filter(Boolean);}
  },
  {
    id:'cic',name:'CIC / Credit Mutuel',
    detect:h=>h.includes('libelle')&&h.includes('solde'),
    parse(lines){return lines.map(r=>{
      const c=csvSplit(r,window._csvSep);if(c.length<3)return null;
      const date=csvDate(c[0]);const label=c[1];
      const deb=c[2]?csvAmount(c[2]):0;const cred=c[3]?csvAmount(c[3]):0;
      return(date&&label)?{date,label,amount:cred-deb}:null;
    }).filter(Boolean);}
  },
  {
    id:'revolut',name:'Revolut',
    detect:h=>h.includes('description')&&(h.includes('completed')||(h.includes('date de fin')&&h.includes('montant'))),
    parse(lines){return lines.map(r=>{
      const c=csvSplit(r,window._csvSep);if(c.length<6)return null;
      // Filter savings pocket product (Épargne / Savings)
      const prod=(c[1]||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
      if(/epargne|savings/.test(prod))return null;
      // Filter returned/failed transactions (RENVOYÉ / REVERTED)
      const state=(c[8]||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
      if(/renvoye|reverted|failed/.test(state))return null;
      // Filter internal pocket transfers
      const desc=(c[4]||'').trim();
      if(/^(sur la pocket|retrait depuis une pocket)/i.test(desc))return null;
      // Prefer settlement date (Date de fin / Completed Date)
      const date=csvDate(c[3])||csvDate(c[2])||csvDate(c[0]);
      const label=desc||c[1]||'';
      const amount=csvAmount(c[5]);
      return(date&&label&&!isNaN(amount)&&Math.abs(amount)>=0.01)?{date,label,amount}:null;
    }).filter(Boolean);}
  },
  {
    id:'n26',name:'N26',
    detect:h=>h.includes('account number')||h.includes('payee name'),
    parse(lines){return lines.map(r=>{
      const c=csvSplit(r,window._csvSep);if(c.length<3)return null;
      const date=csvDate(c[0]);const label=c[1];
      const amount=csvAmount(c[4]||c[2]);
      return(date&&label&&!isNaN(amount))?{date,label,amount}:null;
    }).filter(Boolean);}
  },
  {
    id:'generic',name:'Format generique',
    detect:()=>true,
    parse(lines){return lines.map(r=>{
      const c=csvSplit(r,window._csvSep);if(c.length<2)return null;
      const date=c.map(csvDate).find(Boolean);
      const amounts=c.map(csvAmount).filter(v=>!isNaN(v)&&v!==0);
      const label=c.find(x=>x.length>3&&!csvDate(x)&&isNaN(csvAmount(x)));
      if(!date||!label||!amounts.length)return null;
      return{date,label,amount:amounts[0]};
    }).filter(r=>r&&r.date&&r.label);}
  }
];

// ── Rule categoriser ──────────────────────────────────────
function ruleCat(label,row){
  if(row&&row._nativeCat){
    const mapped=ceCatMap(row._nativeCat);
    if(mapped&&mapped!=='Autre')return mapped;
  }
  const l=label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  for(const rule of CATEGORY_RULES){
    if(rule.kw.some(kw=>l.includes(kw)))return rule.cat;
  }
  return 'Autre';
}

        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:600,messages:[{role:'user',content:prompt}]})
      });
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      const dat=await resp.json();
      const txt=dat.content[0].text.trim().replace(/```json?|```/g,'').trim();
      const arr=JSON.parse(txt);
      const catMap={};
      arr.forEach(x=>{if(CATS.some(c=>c.name===x.cat))catMap[x.i]=x.cat;});
      batch.forEach((r,i)=>results.push({...r,cat:catMap[i]||ruleCat(r.label,r),aiCat:catMap[i]!=null}));
    }catch(e){
      console.warn('AI batch failed:',e);
      batch.forEach(r=>results.push({...r,cat:ruleCat(r.label,r),aiCat:false}));
    }
  }
  updateProgress(rows.length,rows.length,'');
  return results;
}
