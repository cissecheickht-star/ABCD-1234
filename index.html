}

// ── Subscription detector ─────────────────────────────────
function detectRecurring(rows){
  const seenKeys=new Set();
  const deduped=rows.filter(r=>{
    const k=`${r.date}|${Math.round(Math.abs(r.amount)*100)}|${(r.label||'').slice(0,30)}`;
    if(seenKeys.has(k))return false;seenKeys.add(k);return true;
  });
  const expenses=deduped.filter(r=>r.amount<0);
  const groups={};
  expenses.forEach(r=>{
    const key=r.label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/\d{4,}/g,'').replace(/\b\d{1,3}\b/g,'').replace(/[\/\-_\.]/g,' ')
      .replace(/\s+/g,' ').trim().slice(0,40);
    if(!groups[key])groups[key]=[];
    groups[key].push({date:r.date,amount:Math.abs(r.amount),rawLabel:r.label});
  });
  const detected=[];
  Object.entries(groups).forEach(([key,items])=>{
    if(items.length<2)return;
    items.sort((a,b)=>a.date.localeCompare(b.date));
    const amounts=items.map(i=>i.amount);
    const avgAmt=amounts.reduce((s,a)=>s+a,0)/amounts.length;
    const consistent=amounts.every(a=>Math.abs(a-avgAmt)/avgAmt<0.05);
    if(!consistent)return;
    const intervals=[];
    for(let i=1;i<items.length;i++){
      const d1=new Date(items[i-1].date),d2=new Date(items[i].date);
      intervals.push((d2-d1)/86400000);
    }
    if(!intervals.length)return;
    const avgInterval=intervals.reduce((s,v)=>s+v,0)/intervals.length;
    let freq=null;
    if(avgInterval>=6&&avgInterval<=8)freq='weekly';
    else if(avgInterval>=26&&avgInterval<=35)freq='monthly';
    else if(avgInterval>=85&&avgInterval<=98)freq='quarterly';
    else if(avgInterval>=170&&avgInterval<=196)freq='biannual';
    else if(avgInterval>=350&&avgInterval<=380)freq='yearly';
    if(!freq)return;
    const nameNorm=items[0].rawLabel.toLowerCase();
    const alreadyExists=data.s.some(s=>s.name.toLowerCase()===nameNorm||(s.a&&Math.abs(s.a-avgAmt)<0.5&&s.freq===freq));
    if(alreadyExists)return;
    const displayName=items.reduce((best,cur)=>cur.rawLabel.length<best.length?cur.rawLabel:best,items[0].rawLabel)
      .replace(/^(prlv sepa |virement |cb |paiement |achat )/i,'')
      .replace(/\s+\d{6,}.*$/,'').trim().split(' ').slice(0,4).join(' ');
    const svcMatch=SERVICE_BANK.find(s=>
      displayName.toLowerCase().includes(s.name.toLowerCase())||
      s.name.toLowerCase().includes(displayName.toLowerCase().split(' ')[0])
    );
    const lastDate=new Date(items[items.length-1].date);
    if(freq==='weekly')lastDate.setDate(lastDate.getDate()+7);
    else if(freq==='monthly')lastDate.setMonth(lastDate.getMonth()+1);
    else if(freq==='quarterly')lastDate.setMonth(lastDate.getMonth()+3);
    else if(freq==='biannual')lastDate.setMonth(lastDate.getMonth()+6);
    else if(freq==='yearly')lastDate.setFullYear(lastDate.getFullYear()+1);
    detected.push({
      key:key.slice(0,20)+'_'+Math.round(avgAmt*100),
      name:svcMatch?.name||displayName||key,
      amount:Math.round(avgAmt*100)/100,
      freq,count:items.length,
      nextDate:lastDate.toISOString().slice(0,10),
      domain:svcMatch?.domain||'',
      color:svcMatch?.color||'#888',
    });
  });
  return detected.sort((a,b)=>b.count-a.count);
}

// ── PDF IMPORT — Relevés bancaires FR (CE, BNP, SG, CA, LCL, CIC) ──
async function readPDFFile(file){
  if(typeof pdfjsLib==='undefined'){toast('PDF.js non chargé','err');return null;}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const allRows=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const tc=await page.getTextContent();
    const rawItems=[];
    tc.items.forEach(item=>{
      if(!item.str)return;
      let t=item.str.replace(/[\u00a0\u2009\u202f]/g,' ').trim();
      if(!t)return;
      rawItems.push({x:Math.round(item.transform[4]),y:Math.round(item.transform[5]),t});
    });
    if(!rawItems.length)continue;
    rawItems.sort((a,b)=>b.y-a.y||a.x-b.x);
    const merged=[];
    let curY=rawItems[0].y, curGroup=[rawItems[0]];
    for(let j=1;j<rawItems.length;j++){
      if(Math.abs(rawItems[j].y-curY)<=3){
        curGroup.push(rawItems[j]);
      }else{
        merged.push(curGroup);
        curY=rawItems[j].y;
        curGroup=[rawItems[j]];
      }
    }
    merged.push(curGroup);
    merged.forEach(group=>{
      group.sort((a,b)=>a.x-b.x);
      const text=group.map(i=>i.t).join(' ').trim();
      if(text)allRows.push({y:group[0].y,items:group,text,pg:i});
    });
  }
  console.log('[PDF] Pages:',pdf.numPages,'Lignes extraites:',allRows.length);
  if(allRows.length&&allRows.length<5)console.log('[PDF] Contenu:',allRows.map(r=>r.text));
  return allRows;
}
function _pdfFrAmt(s){
  if(!s)return NaN;
  let c=s.replace(/[\s\u00a0]/g,'');
  const ci=c.lastIndexOf(','),di=c.lastIndexOf('.');
  if(ci>di){c=c.replace(/\./g,'').replace(',','.');}
  else{c=c.replace(/,/g,'');}
  return parseFloat(c);
}
const _PDF_SKIP=[
  /solde\s*(au|en|de|du|pr[eé]c[eé]dent|nouv|init|final|cr[eé]dit|d[eé]bit)/i,
  /total\s*(des|d[e'])\s*(op[eé]r|mouv|d[eé]bit|cr[eé]dit)/i,
  /^page\s+\d/i, /^\d+\s*\/\s*\d+$/,
  /date\s+(d[e']\s*)?op[eé]r/i, /date\s+valeur/i,
  /^date\s+lib[eé]ll[eé]/i, /^(iban|bic|rib)\b/i,
  /n[°o]\s*(de\s+)?compte/i, /relev[eé]\s*(de\s+)?compte/i,
  /arr[eê]t[eé]\s*(au|en|du)/i, /ancien\s+solde/i, /nouveau\s+solde/i,
  /^(r[eé]capitulatif|r[eé]sum[eé]|synth[eè]se)/i,
  /^(monsieur|madame|m\.|mme)\s/i, /titulaire/i, /www\./i,
  /^\s*[-=_]{3,}\s*$/, /courrier|adresse|t[eé]l[eé]phone/i,
  /^(d[eé]bit|cr[eé]dit|montant|date|lib[eé]ll[eé]|op[eé]ration|nature|valeur)\s*$/i,
  /^(caisse\s+d|bnp\s+par|soci[eé]t[eé]\s+g[eé]n|cr[eé]dit\s+(agri|mutu|lyon)|lcl\b(?!\s+(a|à)\s+la)|cic\b|banque\s+pop|la\s+banque\s+post)/i,
  /^totaux\b/i, /ecritures\s+de\s+la/i,
  /votre\s+conseiller/i, /service\s+client/i, /agence\s+de/i
];
function _pdfSkip(t){return _PDF_SKIP.some(rx=>rx.test(t));}

function _pdfDetectCols(rows){
  const c={dX:-1,cX:-1,mX:-1,mode:'guess'};
  for(const r of rows){
    const tl=r.text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(/(debit)/.test(tl)&&/(credit)/.test(tl)){
      c.mode='debit_credit';
      for(const it of r.items){
        const w=it.t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
        if(/debit/.test(w))c.dX=it.x;
        if(/credit/.test(w))c.cX=it.x;
      }
      break;
    }
    if(/montant/.test(tl)&&!/(debit|credit)/.test(tl)){
      c.mode='single';
      for(const it of r.items){if(/montant/i.test(it.t))c.mX=it.x;}
      break;
    }
  }
  return c;
}

function parseBankPDF(rows){
  const results=[];
  const cols=_pdfDetectCols(rows);
  const dateRx=/(\d{1,2})[\/\.\-](\d{1,2})(?:[\/\.\-](\d{2,4}))?/;
  const amtRxG=/(?<!\d)(-?\d{1,3}(?:[\s\u00a0.]\d{3})*,\d{2})\b/g;
  const threshold=(cols.dX>=0&&cols.cX>=0)?(cols.dX+cols.cX)/2:-1;
  let gYear=new Date().getFullYear();
  for(const r of rows){const m4=/\b(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](20\d{2})\b/.exec(r.text);if(m4){gYear=parseInt(m4[3]);break;}}
  let cur=null;
  const flush=()=>{if(cur&&cur._ok&&Math.abs(cur.amount)>=0.01)results.push(cur);};
  for(const row of rows){
    if(_pdfSkip(row.text))continue;
    const stripped=row.text.replace(/^\s+/,'');
    const dm=dateRx.exec(stripped);
    const hasDate=dm&&dm.index<15&&parseInt(dm[1])<=31&&parseInt(dm[2])<=12;
    if(hasDate){
      flush();
      const day=dm[1].padStart(2,'0'),month=dm[2].padStart(2,'0');
      const yr=dm[3]?(dm[3].length===2?'20'+dm[3]:dm[3]):String(gYear);
      const dateStr=yr+'-'+month+'-'+day;
      let amount=0,foundAmt=false;
      if(cols.mode==='debit_credit'&&threshold>0){
        for(const it of row.items){
          const v=it.t.replace(/[\s\u00a0]/g,'');
          if(/^\d[\d\s\u00a0.,]*\d$/.test(v)&&/[,\.]\d{2}$/.test(v)){
            const val=_pdfFrAmt(it.t);
            if(!isNaN(val)&&Math.abs(val)>=0.01){
              amount=it.x<threshold?-Math.abs(val):Math.abs(val);
              foundAmt=true;
            }
          }
        }
      }
      if(!foundAmt){
        const amts=[...row.text.matchAll(amtRxG)];
        if(amts.length){
          const raw=amts[amts.length-1][1];
          amount=_pdfFrAmt(raw);
          if(!isNaN(amount)&&Math.abs(amount)>=0.01){
            foundAmt=true;
            const before=row.text.substring(0,amts[amts.length-1].index).toLowerCase();
            if(/(prlv|prelevement|carte|cb\s|paiement|retrait|ret\s?dab|cheque|chq|cotisation|frais|commission|agios)/.test(before))amount=-Math.abs(amount);
            else if(/(vir\s|virement|avoir|rembours|salaire|paye|pension|alloc)/.test(before)&&amount>0)amount=Math.abs(amount);
            if(/^-/.test(raw.replace(/[\s\u00a0]/g,'')))amount=-Math.abs(amount);
          }
        }
      }
      let label=row.text;
      label=label.replace(/\b\d{1,2}[\/\.\-]\d{1,2}([\/\.\-]\d{2,4})?\b/g,'');
      label=label.replace(/(?<!\d)-?\d{1,3}(?:[\s\u00a0.]\d{3})*,\d{2}/g,'');
      label=label.replace(/\s+/g,' ').replace(/^[\s\-:.*]+|[\s\-:.*]+$/g,'').trim();
      if(!label)label='Operation bancaire';
      cur={dateStr,amount,label:label.substring(0,120),_ok:foundAmt};
    }else if(cur){
      let extra=row.text.trim();
      if(!cur._ok){
        if(cols.mode==='debit_credit'&&threshold>0){
          for(const it of row.items){
            const v=it.t.replace(/[\s\u00a0]/g,'');
            if(/^\d[\d\s\u00a0.,]*\d$/.test(v)&&/[,\.]\d{2}$/.test(v)){
              const val=_pdfFrAmt(it.t);
              if(!isNaN(val)&&Math.abs(val)>=0.01){
                cur.amount=it.x<threshold?-Math.abs(val):Math.abs(val);
                cur._ok=true;
                extra=extra.replace(/(?<!\d)-?\d{1,3}(?:[\s\u00a0.]\d{3})*,\d{2}/g,'').trim();
              }
            }
          }
        }
        if(!cur._ok){
          const amts=[...extra.matchAll(amtRxG)];
          if(amts.length){
            const val=_pdfFrAmt(amts[amts.length-1][1]);
            if(!isNaN(val)&&Math.abs(val)>=0.01){cur.amount=val;cur._ok=true;extra=extra.replace(amtRxG,'').trim();}
          }
        }
      }
      extra=extra.replace(/(?<!\d)-?\d{1,3}(?:[\s\u00a0.]\d{3})*,\d{2}/g,'').trim();
      if(extra&&extra.length>2&&!/^\d{1,2}[\/\.\-]\d{1,2}/.test(extra)){
        cur.label=(cur.label+' '+extra).substring(0,120);
      }
    }
  }
  flush();
  return results.map(r=>({dateStr:r.dateStr,amount:r.amount,label:r.label.substring(0,80)}));
}

function parsePDFLine(line){
  const dateRx=/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/;
  const amtRx=/(-?\s?\d{1,3}(?:[\s\.]\d{3})*[,\.]\d{2})/g;
  const dm=dateRx.exec(line);if(!dm)return null;
  const yr=dm[3].length===2?'20'+dm[3]:dm[3];
  const dateStr=yr+'-'+dm[2].padStart(2,'0')+'-'+dm[1].padStart(2,'0');
  const amounts=[...line.matchAll(amtRx)].map(m=>{
    const s=m[1].replace(/\s/g,'');
    const ci=s.lastIndexOf(','),di=s.lastIndexOf('.');
    return parseFloat(ci>di?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,''));
  }).filter(n=>!isNaN(n)&&Math.abs(n)>=0.01);
  if(!amounts.length)return null;
  const amount=amounts[amounts.length-1];
  const label=line.replace(dateRx,'').replace(amtRx,'').replace(/\s+/g,' ').trim().substring(0,80)||'Import PDF';
  return{dateStr,amount,label};
}

// Smart OCR parser — handles Revolut screenshots + classic bank formats
function parseOCRText(text){
  // Pre-normalize common OCR glitches on decimals/separators
  // "16, 10 €" → "16,10 €" | "16 .10 €" → "16.10 €" | "16 ,10 €" → "16,10 €"
  text=text.replace(/(\d)\s*([,.])\s*(\d)/g,'$1$2$3');
  // Convert middle-dot/bullet used as decimal: "16·10 €" → "16,10 €"
  text=text.replace(/(\d)[·•]\s?(\d{1,3}\s?[€$£])/g,'$1,$2');
  // OCR dropped the comma: "1 50 €" → "1,50 €" | "106 98 €" → "106,98 €"
  // Only when: 1-3 digits, space, exactly 2 digits, space?, currency
  text=text.replace(/(\d{1,3})\s+(\d{2})(\s?[€$£])/g,'$1,$2$3');
  // OCR apostrophe as decimal: "1'50 €" → "1,50 €"
  text=text.replace(/(\d)[''‵`′](\d{2})(\s?[€$£])/g,'$1,$2$3');
  // OCR comma replaced by letter (rare): "1l50 €" → "1,50 €"
  text=text.replace(/(\d)[lI|](\d{2})(\s?[€$£])/g,'$1,$2$3');
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const rows=[];
  const MOIS_FR={janvier:1,'février':2,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,'août':8,aout:8,septembre:9,octobre:10,novembre:11,'décembre':12,decembre:12,
    janv:1,'févr':2,fevr:2,avr:4,juil:7,sept:9,oct:10,nov:11,'déc':12,dec:12};
  const today=new Date();
  const _ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const parseAmt=s=>{
    const cl=s.replace(/[€$£\s]/g,'').replace(/[−–]/g,'-');
    const ci=cl.lastIndexOf(','),di=cl.lastIndexOf('.');
    return parseFloat(ci>di?cl.replace(/\./g,'').replace(',','.'):cl.replace(/,/g,''));
  };
  // Amount regex: captures "-106,98 €", "+110 €" (no decimals), "−0,25€", "16,10 €"
  // Accepts 1-3 decimal digits (OCR may add/drop a digit)
  const AMT_RX=/([+\-−–]?\s?\d{1,3}(?:[\s.]\d{3})*(?:[,.]\d{1,3})?)\s?[€$£]/;
  // Weekday parser: "Hier"/"Aujourd'hui"/"Lundi"..."Dimanche" → YYYY-MM-DD
  const JOURS={dimanche:0,lundi:1,mardi:2,mercredi:3,jeudi:4,vendredi:5,samedi:6};
  const parseWeekday=l=>{
    const low=l.toLowerCase().replace(/['']/g,"'").trim();
    if(/^aujourd'?hui\s*$/i.test(low))return _ymd(today);
    if(/^hier\s*$/i.test(low)){const d=new Date(today);d.setDate(d.getDate()-1);return _ymd(d);}
    if(/^avant[- ]hier\s*$/i.test(low)){const d=new Date(today);d.setDate(d.getDate()-2);return _ymd(d);}
    const wd=low.replace(/^(lun|mar|mer|jeu|ven|sam|dim)\.\s+/,'').match(/^(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\s*$/);
    if(wd){
      const target=JOURS[wd[1]];const cur=today.getDay();
      let diff=cur-target;if(diff<=0)diff+=7; // always in the past within last 7 days
      const d=new Date(today);d.setDate(d.getDate()-diff);return _ymd(d);
    }
    return null;
  };
  // Detect screenshot formats
  const lowerAll=text.toLowerCase().replace(/['']/g,"'");
  const isRevolut=/(petite monnaie|solde actuel|virement instantan)/i.test(lowerAll);
  // Single-transaction detail view (Apple Wallet / LCL): "État : accepté", "Total", "Contacter LCL"
  const isTxDetail=/[ée]tat\s*:\s*(accept|refus|en\s*attente)/i.test(lowerAll)
    && /(contacter|signaler|l'app cartes|mastercard|visa)/i.test(lowerAll);
  if(isTxDetail){
    // Find amount (largest/first amount in the text)
    let amount=null, label=null, dateStr=_ymd(today);
    for(let i=0;i<lines.length;i++){
      const m=lines[i].match(AMT_RX);
      if(m && amount===null){
        amount=parseAmt(m[1]);
        // Label is usually the line right after the big amount (or a few lines after)
        for(let j=i+1;j<Math.min(i+4,lines.length);j++){
          const next=lines[j].trim();
          if(next.length>=2 && !AMT_RX.test(next) && !/^\d{2}\/\d{2}\/\d{2,4}/.test(next)
             && !/[ée]tat\s*:/i.test(next) && !/mastercard|visa|inventive/i.test(next.toLowerCase())
             && !/^total\b/i.test(next.toLowerCase())){
            label=next; break;
          }
        }
      }
      // Date DD/MM/YYYY [HH:MM]
      const dm=lines[i].match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if(dm){
        const dd=parseInt(dm[1]),mo=parseInt(dm[2]);
        let yr=parseInt(dm[3]);if(yr<100)yr+=2000;
        dateStr=`${yr}-${String(mo).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
      }
    }
    if(amount!==null && label){
      // Detail view of a card transaction = debit (make negative if no sign)
      if(amount>0)amount=-amount;
      const isDup=data.t.some(t=>t.d===dateStr&&Math.abs(t.a-Math.abs(amount))<0.01);
      rows.push({date:dateStr,label:label.substring(0,80),amount,cat:ruleCat(label),isDup});
      return rows;
    }
  }
  // LCL/Apple Pay: weekday labels after transactions, no sign on amounts = all debits
  const isLCLPay=/(derni[èe]res transactions|apple pay|inventive|\blcl\b)/i.test(lowerAll)
    || /\n\s*(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|hier|aujourd'?hui)\s*\n/i.test('\n'+lines.join('\n')+'\n');
  if(isLCLPay && !isRevolut){
    // Strategy: find transaction lines (label + amount), then look AFTER for weekday label
    const isCardNoise=l=>{
      const low=l.toLowerCase().trim();
      if(/^derni[èe]res transactions/i.test(low))return true;
      if(/^apple pay\s*$/i.test(low))return true;
      if(/^(inventive|lcl|debit|credit)\s*$/i.test(low))return true;
      if(/^\d{1,2}:\d{2}/.test(low))return true; // time
      if(/^\.{2,}\s*\d{3,4}\s*$/.test(low))return true; // "•••• 3713"
      if(/^\d+\s*$/.test(low))return true;
      return false;
    };
    // Build list of (label, amount, lineIdx)
    const txs=[];
    for(let i=0;i<lines.length;i++){
      if(isCardNoise(lines[i]))continue;
      if(parseWeekday(lines[i])!==null)continue;
      const amtM=lines[i].match(AMT_RX);
      if(amtM){
        let label=lines[i].replace(AMT_RX,'').replace(/[>›→·•]/g,'').trim();
        // Strip trailing "Apple Pay" if stuck on same line
        label=label.replace(/\s*apple\s*pay\s*$/i,'').trim();
        if(label.length>=2){
          let amount=parseAmt(amtM[1]);
          // HEURISTIC: Card screenshots have small amounts (coffee, snacks, lunch).
          // If OCR merged "1,50" → "150" (3 digits, no decimal, 100-999), divide by 100.
          // Consumer contactless is capped at 50€ in France, so 100-999€ unlikely.
          const raw=amtM[1].trim().replace(/^[+\-−–]/,'').replace(/\s/g,'');
          if(!/[,.]/.test(raw)&&/^\d{3}$/.test(raw)&&Math.abs(amount)>=100&&Math.abs(amount)<=999){
            amount=amount/100;
          }
          // In card transaction list, amounts with no sign are DEBITS
          if(!/^[+\-−–]/.test(amtM[1].trim()))amount=-Math.abs(amount);
          if(!isNaN(amount)&&Math.abs(amount)>=0.01){
            txs.push({label:label.substring(0,80),amount,lineIdx:i});
          }
        }
      }
    }
    // Assign weekday from the nearest following weekday label (within next 4 lines)
    txs.forEach(t=>{
      let d=_ymd(today);
      for(let j=t.lineIdx+1;j<Math.min(t.lineIdx+5,lines.length);j++){
        const w=parseWeekday(lines[j]);
        if(w){d=w;break;}
        // If another transaction encountered before a weekday, stop
        if(lines[j].match(AMT_RX)&&!isCardNoise(lines[j]))break;
      }
      const isDup=data.t.some(x=>x.d===d&&Math.abs(x.a-Math.abs(t.amount))<0.01);
      rows.push({date:d,label:t.label,amount:t.amount,cat:ruleCat(t.label),isDup});
    });
    if(rows.length)return rows;
  }
  // Revolut screenshot detection (weekday BEFORE transactions, signed amounts)
  if(isRevolut||/aujourd'?hui|^hier\b/im.test(text)){
    let curDate=_ymd(today);
    // Noise patterns to skip entirely
    const isNoise=l=>{
      const low=l.toLowerCase().replace(/[''·•]/g,' ').trim();
      if(/^petite monnaie/i.test(low))return true;         // petite monnaie row
      if(/^solde actuel/i.test(low))return true;            // solde header
      if(/^virement instantan/i.test(low))return true;      // description line
      if(/^\d{1,2}:\d{2}/.test(low))return true;            // time line "19:30" or "19:30 -0,02 €"
      if(/^[+\-−–]\s?\d{1,3}(?:[\s.]\d{3})*(?:[,.]\d{2})?\s?[€$£]?\s*$/.test(l.trim()))return true; // daily summary "+2 €"
      if(/^\d{1,3}(?:[,.]\d{2})?\s?[€$£]\s*$/.test(l.trim()))return true; // solde "10,07 €"
      if(/^\d+\s*$/.test(l.trim()))return true;             // standalone number
      return false;
    };
    // Is this a date header line?
    const parseDateHeader=l=>{
      const low=l.toLowerCase().replace(/['']/g,"'");
      // "aujourd'hui" possibly followed by amount
      if(/aujourd'?hui/i.test(low))return _ymd(today);
      // "hier" possibly followed by amount
      if(/^hier\b/i.test(low)){const d=new Date(today);d.setDate(d.getDate()-1);return _ymd(d);}
      // "31 mars" or "lun. 31 mars" etc.
      const dm=low.match(/(\d{1,2})\s+(janvier|f[ée]vrier|fevrier|mars|avril|mai|juin|juillet|ao[uû]t|aout|septembre|octobre|novembre|d[ée]cembre|decembre|janv|f[ée]vr|fevr|avr|juil|sept|oct|nov|d[ée]c|dec)/i);
      if(dm){
        const day=parseInt(dm[1]);
        const mo=MOIS_FR[dm[2].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')];
        if(!mo){const mo2=MOIS_FR[dm[2].toLowerCase()];if(mo2){let yr=today.getFullYear();if(mo2>today.getMonth()+1)yr--;return `${yr}-${String(mo2).padStart(2,'0')}-${String(day).padStart(2,'0')}`;}}
        if(mo){let yr=today.getFullYear();if(mo>today.getMonth()+1||(mo===today.getMonth()+1&&day>today.getDate()))yr--;return `${yr}-${String(mo).padStart(2,'0')}-${String(day).padStart(2,'0')}`;}
      }
      return null;
    };
    for(let i=0;i<lines.length;i++){
      // Check date header
      const dateH=parseDateHeader(lines[i]);
      if(dateH!==null){curDate=dateH;continue;}
      // Skip noise
      if(isNoise(lines[i]))continue;
      // Transaction line: "MerchantName -106,98 €" (name + amount on same line)
      const amtM=lines[i].match(AMT_RX);
      if(amtM){
        const label=lines[i].replace(AMT_RX,'').replace(/[·•]/g,'').trim();
        const amount=parseAmt(amtM[1]);
        if(label.length>=2&&!isNaN(amount)&&Math.abs(amount)>=0.01){
          const isDup=data.t.some(t=>t.d===curDate&&Math.abs(t.a-Math.abs(amount))<0.01);
          rows.push({date:curDate,label:label.substring(0,80),amount,cat:ruleCat(label),isDup});
        }
      }
    }
  }
  // If Revolut parser found rows, return them
  if(rows.length)return rows;
  // Fallback: classic bank PDF line-by-line parser
  lines.forEach(line=>{
    const parsed=parsePDFLine(line);
    if(!parsed)return;
    const{dateStr,amount,label}=parsed;
    const isDup=data.t.some(t=>t.d===dateStr&&Math.abs(t.a-Math.abs(amount))<0.01);
    rows.push({date:dateStr,label,amount,cat:ruleCat(label),isDup});
  });
  return rows;
}

      if(!rows.length)toast('Aucune transaction detectee \u2014 verifiez l\'image','warn');
      else toast(rows.length+' ligne'+(rows.length>1?'s':'')+' extraite'+(rows.length>1?'s':'')+' de l\'image');
    };
    if(hasPositive){
      const posCount=allRows.filter(r=>r.amount>0).length;
      const negCount=allRows.filter(r=>r.amount<0).length;
      const posSum=allRows.filter(r=>r.amount>0).reduce((s,r)=>s+r.amount,0);
      openSheet('Revenus détectés',`<div style="text-align:center;padding:10px 0"><p class="mono xs" style="color:var(--text);line-height:1.6;margin-bottom:16px">${posCount} revenu${posCount>1?'s':''} détecté${posCount>1?'s':''} pour un total de <b style="color:var(--green)">+${fmtEur(posSum)}</b></p><p class="mono xxs" style="color:var(--muted);line-height:1.5;margin-bottom:20px">${negCount} dépense${negCount>1?'s':''} seront importées dans tous les cas.</p><p class="mono xxs" style="color:var(--muted);margin-bottom:20px">Voulez-vous aussi importer les revenus ?</p><div style="display:flex;gap:10px;justify-content:center"><button class="submit" style="flex:1" onclick="closeSheet();window._ocrIncludePos(true)">Oui, tout importer</button><button class="submit" style="flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text)" onclick="closeSheet();window._ocrIncludePos(false)">Dépenses uniquement</button></div></div>`,null);
      window._ocrIncludePos=(includePos)=>{
        const rows=includePos?allRows:allRows.filter(r=>r.amount<0);
        showPreview(rows);
        delete window._ocrIncludePos;
      };
      return;
    }
    showPreview(allRows);
  }catch(e){
    console.error('OCR error',e);
    toast('Erreur OCR : '+e.message,'err');
    if(statusEl)statusEl.style.display='none';
    if(prev){prev.src='';prev.style.display='none';}
  }
}

function startImport(file){
  if(!file){toast('Aucun fichier selectionne','err');return;}
  if(file.name.toLowerCase().endsWith('.pdf')){startImportPDF(file);return;}
  if(/\.(jpe?g|png|gif|webp|bmp)$/i.test(file.name)){startImportImage(file);return;}
  const statusEl=document.getElementById('importStatus');
  const msgEl=document.getElementById('importStatusMsg');
  const pbEl=document.getElementById('importProgressBar');
  if(statusEl)statusEl.style.display='block';
  if(msgEl)msgEl.textContent='Lecture de '+file.name+'...';
  if(pbEl)pbEl.style.width='10%';
  const reader=new FileReader();
  reader.onload=function(ev){if(pbEl)pbEl.style.width='30%';parseAndPreview(ev.target.result,file.name);};
  reader.onerror=function(){toast('Impossible de lire ce fichier','err');};
  reader.readAsText(file,'UTF-8');
}

    return `<div class="mono xxs" style="color:var(--muted);padding:8px 10px;background:rgba(255,255,255,.03);border-radius:8px;margin-bottom:10px">💡 Ajoute un actif ou un objectif pour activer la répartition auto sur les revenus importés.</div>`;
  }
  const destOptions=(selKey)=>{
    let opts='';
    if(assets.length)opts+=`<optgroup label="Actifs">${assets.map(a=>`<option value="asset:${a.id}"${selKey===`asset:${a.id}`?' selected':''}>💎 ${esc(a.name)}</option>`).join('')}</optgroup>`;
    if(goals.length)opts+=`<optgroup label="Objectifs">${goals.map(g=>`<option value="goal:${g.id}"${selKey===`goal:${g.id}`?' selected':''}>🎯 ${esc(g.name)}</option>`).join('')}</optgroup>`;

  const rows=_importAllocations.map((a,i)=>{

      <input type="number" min="0" max="100" step="0.5" value="${a.pct||0}" onchange="_updateImportAlloc(${i},'pct',this.value)" style="width:62px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:6px;border-radius:6px;text-align:right">

    </div>`;
  }).join('');
  const totalPct=_importAllocations.reduce((s,a)=>s+(Number(a.pct)||0),0);
  const incomes=_importPreview.filter(r=>!r.isDup&&r.amount>0);

function _updateImportAlloc(i,field,value){
  if(!_importAllocations[i])return;
  if(field==='dest'){
    const [type,id]=value.split(':');

    _importAllocations[i].id=id;

  }
  refreshPreview();
}

function refreshPreview(){

async function parseAndPreview(text,filename){
  text=text.replace(/^\uFEFF/,'');
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length<2){
    toast('Fichier vide ou non reconnu','err');
    const s=document.getElementById('importStatus');if(s)s.style.display='none';
    return;
  }
  const header=lines[0].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  window._csvSep=detectCsvSep(lines[0]);
  const parser=PARSERS.find(p=>p.detect(header))||PARSERS[PARSERS.length-1];
  toast('Format detecte : '+parser.name);
  const rawRows=parser.parse(lines.slice(1));
  if(!rawRows.length){
    toast('Aucune transaction trouvee — verifiez le format','err');
    const s=document.getElementById('importStatus');if(s)s.style.display='none';
    return;
  }
  _detectedSubs=detectRecurring(rawRows);
  // FIX: dedup key includes label prefix to avoid false positives
  const existingSet=new Set(data.t.map(t=>`${t.d}|${Math.round(Math.abs(t.a)*100)}|${(t.lb||'').slice(0,20)}`));
  const enriched=rawRows.map(r=>({
    ...r,
    isDup:existingSet.has(`${r.date}|${Math.round(Math.abs(r.amount)*100)}|${(r.label||'').slice(0,20)}`),
    cat:'Autre',aiCat:false
  }));
  const toProcess=enriched.filter(r=>!r.isDup);
  const pb=document.getElementById('importProgressBar');
  const msg=document.getElementById('importStatusMsg');
  if(pb)pb.style.width='40%';
  if(msg)msg.textContent=`Categorisation de ${toProcess.length} transactions...`;
  const categorized=toProcess.length?await aiCategorize(toProcess):[];
  if(pb)pb.style.width='100%';
  let ci=0;
  _importPreview=enriched.map(r=>{
    if(r.isDup)return r;
    return categorized[ci++]||{...r,cat:ruleCat(r.label,r),aiCat:false};
  });
  setTimeout(()=>refreshPreview(),200);
}

function removeImportRow(i){_importPreview.splice(i,1);refreshPreview();}
function updateImportAmount(i,val){
  const v=parseInput(val);if(isNaN(v))return;
  _importPreview[i].amount=v;
  const inputs=document.querySelectorAll('#importPreview table tbody tr:not(.dup-row) td:nth-child(3) input');
  let idx=0;
  _importPreview.forEach(r=>{
    if(r.isDup)return;
    if(inputs[idx])inputs[idx].style.color=r.amount>=0?'var(--green)':'var(--pink)';
    idx++;
  });
  const rows=_importPreview;
  const totalExp=rows.filter(r=>!r.isDup&&r.amount<0).reduce((s,r)=>s+Math.abs(r.amount),0);
  const totalInc=rows.filter(r=>!r.isDup&&r.amount>=0).reduce((s,r)=>s+r.amount,0);
  const elExp=document.getElementById('impTotalExp');const elInc=document.getElementById('impTotalInc');
  if(elExp)elExp.textContent='-'+fmtEur(totalExp);
  if(elInc)elInc.textContent='+'+fmtEur(totalInc);
}

function confirmImport(){
  const toImport=_importPreview.filter(r=>!r.isDup);
  if(!toImport.length){toast('Rien a importer','err');return;}
  // Nettoie les allocations invalides (dest disparue ou pct 0)
  const validAllocs=_importAllocations.filter(a=>{
    if(!a.pct||a.pct<=0)return false;
    if(a.type==='asset')return (data.assets||[]).some(x=>x.id===a.id);
    if(a.type==='goal')return (data.goals||[]).some(x=>x.id===a.id);
    return false;
  });
  let transfersCreated=0;
  toImport.forEach(r=>{
    const tp=r.cat==='Salaire'?'i':(r.amount>=0?'i':'e');
    const mainTx={id:gid(),lb:r.label,a:Math.abs(r.amount),c:r.cat,d:r.date,tp};
    data.t.push(mainTx);
    // Applique les allocations UNIQUEMENT sur les revenus
    if(tp==='i'&&validAllocs.length){
      validAllocs.forEach(alloc=>{
        const amt=Math.abs(r.amount)*alloc.pct/100;
        if(amt<0.01)return;
        const destName=_transferLabel({type:alloc.type,id:alloc.id}).replace(/^[💎🎯]\s*/,'');
        const xferTx={
          id:gid(),
          lb:`Transfert → ${destName} (${alloc.pct}%)`,
          a:amt,
          c:'Épargne',
          d:r.date,
          tp:'e',
          transfer:{type:alloc.type,id:alloc.id},
          _fromImportInc:mainTx.id
        };
        data.t.push(xferTx);
        _applyTxTransfer(xferTx);
        transfersCreated++;
      });
    }
  });
  save();
  _importPreview=[];
  _importAllocations=[];
  const msg=transfersCreated>0
    ?`${toImport.length} tx importées · ${transfersCreated} transfert${transfersCreated>1?'s':''} créé${transfersCreated>1?'s':''}`
    :`${toImport.length} transaction${toImport.length>1?'s':''} importées`;
  toast(msg);
  navTo('history');
}

function toggleDailyReminder(on){
  localStorage.setItem('dailyReminder',on?'true':'false');
  if(on&&'Notification' in window&&Notification.permission==='default'){
    Notification.requestPermission().then(p=>{
      if(p==='granted')toast('Notifications activées');
      else if(p==='denied'){toast('Notifications bloquées par le navigateur','err');localStorage.setItem('dailyReminder','false');const el=document.getElementById('reminderToggle');if(el)el.checked=false;}
    });
  }else if(on){toast('Rappel quotidien activé');}
  else{toast('Rappel désactivé');}
}
function _hasTodayExpense(){
  const today=todayStr();
  return data.t.some(t=>t.d===today&&t.tp==='e');
}
function _sendReminder(){
  if(localStorage.getItem('dailyReminder')!=='true')return;
  if(_hasTodayExpense())return;
  const lastSent=localStorage.getItem('_reminderSent');
  if(lastSent===todayStr())return;
  if('Notification' in window&&Notification.permission==='granted'){
    new Notification('Budget Pro 💰',{body:'Vous n\'avez pas encore saisi de dépense aujourd\'hui. Pensez à mettre à jour vos finances !',icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💰</text></svg>',tag:'daily-reminder'});
    localStorage.setItem('_reminderSent',todayStr());
  }else{
    toast('N\'oubliez pas de saisir vos dépenses du jour !');
    localStorage.setItem('_reminderSent',todayStr());
  }
}
let _reminderInterval=null;
function _initReminders(){
  if(_reminderInterval){clearInterval(_reminderInterval);_reminderInterval=null;}
  if(localStorage.getItem('dailyReminder')!=='true')return;
  // Check on load (after 3s to not be intrusive)
  setTimeout(()=>{if(!_hasTodayExpense())_sendReminder();},3000);
  // Evening reminder check every 10 min
  _reminderInterval=setInterval(()=>{
    if(localStorage.getItem('dailyReminder')!=='true'){clearInterval(_reminderInterval);_reminderInterval=null;return;}
    const h=new Date().getHours();
    const target=parseInt(localStorage.getItem('reminderHour')||'20');
    if(h>=target)_sendReminder();
  },600000);
}

// ═══════════════════════════════════════════════════════════
// CALCULATOR IN AMOUNT FIELDS
// ═══════════════════════════════════════════════════════════
function _safeCalc(expr){
  const tokens=expr.match(/(\d+\.?\d*|[+\-*/()])/g);
  if(!tokens)return NaN;
  // Shunting-yard → RPN
  const out=[],ops=[];
  const prec={'+':-1,'-':1,'*':2,'/':2};
  for(const t of tokens){
    if(/^\d/.test(t)){out.push(parseFloat(t));}
    else if(t==='('){ops.push(t);}
    else if(t===')'){while(ops.length&&ops[ops.length-1]!=='(')out.push(ops.pop());ops.pop();}
    else{while(ops.length&&ops[ops.length-1]!=='('&&(prec[ops[ops.length-1]]||0)>=(prec[t]||0))out.push(ops.pop());ops.push(t);}
  }
  while(ops.length)out.push(ops.pop());
  // Evaluate RPN
  const st=[];
  for(const t of out){
    if(typeof t==='number'){st.push(t);}
    else{const b=st.pop(),a=st.pop();if(t==='+')st.push(a+b);else if(t==='-')st.push(a-b);else if(t==='*')st.push(a*b);else if(t==='/')st.push(b!==0?a/b:NaN);}
  }
  return st.length===1?st[0]:NaN;
}
function calcField(el){
  if(!el)return;
  const v=el.value.replace(/\s/g,'').replace(',','.');
  if(/^[\d.+\-*/()]+$/.test(v)&&/[+\-*/]/.test(v)){
    try{const r=_safeCalc(v);if(isFinite(r)){el.value=Math.round(r*100)/100;toast(`= ${el.value}`);}}catch(e){}
  }
}
document.addEventListener('blur',e=>{if(e.target?.classList?.contains('fi')&&e.target.type==='text'&&e.target.inputMode==='decimal')calcField(e.target);},true);

// STREAK / GAMIFICATION
// ═══════════════════════════════════════════════════════════
function _getStreak(){
  const s=JSON.parse(localStorage.getItem('streak')||'{"count":0,"lastDate":""}');
  const today=todayStr();
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
  const yStr=`${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;
  if(s.lastDate===today)return s;
  if(_hasTodayExpense()){
    if(s.lastDate===yStr)s.count++;
    else if(s.lastDate!==today)s.count=1;
    s.lastDate=today;
    if(s.count>(s.best||0))s.best=s.count;
    localStorage.setItem('streak',JSON.stringify(s));
  }else if(s.lastDate!==yStr&&s.lastDate!==today){
    // streak broken but don't reset until end of day
  }
  return s;
}

// ═══════════════════════════════════════════════════════════
// ANNUAL COMPARISON
// ═══════════════════════════════════════════════════════════
function renderAnnualComparison(){
  const yr=sy;const prevYr=yr-1;
  // Compare same months only (jan→current month) for fair comparison
  const maxMonth=yr===new Date().getFullYear()?new Date().getMonth():11;
  let curTotal=0,prevTotal=0;
  const monthData=[];
  for(let m=0;m<=maxMonth;m++){
    const curExp=data.t.filter(t=>{const d=new Date(t.d);return d.getMonth()===m&&d.getFullYear()===yr&&t.tp==='e';}).reduce((s,t)=>s+t.a,0);
    const preExp=data.t.filter(t=>{const d=new Date(t.d);return d.getMonth()===m&&d.getFullYear()===prevYr&&t.tp==='e';}).reduce((s,t)=>s+t.a,0);
    curTotal+=curExp;prevTotal+=preExp;
    monthData.push({m,cur:curExp,pre:preExp});
  }
  if(!prevTotal&&!curTotal)return '';
  const delta=prevTotal>0?Math.round((curTotal/prevTotal-1)*100):0;
  const deltaCol=delta<=0?'var(--green)':'var(--red)';
  const period=maxMonth<11?`Jan—${MSH[maxMonth]}`:'Année';
  // Mini bars for each month
  const maxVal=Math.max(...monthData.map(d=>Math.max(d.cur,d.pre)),1);
  const bars=monthData.map(d=>{
    const h1=Math.round(d.pre/maxVal*28);const h2=Math.round(d.cur/maxVal*28);
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1"><div style="display:flex;gap:1px;align-items:flex-end;height:30px"><div style="width:4px;height:${h1}px;background:var(--muted);border-radius:1px;opacity:.5"></div><div style="width:4px;height:${h2}px;background:var(--pink);border-radius:1px"></div></div><span class="mono" style="font-size:7px;color:var(--muted)">${MSH[d.m][0]}</span></div>`;
  }).join('');
  return `<div class="card"><div class="card-t">Comparaison ${period}</div><div style="display:flex;gap:2px;margin-bottom:12px;align-items:flex-end">${bars}</div><div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;gap:12px"><div><div class="mono xxs" style="color:var(--muted)">${prevYr} <span style="display:inline-block;width:8px;height:8px;background:var(--muted);border-radius:1px;vertical-align:middle;opacity:.5"></span></div><div class="mono xs" style="color:var(--dim);font-weight:600">${fmtEur(prevTotal)}</div></div><div><div class="mono xxs" style="color:var(--muted)">${yr} <span style="display:inline-block;width:8px;height:8px;background:var(--pink);border-radius:1px;vertical-align:middle"></span></div><div class="mono xs" style="color:var(--text);font-weight:600">${fmtEur(curTotal)}</div></div></div><div style="text-align:right"><div class="mono xxs" style="color:var(--muted)">Évolution</div><div class="mono sm" style="color:${deltaCol};font-weight:700">${delta>=0?'+':''}${delta}%</div></div></div></div>`;
}

function _weeklyRecap(){

  // Only show on Sunday
  if(dow!==7)return '';
  const weekStart=new Date(today);weekStart.setDate(today.getDate()-6);
  const wsStr=`${weekStart.getFullYear()}-${String(weekStart.getMonth()+1).padStart(2,'0')}-${String(weekStart.getDate()).padStart(2,'0')}`;
  const weStr=todayStr();
  const weekTxs=data.t.filter(t=>t.d>=wsStr&&t.d<=weStr);

  bar.classList.add('show');

  _undoTimer=setTimeout(()=>{bar.classList.remove('show');_undoStack=[];},5000);
}
function _undoAction(){
  const fn=_undoStack.pop();
  if(fn)fn();
  const bar=document.getElementById('undoBar');
  if(bar)bar.classList.remove('show');
  clearTimeout(_undoTimer);
  _undoStack=[];
  render();
  toast('Action annulée');
}

// 3. DUPLICATE DETECTION AT IMPORT
// ═══════════════════════════════════════════════════════════
function _detectDuplicates(rows){
  return rows.map(r=>{
    const dup=data.t.some(t=>t.d===r.d&&Math.abs(t.a-Math.abs(r.amount))<0.01&&(t.lb||'').toLowerCase().trim()===(r.label||'').toLowerCase().trim());
    return {...r,isDup:dup};
  });
}

document.addEventListener('keydown',e=>{
  // Don't trigger if typing in input
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.key==='ArrowLeft'){changeMonth(-1);e.preventDefault();}
  else if(e.key==='ArrowRight'){changeMonth(1);e.preventDefault();}
  else if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openGlobalSearch();}
  else if(e.key==='Escape'){closeSheet();}
  else if(e.key==='1')navTo('dashboard');
  else if(e.key==='2')navTo('history');
  else if(e.key==='3')navTo('add');
  else if(e.key==='4')navTo('patrimoine');
});

// 6. SEARCH HIGHLIGHT
// ═══════════════════════════════════════════════════════════
function _hl(text,query){
  if(!query||query.length<2)return esc(text);
  const safe=esc(text);
  const re=new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi');
  return safe.replace(re,'<mark class="hl">$1</mark>');
}

// ═══════════════════════════════════════════════════════════
// 7. HEATMAP (dépenses calendrier)
// ═══════════════════════════════════════════════════════════
function renderHeatmap(){
  const first=new Date(sy,sm,1);
  const last=new Date(sy,sm+1,0);
  const startDay=(first.getDay()+6)%7; // Monday=0
  const daysInMonth=last.getDate();
  const today=new Date();
  // Calc daily expenses
  const dailyExp={};
  data.t.filter(t=>{const d=new Date(t.d);return d.getMonth()===sm&&d.getFullYear()===sy&&t.tp==='e';}).forEach(t=>{
    const day=parseInt(t.d.split('-')[2]);
    dailyExp[day]=(dailyExp[day]||0)+t.a;
  });
  const maxExp=Math.max(...Object.values(dailyExp),1);
  // Build grid
  const headers=['L','M','M','J','V','S','D'].map(d=>`<div class="mono" style="text-align:center;font-size:8px;color:var(--muted);padding:2px">${d}</div>`).join('');
  let cells='';
  for(let i=0;i<startDay;i++)cells+='<div class="heatmap-cell empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const exp=dailyExp[d]||0;
    const isFuture=sy===today.getFullYear()&&sm===today.getMonth()&&d>today.getDate();
    const isToday=sy===today.getFullYear()&&sm===today.getMonth()&&d===today.getDate();
    if(isFuture){cells+=`<div class="heatmap-cell future">${d}</div>`;continue;}
    const intensity=exp>0?Math.max(0.15,Math.min(exp/maxExp,1)):0;
    const bg=exp>0?`rgba(200,126,169,${intensity})`:'rgba(126,200,169,.12)';
    const border=isToday?'border:2px solid var(--gold)':'';
    const tip=exp>0?fmtEur(exp):'—';
    cells+=`<div class="heatmap-cell" style="background:${bg};${border};font-size:8px;color:var(--dim)" title="${d}/${sm+1}: ${tip}">${d}</div>`;
  }
  return `<div class="card"><div class="card-t">Heatmap des dépenses</div>
    <div class="heatmap-grid">${headers}${cells}</div>
    <div style="display:flex;justify-content:space-between;margin-top:8px;align-items:center">
      <span class="mono xxs" style="color:var(--muted)">Moins</span>
      <div style="display:flex;gap:2px">${[0,.2,.4,.6,.8,1].map(i=>`<div style="width:12px;height:12px;border-radius:2px;background:rgba(200,126,169,${i||.05})"></div>`).join('')}</div>
      <span class="mono xxs" style="color:var(--muted)">Plus</span>
    </div>
  </div>`;
}

let _bulkSelected=new Set();
let _bulkMode=false;
function toggleBulkMode(){
  _bulkMode=!_bulkMode;
  _bulkSelected.clear();
  reRenderHistory();
}
function toggleBulkSelect(id){
  if(_bulkSelected.has(id))_bulkSelected.delete(id);
  else _bulkSelected.add(id);
  reRenderHistory();
}
function bulkDelete(){
  if(!_bulkSelected.size)return;
  const count=_bulkSelected.size;
  const backup=[...data.t.filter(t=>_bulkSelected.has(t.id))];
  data.t=data.t.filter(t=>!_bulkSelected.has(t.id));
  save();_bulkSelected.clear();_bulkMode=false;
  _showUndo(`${count} transaction${count>1?'s':''} supprimée${count>1?'s':''}`,()=>{data.t.push(...backup);save();});
  render();
}
function bulkRecategorize(){
  if(!_bulkSelected.size)return;
  const opts=_allCats().map(c=>`<option value="${c.name}">${c.icon} ${c.name}</option>`).join('');
  openSheet('Recatégoriser',`<label class="fl">Nouvelle catégorie<select id="bulkCat" class="fs">${opts}</select></label>`,()=>{
    const cat=document.getElementById('bulkCat')?.value;
    if(!cat)return;
    data.t.forEach(t=>{if(_bulkSelected.has(t.id))t.c=cat;});
    save();_bulkSelected.clear();_bulkMode=false;
    closeSheet();toast('Transactions recatégorisées');render();
  });
}
function renderBulkBar(){
  if(!_bulkMode||!_bulkSelected.size)return '';
  return `<div class="bulk-bar">
    <span class="mono xs" style="color:var(--gold);flex:1">${_bulkSelected.size} sélectionnée${_bulkSelected.size>1?'s':''}</span>
    <button class="bulk-btn" onclick="bulkRecategorize()">Recatégoriser</button>
    <button class="bulk-btn danger" onclick="bulkDelete()">Supprimer</button>
    <button class="bulk-btn" onclick="toggleBulkMode()">Annuler</button>
  </div>`;
}

// 9. MEMOIZATION CACHE (variables declared in STATE section)
// ═══════════════════════════════════════════════════════════
function _memoKey(fn,args){return fn+':'+JSON.stringify(args);}
function _memo(fn,args,computeFn){
  const key=_memoKey(fn,args);
  const cached=_memoCache.get(key);
  if(cached&&cached.v===_memoCacheVersion)return cached.result;
  const result=computeFn();
  _memoCache.set(key,{v:_memoCacheVersion,result});
  return result;
}

function updateSplit(){
  const total=parseInput(document.getElementById('splitTotal')?.value)||0;
  const count=parseInt(document.getElementById('splitCount')?.value)||2;
  const tip=parseInt(document.getElementById('splitTip')?.value)||0;
  const withTip=total*(1+tip/100);
  const perPerson=withTip/count;
  const el=document.getElementById('splitResult');
  if(!el)return;
  if(total<=0){el.innerHTML='';return;}
  el.innerHTML=`<div style="text-align:center;padding:16px 0">
    <div class="mono xxs" style="color:var(--muted);margin-bottom:4px">Par personne</div>
    <div style="font-size:28px;font-weight:700;color:var(--gold)">${fmtEur(perPerson)}</div>
    ${tip>0?`<div class="mono xxs" style="color:var(--dim);margin-top:4px">Total avec pourboire : ${fmtEur(withTip)}</div>`:''}
  </div>`;
}

function exportCSV(){
  const txs=[...data.t].sort((a,b)=>b.d.localeCompare(a.d));
  if(!txs.length){toast('Aucune transaction','err');return;}
  const BOM='\uFEFF';
  const header='Date;Libellé;Catégorie;Type;Montant\n';
  const rows=txs.map(t=>`${t.d};${(t.lb||'').replace(/;/g,',')};${t.c};${t.tp==='i'?'Revenu':'Dépense'};${t.tp==='i'?'':'-'}${t.a.toFixed(2).replace('.',',')}`).join('\n');
  const blob=new Blob([BOM+header+rows],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`budget-pro-${todayStr()}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('Export CSV téléchargé');
}

// Pull-to-dismiss on sheet box — uniquement depuis le header/grabber (haut de la sheet)
// pour éviter les faux positifs au scroll du contenu
(function(){
  let startY=0,startX=0,active=false,armed=false;
  const box=document.getElementById('sheetBox');
  if(!box)return;
  const HANDLE_ZONE=60; // px du haut de la sheet où le swipe-to-dismiss est actif
  const THRESHOLD=140;  // distance minimale de swipe (plus tolérant qu'avant)
  box.addEventListener('touchstart',e=>{
    const rect=box.getBoundingClientRect();
    const touchY=e.touches[0].clientY;
    startY=touchY;startX=e.touches[0].clientX;
    armed=(touchY-rect.top)<=HANDLE_ZONE; // seulement si on touche dans le handle
    active=false;
  },{passive:true});
  box.addEventListener('touchmove',e=>{
    if(!armed)return;
    const dy=e.touches[0].clientY-startY;
    const dx=Math.abs(e.touches[0].clientX-startX);
    // Ignore si geste plus horizontal que vertical (évite de fermer en scroll latéral)
    if(dx>Math.abs(dy))return;
    if(dy<=0)return;
    if(dy>10)active=true;
    if(active)box.style.transform=`translateY(${dy}px)`;
  },{passive:true});
  box.addEventListener('touchend',e=>{
    box.style.transform='';
    if(!armed||!active){armed=false;active=false;return;}
    const dy=e.changedTouches[0].clientY-startY;
    if(dy>THRESHOLD)closeSheet();
    armed=false;active=false;
  });
})();
